  // ------------------------------------------------------------ chat / feed
  LobbyUI.say = function (pid, text) {
    const p = this.lobby.get(pid);
    const a = this.actors[pid];
    if (a) a.bubble = { text, until: performance.now() + 2600 };
    this.pushFeed(`<b>${esc(p.name)}:</b> ${esc(text)}`);
  };
  LobbyUI.feedSys = function (text) { this.pushFeed(esc(text), 'sys'); };
  LobbyUI.pushFeed = function (html, cls = '') {
    const f = $('.feed', this.root);
    if (!f) return;
    f.insertAdjacentHTML('beforeend', `<div class="${cls}">${html}</div>`);
    while (f.children.length > 4) f.firstElementChild.remove();
    [...f.children].forEach((c, i) => c.classList.toggle('old', i < f.children.length - 2));
  };

  // ------------------------------------------------------------ per-frame
  LobbyUI.frame = function (dt) {
    const L = this.lobby;
    if (!L) return;
    for (const ev of L.drain()) { this.handle(ev); if (this.lobby !== L) return; }
    const now = L.time;
    // reels + slot sync
    for (const p of L.players) {
      for (const s of SLOTS) {
        const d = this.disp[p.id][s];
        const item = p.loadout[s];
        const el = this.slotEl(p.id, s);
        if (d.end && now >= d.start && now < d.end) {
          if (!d.spinning) { d.spinning = true; el.className = 'slot spinning'; el.querySelector('img').style.visibility = 'visible'; }
          if (now >= d.next) {
            const prog = (now - d.start) / (d.end - d.start);
            const reelItem = this.reelPick(p, s);
            const img = el.querySelector('img');
            img.src = reelItem;
            UI.restartAnim(el, 'spinning');
            CW.Sfx.play('tick', { quiet: !p.isHuman, pitch: prog * 400, gap: p.isHuman ? 0 : 0.06 });
            d.next = now + (0.05 + 0.3 * Math.pow(prog, 2.2)) * Math.sqrt(L.k);
            const teaseIt = d.item && (CW.tierOf(d.item.rarity) >= 3 || d.fakeout);
            if (teaseIt && prog > 0.5 && !d.teased) { d.teased = true; el.classList.add('tease'); CW.Sfx.play('tease'); }
            else if (d.teased) el.classList.add('tease');
          }
          continue;
        }
        if (d.spinning && now >= d.end) {
          // reveal event will finalize; failsafe if it was replaced
          if (item && (d.uid !== item.uid)) { d.spinning = false; }
        }
        if (!item || d.hold || d.spinning) continue;
        if (now < p.revealAt[s]) continue;
        if (d.uid !== item.uid || d.rarity !== item.rarity || d.cracks !== item.cracks) {
          d.uid = item.uid; d.rarity = item.rarity; d.cracks = item.cracks;
          this.setSlotFinal(el, item);
        }
        el.classList.toggle('busy', !!item._busy);
      }
      const card = this.cardEl(p.id);
      const st = card.querySelector('.status');
      if (st.textContent !== p.status) { st.textContent = p.status; st.className = 'status s-' + p.status.replace(/[^A-Z]/g, ''); }
      card.classList.toggle('shielded', p.shieldUntil > now);
      card.classList.toggle('guarded', p.guardUntil > now);
    }
    this.renderTop();
    this.renderPot();
    this.renderActionBar();
    this.renderTargets();
    this.drawCrowd(dt);
    if (this.countdownEl) {
      const n = Math.max(1, Math.ceil(L.phaseRemaining() / L.k - 0.5));
      if (n !== this._cdLast) { this._cdLast = n; const e = this.countdownEl.querySelector('.cd-n'); e.textContent = n; UI.restartAnim(e, 'pop'); CW.Sfx.play('countdown', { final: n === 1 }); }
    }
  };

  LobbyUI.reelPick = function (p, s) {
    const rs = CW.RARITY_ORDER;
    const r = rs[Math.floor(Math.random() * 4)];
    if (s === 'hero') return CW.Art.heroIcon(CW.CLASS_IDS[Math.floor(Math.random() * CW.CLASS_IDS.length)], r, 72);
    if (s === 'weapon') { const pool = CW.WEAPONS[(p.loadout.hero && p.loadout.hero.classId) || 'brute'][r]; return CW.Art.icon(pool[Math.floor(Math.random() * pool.length)].kind, r, 72); }
    const g = CW.GEAR[r]; return CW.Art.icon(g[Math.floor(Math.random() * g.length)].kind, r, 72);
  };

  LobbyUI.renderTop = function () {

  LobbyUI.renderPot = function () {

  LobbyUI.renderActionBar = function () {

  // ------------------------------------------------------------ crowd canvas
  LobbyUI.drawCrowd = function (dt) {

    const t = performance.now() / 1000;
    const W = 540, H = 204;
    ctx.setTransform(2, 0, 0, 2, 0, 0);
    ctx.clearRect(0, 0, W, H);

    ctx.beginPath(); ctx.moveTo(214, 122); ctx.lineTo(214, 60); ctx.quadraticCurveTo(270, 6, 326, 60); ctx.lineTo(326, 122); ctx.closePath();
    ctx.fillStyle = chaos ? '#3a0010' : '#14061f'; ctx.fill();

    ctx.restore();
    ctx.lineWidth = 10; ctx.strokeStyle = '#140b17'; ctx.beginPath(); ctx.moveTo(214, 124); ctx.lineTo(214, 60); ctx.quadraticCurveTo(270, 6, 326, 60); ctx.lineTo(326, 124); ctx.stroke();
    ctx.lineWidth = 6; ctx.strokeStyle = '#5b4a63'; ctx.stroke();
    for (let i = 0; i < 7; i++) { const a = Math.PI + (i / 6) * Math.PI; const r = 62; ctx.fillStyle = '#6d5a76'; ctx.strokeStyle = '#140b17'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.rect(270 + Math.cos(a) * r * 0.95 - 7, 70 + Math.sin(a) * r * 0.88 - 5, 14, 10); ctx.fill(); ctx.stroke(); }
    // skull keystone
    ctx.fillStyle = '#efe6cf'; ctx.beginPath(); ctx.ellipse(270, 18, 9, 8, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.fillStyle = chaos ? '#ff2f2f' : '#140b17'; ctx.beginPath(); ctx.arc(266, 18, 2.4, 0, 7); ctx.arc(274, 18, 2.4, 0, 7); ctx.fill();
    // torches
    for (const tx of [40, 500]) {
      ctx.fillStyle = '#3a2d42'; ctx.strokeStyle = '#140b17'; ctx.lineWidth = 3; ctx.beginPath(); ctx.rect(tx - 4, 52, 8, 30); ctx.fill(); ctx.stroke();
      const fl = Math.sin(t * 17 + tx) * 2;
      const tg = ctx.createRadialGradient(tx, 44, 2, tx, 44, 60); tg.addColorStop(0, chaos ? 'rgba(255,60,60,0.55)' : 'rgba(255,150,50,0.5)'); tg.addColorStop(1, 'rgba(255,120,40,0)');
      ctx.fillStyle = tg; ctx.fillRect(tx - 60, -16, 120, 120);
      ctx.beginPath(); ctx.moveTo(tx - 8, 52); ctx.quadraticCurveTo(tx - 10 + fl, 34, tx + fl, 26); ctx.quadraticCurveTo(tx + 10, 38, tx + 8, 52); ctx.closePath();
      ctx.fillStyle = chaos ? '#ff3b3b' : '#ff9f1a'; ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ffe66d'; ctx.beginPath(); ctx.ellipse(tx + fl * 0.5, 44, 3, 6, 0, 0, 7); ctx.fill();

    ctx.fillStyle = fg; ctx.fillRect(0, 118, W, H - 118);
    ctx.strokeStyle = '#140b17'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(0, 120); ctx.lineTo(W, 120); ctx.stroke();
    ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    for (let x = -200; x < W + 200; x += 54) { ctx.beginPath(); ctx.moveTo(270 + (x - 270) * 0.5, 120); ctx.lineTo(x, H); ctx.stroke(); }
    for (const y of [140, 166, 196]) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

    // actors
    const nowMs = performance.now();
    const list = [];
    for (const p of L.players) {
      const a = this.actors[p.id];
      if (!a.visible) continue;
      a.pause -= dt;
      if (a.pause <= 0) {
        a.tx = Math.max(40, Math.min(500, a.x + (Math.random() - 0.5) * 160));
        a.ty = 140 + Math.random() * 50;
        a.pause = 1.5 + Math.random() * 3.5;
      }
      const dx = a.tx - a.x, dy = a.ty - a.y, d = Math.hypot(dx, dy);
      const speed = a.y < 125 ? 70 : 38;
      a.walking = d > 2;
      if (a.walking) { const st = Math.min(d, speed * dt); a.x += (dx / d) * st; a.y += (dy / d) * st; a.face = dx < 0 ? -1 : 1; }
      if (a.lookAt && nowMs < (a.lookUntil || 0)) { const o = this.actors[a.lookAt]; if (o && o !== a) { a.face = o.x < a.x ? -1 : 1; } }
      if (a.emote && nowMs > a.emoteUntil) a.emote = null;
      list.push({ a, p });
    }
    list.sort((u, v) => u.a.y - v.a.y);
    for (const { a, p } of list) {
      const l = p.loadout;
      const shown = (s) => l[s] && L.isRevealed(p, s);
      const pose = {
        t: t + a.seed, face: a.face, walk: a.walking && !a.emote, emote: a.emote, emoteT: a.emote ? (nowMs - a.emoteStart) / 1700 : 0, seed: a.seed,
        hat: shown('hero') ? CW.CLASSES[l.hero.classId].hat : null, heroRarity: shown('hero') ? l.hero.rarity : null,
        weaponKind: shown('weapon') ? l.weapon.kind : null, weaponRarity: shown('weapon') ? l.weapon.rarity : null,
        gearKind: shown('gear') ? l.gear.kind : null, gearRarity: shown('gear') ? l.gear.rarity : null,
      };
      const sc = a.human ? 0.78 : 0.62;
      const yScale = sc * (0.85 + ((a.y - 120) / 84) * 0.25);
      if (shown('hero') && CW.tierOf(l.hero.rarity) >= 3) { const g = ctx.createRadialGradient(a.x, a.y - 20, 4, a.x, a.y - 20, 50); g.addColorStop(0, 'rgba(255,191,26,0.45)'); g.addColorStop(1, 'rgba(255,191,26,0)'); ctx.fillStyle = g; ctx.fillRect(a.x - 50, a.y - 70, 100, 100); }
      CW.Art.drawOverlord(ctx, a.x, a.y, yScale, p.look, pose);
      if (a.human) {
        ctx.font = '13px "CW Display", Impact'; ctx.textAlign = 'center'; ctx.lineWidth = 4; ctx.strokeStyle = '#140b17';
        const yy = a.y - 96 * yScale - 8 + Math.sin(t * 5) * 2;
        ctx.strokeText('YOU', a.x, yy); ctx.fillStyle = '#c6ff2e'; ctx.fillText('YOU', a.x, yy);
        ctx.beginPath(); ctx.moveTo(a.x - 5, yy + 3); ctx.lineTo(a.x + 5, yy + 3); ctx.lineTo(a.x, yy + 9); ctx.closePath(); ctx.fill(); ctx.lineWidth = 2; ctx.stroke();
      }
    }
    // bubbles
    ctx.font = '13px "CW Bang", Impact, sans-serif';
    ctx.textAlign = 'center';
    for (const { a, p } of list) {
      if (!a.bubble || nowMs > a.bubble.until) continue;
      const text = a.bubble.text;
      const w = Math.min(200, ctx.measureText(text).width + 16);
      const sc = a.human ? 0.78 : 0.62;
      let bx = Math.max(w / 2 + 4, Math.min(W - w / 2 - 4, a.x)), by = Math.max(14, a.y - 92 * sc - 22);
      ctx.fillStyle = '#f1e4c6'; ctx.strokeStyle = '#140b17'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.roundRect(bx - w / 2, by - 12, w, 22, 6); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(a.x - 4, by + 10); ctx.lineTo(a.x, by + 18); ctx.lineTo(a.x + 5, by + 10); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#140b17'; ctx.fillText(text, bx, by + 4, w - 8);
      ctx.font = '9px "CW Bang", Impact'; ctx.fillStyle = '#7a1a8a'; ctx.fillText(p.name, bx, by - 14 > 6 ? by - 14 : by + 22);
      ctx.font = '13px "CW Bang", Impact, sans-serif';
    }
  };

  LobbyUI.unmount = function () { this.clearCallouts(); this.lobby = null; if (this.root) this.root.onclick = null; };

  CW.LobbyUI = LobbyUI;
})(window);

  <script>/* js/battle-ui.js */
/* Battle presentation: canvas arena + HUD. Reads CW.Battle state, drains events. */

    const modChips = mods.tiers.map((m) => `<span>${esc(m.label)}</span>`).join('');
    this.root.innerHTML = `
      <canvas width="1080" height="1920"></canvas>
      <div class="bt-top">
        <div class="bt-wave"><span class="wv">GET READY</span><small>${B.biome.name}</small></div>
        <div class="bt-pot"><div class="mult">RAID POT ${CW.potLabel(mods.pot)}</div><div class="bt-mods">${modChips}</div></div>
      </div>
      <div class="boss-bar"><div class="bn"></div><div class="bb"><i></i></div></div>
      <div class="bt-bottom">
        <div class="bt-you">

          <button class="btn dark auto" data-b="auto">AUTO: OFF</button>
        </div>
        ${h.skills.map((s, i) => `<button class="skill s${i + 1}" data-b="skill" data-i="${i}"><span class="key">${i ? 'E' : 'Q'}</span><img src="${CW.Art.icon(s.def.icon, i ? 'legendary' : 'epic', 72)}"><span class="sn">${s.def.name}</span><div class="cd"></div></button>`).join('')}

  };

  BattleUI.cast = function (i, btn) {

      }
      case 'shake': this.shake = Math.max(this.shake, ev.power); break;
      case 'bossSlam': CW.Sfx.play('slam'); this.parts.push({ kind: 'ring', x: 270, y: 640, r: 20, life: 0.6, max: 0.6, col: '#ff3b3b' }); this.float(270, 520, 'SLAM!', '#ff3b3b', 30); break;
      case 'bossChomp': { const t = B.get(ev.tid); if (t) this.float(t.x, t.y - 100, 'CHOMP!', '#ff3b3b', 24); CW.Sfx.play('slam'); break; }
      case 'enrage': UI.slam(this.root, 'ENRAGED!<small>CHAOS RAID BOSS CALLS FOR BACKUP</small>', 'red', 1800); CW.Sfx.play('chaosRaid'); this.shake = 10; break;
      case 'death': {
        const u = B.get(ev.tid); if (!u) break;
        for (let i = 0; i < 10; i++) this.parts.push({ kind: 'poof', x: u.x + (Math.random() - 0.5) * 30, y: u.y - 20 - Math.random() * 30, vx: (Math.random() - 0.5) * 80, vy: -40 - Math.random() * 60, life: 0.6, max: 0.6, col: u.side === 'enemy' ? '#c9b8d4' : '#ff6b6b' });
        if (u.side === 'party' && !u.summon) { this.float(u.x, u.y - 80, u.isHuman ? 'YOU DIED' : 'DOWN!', '#ff3b3b', u.isHuman ? 24 : 16); CW.Sfx.play('death'); }
        if (ev.boss) { this.shake = 14; UI.flash('rgba(255,255,255,0.6)', this.root); }
        break;
      }
      case 'revive': { const u = B.get(ev.tid); if (u) { this.float(u.x, u.y - 80, ev.by === 'gear' ? 'REVIVED (GEAR)!' : 'REVIVED!', '#ffe14d', 18); this.parts.push({ kind: 'ring', x: u.x, y: u.y - 30, r: 8, life: 0.6, max: 0.6, col: '#ffe14d' }); } break; }
      case 'wave': {
        const wv = $('.wv', this.root);
        wv.textContent = ev.boss ? 'BOSS WAVE' : `WAVE ${ev.wave + 1}/${ev.total}`;
        if (ev.boss) {
          const boss = B.enemies().find((e) => e.boss);
          $('.boss-bar', this.root).classList.add('on');
          $('.boss-bar', this.root).classList.toggle('enraged', !!boss.enraged);
          $('.boss-bar .bn', this.root).textContent = boss.name + (boss.enraged ? ' · ENRAGED' : '');
          UI.slam(this.root, `${esc(boss.name)}<small>${boss.enraged ? 'CHAOS RAID: ENRAGED' : 'BOSS'}</small>`, boss.enraged ? 'red' : 'gold', 1700);
          CW.Sfx.play('chaosRaid');
        } else if (ev.wave > 0) UI.slam(this.root, `WAVE ${ev.wave + 1}`, '', 1100);
        if (B.enemies().some((e) => e.elite)) setTimeout(() => this.float(270, 220, 'ELITE INCOMING', '#ff3b3b', 22), 300);
        break;
      }
      case 'waveClear': this.float(270, 450, 'CLEAR! +30% HP', '#c6ff2e', 24); CW.Sfx.play('rare'); break;
      case 'victory': case 'defeat': this.onEnd(ev.type === 'victory'); break;
    }
  };

  BattleUI.onEnd = function (won) {
    if (this.ended) return;
    this.ended = true;
    CW.Sfx.play(won ? 'victory' : 'defeat');
    const e = UI.el(`<div class="bt-end"><div class="stamp ${won ? 'win' : 'lose'}">${won ? 'VICTORY' : 'WIPED'}</div></div>`);
    this.root.appendChild(e);
    setTimeout(() => this.opts.onEnd && this.opts.onEnd(this.battle.result), CW.App.fast ? 700 : 2300);
  };

  BattleUI.float = function (x, y, text, col, size = 16, bold = false) {
    if (this.floats.length > 60) this.floats.shift();
    this.floats.push({ x, y, text, col, size, life: 1.0, max: 1.0, vy: -50 - Math.random() * 20, bold });
  };
  BattleUI.spark = function (x, y, col, n = 5, kind = 'spark') {
    for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 120; this.parts.push({ kind, x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, life: 0.35 + Math.random() * 0.2, max: 0.5, col }); }
    if (this.parts.length > 260) this.parts.splice(0, this.parts.length - 260);
  };

  // ------------------------------------------------------------ frame
  BattleUI.frame = function (dt) {
    const B = this.battle;
    if (!B) return;
    for (const ev of B.drain()) this.handle(ev);
    this.draw(dt);
    // HUD
    const h = B.human;
    const pct = Math.max(0, h.hp / h.maxHp) * 100;
    $('.bt-you .hp i', this.root).style.width = pct + '%';
    $('.bt-you .hp span', this.root).textContent = h.alive ? `${Math.ceil(h.hp)} / ${h.maxHp}${h.shield > 1 ? ` (+${Math.round(h.shield)})` : ''}` : 'DOWN — CHEER THEM ON';
    h.skills.forEach((s, i) => {
      const b = $(`.skill.s${i + 1}`, this.root);
      const cd = b.querySelector('.cd');
      if (s.cdLeft > 0 || !h.alive) { cd.style.display = 'grid'; cd.style.transform = `scaleY(${h.alive ? s.cdLeft / s.def.cd : 1})`; cd.textContent = h.alive ? Math.ceil(s.cdLeft) : '✖'; b.classList.remove('ready'); }
      else { cd.style.display = 'none'; b.classList.toggle('ready', B.state === 'fight'); }
    });
    const boss = B.enemies(false).find((e) => e.boss);
    if (boss) $('.boss-bar .bb i', this.root).style.width = Math.max(0, boss.hp / boss.maxHp) * 100 + '%';
  };

  BattleUI.draw = function (dt) {
    const B = this.battle, ctx = this.ctx;
    const t = performance.now() / 1000;
    const bio = B.biome;
    ctx.setTransform(2, 0, 0, 2, 0, 0);
    this.shake = Math.max(0, this.shake - dt * 30);
    const sx = (Math.random() - 0.5) * this.shake, sy = (Math.random() - 0.5) * this.shake;
    ctx.translate(sx, sy);
    // backdrop
    const g = ctx.createLinearGradient(0, 0, 0, 960);
    g.addColorStop(0, bio.sky); g.addColorStop(0.42, CW.Art.shade(bio.sky, 0.08)); g.addColorStop(0.43, bio.floor); g.addColorStop(1, CW.Art.shade(bio.floor, -0.4));
    ctx.fillStyle = g; ctx.fillRect(-20, -20, 580, 1000);
    // wall bricks
    ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 2;
    for (let y = 100; y < 410; y += 34) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(540, y); ctx.stroke(); for (let x = ((y / 34) % 2) * 45; x < 540; x += 90) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 34); ctx.stroke(); } }
    // glowing runes / arches
    for (const ax of [90, 450]) {
      ctx.fillStyle = '#140b17'; ctx.beginPath(); ctx.moveTo(ax - 50, 410); ctx.lineTo(ax - 50, 220); ctx.quadraticCurveTo(ax, 150, ax + 50, 220); ctx.lineTo(ax + 50, 410); ctx.fill();
      const gg = ctx.createRadialGradient(ax, 300, 5, ax, 300, 80); gg.addColorStop(0, bio.glow + 'aa'); gg.addColorStop(1, bio.glow + '00');
      ctx.fillStyle = gg; ctx.fillRect(ax - 80, 200, 160, 210);
    }
    // torches
    for (const tx of [200, 340]) {
      const fl = Math.sin(t * 15 + tx) * 2;
      const tg = ctx.createRadialGradient(tx, 190, 2, tx, 190, 70); tg.addColorStop(0, 'rgba(255,160,60,0.45)'); tg.addColorStop(1, 'rgba(255,160,60,0)');
      ctx.fillStyle = tg; ctx.fillRect(tx - 70, 120, 140, 140);
      ctx.fillStyle = '#ff9f1a'; ctx.strokeStyle = '#140b17'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(tx - 7, 200); ctx.quadraticCurveTo(tx - 9 + fl, 182, tx + fl, 174); ctx.quadraticCurveTo(tx + 9, 186, tx + 7, 200); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#3a2d42'; ctx.fillRect(tx - 4, 200, 8, 24); ctx.strokeRect(tx - 4, 200, 8, 24);
    }
    // floor lines
    ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 2;
    for (let x = -400; x < 940; x += 70) { ctx.beginPath(); ctx.moveTo(270 + (x - 270) * 0.4, 412); ctx.lineTo(x, 960); ctx.stroke(); }
    for (const y of [460, 530, 620, 730, 860]) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(540, y); ctx.stroke(); }
    ctx.strokeStyle = '#140b17'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(0, 412); ctx.lineTo(540, 412); ctx.stroke();
    if (B.mods.bossEnraged) { ctx.fillStyle = `rgba(255,30,60,${0.08 + Math.sin(t * 3) * 0.05})`; ctx.fillRect(0, 0, 540, 960); }

    // units sorted by y
    const units = B.units.filter((u) => u.alive || u.side === 'party').slice().sort((a, b) => a.y - b.y);
    for (const u of units) {
      if (u.side === 'enemy') {
        u._now = B.time;
        CW.Art.drawEnemy(ctx, u, t);
        this.bar(u.x, u.y - 66 * u.size - 18, u.boss ? 0 : 54, u.hp / u.maxHp, '#ff4d4d');
        for (const d of u.dots) { ctx.fillStyle = CW.WEAPON_FX[d.type] ? CW.WEAPON_FX[d.type].color : '#fff'; ctx.globalAlpha = 0.6; ctx.beginPath(); ctx.arc(u.x + (Math.random() - 0.5) * 30, u.y - 20 - Math.random() * 40, 3, 0, 7); ctx.fill(); ctx.globalAlpha = 1; }
      } else if (u.summon) {
        if (u.alive) { CW.Art.drawSkeleton(ctx, u, t); this.bar(u.x, u.y - 40, 30, u.hp / u.maxHp, '#1abc9c'); }
      } else {
        if (u.isHuman) { ctx.strokeStyle = '#c6ff2e'; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(u.x, u.y, 30, 9, 0, 0, Math.PI * 2); ctx.stroke(); }
        if (u.alive && CW.tierOf(u.heroRarity) >= 3) { const gg = ctx.createRadialGradient(u.x, u.y - 30, 4, u.x, u.y - 30, 50); gg.addColorStop(0, 'rgba(255,191,26,0.4)'); gg.addColorStop(1, 'rgba(255,191,26,0)'); ctx.fillStyle = gg; ctx.fillRect(u.x - 50, u.y - 80, 100, 100); }
        const lunge = u.anim.lunge > 0 ? u.anim.lunge : 0;
        const tgt = u.lungeTo && lunge ? B.get(u.lungeTo) : null;
        const ox = tgt ? (tgt.x - u.x) * lunge * 0.5 : 0, oy = tgt ? (tgt.y - u.y) * lunge * 0.5 : 0;
        CW.Art.drawOverlord(ctx, u.x + ox, u.y + oy, u.isHuman ? 0.72 : 0.62, u.look, {
          t: t + u.hx, face: 1, hat: CW.CLASSES[u.classId].hat, heroRarity: u.heroRarity, weaponKind: u.weaponKind, weaponRarity: u.weaponRarity,
          gearKind: u.gearKind, gearRarity: u.gearRarity, dead: !u.alive, emote: !u.alive ? null : u.anim.cast > 0 ? 'cast' : u.hp / u.maxHp < 0.25 ? 'panic' : null, emoteT: 0.5,
        });
        if (u.alive && u.anim.hit > 0) { ctx.fillStyle = 'rgba(255,60,60,0.35)'; ctx.beginPath(); ctx.ellipse(u.x, u.y - 40, 26, 40, 0, 0, 7); ctx.fill(); }
        if (u.shield > 1 && u.alive) { ctx.strokeStyle = 'rgba(127,219,255,0.8)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(u.x, u.y - 36, 32, 44, 0, 0, 7); ctx.stroke(); }
        if (u.tauntUntil > B.time && u.alive) { ctx.fillStyle = '#ff3b3b'; ctx.font = '14px "CW Display"'; ctx.textAlign = 'center'; ctx.fillText('!', u.x + 24, u.y - 70); }
        if (u.alive) this.bar(u.x, u.y + 8, 48, u.hp / u.maxHp, u.isHuman ? '#c6ff2e' : '#4ddf6a');
        ctx.font = '11px "CW Bang", Impact'; ctx.textAlign = 'center'; ctx.lineWidth = 3; ctx.strokeStyle = '#140b17';
        const nm = u.isHuman ? 'YOU' : u.name.slice(0, 11);
        ctx.strokeText(nm, u.x, u.y + 26); ctx.fillStyle = u.isHuman ? '#c6ff2e' : '#e6d6ef'; ctx.fillText(nm, u.x, u.y + 26);
      }
    }
    // projectiles
    for (const p of B.projectiles) {
      ctx.save(); ctx.translate(p.x, p.y);
      if (p.kind === 'arrow') {
        const tt = B.get(p.to); const ang = tt ? Math.atan2(tt.y - 30 - p.y, tt.x - p.x) : -Math.PI / 2;
        ctx.rotate(ang); ctx.strokeStyle = '#140b17'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(10, 0); ctx.stroke();
        ctx.strokeStyle = CW.Art.MAT[p.rarity || 'common'].metal; ctx.lineWidth = 2.5; ctx.stroke();
      } else {
        const col = p.kind === 'heal' ? '#7dff7a' : CW.WEAPON_FX[p.kind] ? CW.WEAPON_FX[p.kind].color : CW.RARITY[p.rarity || 'common'].color;
        ctx.fillStyle = col; ctx.strokeStyle = '#140b17'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(0, 0, p.kind === 'heal' ? 5 : 7, 0, 7); ctx.fill(); ctx.stroke();
        ctx.globalAlpha = 0.4; ctx.beginPath(); ctx.arc(0, 0, 13, 0, 7); ctx.fill();
      }
      ctx.restore();
    }
    // particles
    for (const p of this.parts) {
      p.life -= dt;
      const k = Math.max(0, p.life / p.max);
      if (p.vx !== undefined) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 200 * dt; }
      ctx.globalAlpha = k;
      if (p.kind === 'ring') { p.r += dt * 300; ctx.strokeStyle = p.col; ctx.lineWidth = 6 * k + 1; ctx.beginPath(); ctx.ellipse(p.x, p.y, p.r, p.r * 0.45, 0, 0, 7); ctx.stroke(); }
      else if (p.kind === 'bolt') { ctx.strokeStyle = p.col; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(p.x, p.y); const mx = (p.x + p.x2) / 2 + (Math.random() - 0.5) * 30, my = (p.y + p.y2) / 2 + (Math.random() - 0.5) * 30; ctx.lineTo(mx, my); ctx.lineTo(p.x2, p.y2); ctx.stroke(); }
      else if (p.kind === 'echo') { ctx.fillStyle = p.col; ctx.strokeStyle = '#140b17'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(p.x, p.y - (1 - k) * 20, 14 * (1.4 - k), 0, 7); ctx.fill(); ctx.stroke(); }
      else if (p.kind === 'plus') { ctx.fillStyle = p.col; ctx.font = '14px "CW Display"'; ctx.fillText('+', p.x, p.y); }
      else { ctx.fillStyle = p.col; ctx.fillRect(p.x - 2.5, p.y - 2.5, 5, 5); }
    }
    ctx.globalAlpha = 1;
    this.parts = this.parts.filter((p) => p.life > 0);
    // floats
    ctx.textAlign = 'center';
    for (const f of this.floats) {
      f.life -= dt; f.y += f.vy * dt; f.vy *= 0.94;
      const k = Math.max(0, f.life / f.max);
      const pop = f.life > 0.85 ? 1 + (f.life - 0.85) * 3 : 1;
      ctx.globalAlpha = Math.min(1, k * 2);
      ctx.font = `${Math.round(f.size * pop)}px "CW Display", Impact`;
      ctx.lineWidth = f.size > 18 ? 5 : 4; ctx.strokeStyle = '#140b17';
      ctx.strokeText(f.text, f.x, f.y); ctx.fillStyle = f.col; ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
    this.floats = this.floats.filter((f) => f.life > 0);
  };

  BattleUI.bar = function (x, y, w, pct, col) {
    if (!w) return;
    const ctx = this.ctx;
    ctx.fillStyle = '#140b17'; ctx.fillRect(x - w / 2 - 2, y - 2, w + 4, 9);
    ctx.fillStyle = '#3a0a12'; ctx.fillRect(x - w / 2, y, w, 5);
    ctx.fillStyle = col; ctx.fillRect(x - w / 2, y, w * Math.max(0, Math.min(1, pct)), 5);
  };

  BattleUI.unmount = function () { this.battle = null; if (this.root) this.root.onclick = null; };
  CW.BattleUI = BattleUI;
})(window);

</script>
  <script>/* js/screens.js */
/* Front menu + results screen + stats/settings modals. */
(function (root) {
  'use strict';
  const CW = root.CW;
  const UI = CW.UI;
  const { $, esc } = UI;
  const Screens = {};
  const fmtK = (v) => (v >= 1000 ? (v / 1000).toFixed(1) + 'k' : String(Math.round(v)));

  // ------------------------------------------------------------ MENU
  Screens.menu = function (app) {
    const s = app.save.data;
    const el = $('#scr-menu');
    const rec = (id) => { const m = s.stats.byMode[id]; return m.played ? `${m.wins}W / ${m.played} RAIDS` : 'NOT PLAYED'; };
    el.innerHTML = `
      <div class="menu-wallet">${UI.wallet(s.wallet)}</div>
      <div class="menu-logo"><div class="cw">CHAOS WORLD</div><div class="big">RNG<span>RAID</span></div><div class="tag">Gamble your loadout. Rob your friends. Juice the dungeon.</div></div>
      <canvas class="menu-crowd" width="1080" height="300"></canvas>
      <div class="mode-cards">
        ${['rng', 'grief'].map((id) => { const m = CW.MODES[id]; return `
        <button class="mode-card ${id}" data-mode="${id}">
          <span class="rec">${rec(id)}</span>
          <h3>${m.name}</h3><div class="tl">${esc(m.tagline)}</div>
          <ul>${m.features.map((f) => `<li>${esc(f)}</li>`).join('')}</ul>
          <span class="go">PLAY ▶</span>
        </button>`; }).join('')}
      </div>
      <div class="menu-foot">
        <button class="btn dark" data-m="stats">STATS</button>
        <button class="btn dark" data-m="settings">SETTINGS</button>
        <button class="btn dark" data-m="help">HOW IT WORKS</button>
      </div>`;
    el.onclick = (e) => {
      CW.Sfx.unlock();
      const mode = e.target.closest('[data-mode]');
      if (mode) { CW.Sfx.play('click'); return app.startLobby(mode.dataset.mode); }
      const m = e.target.closest('[data-m]');
      if (!m) return;
      CW.Sfx.play('click');
      if (m.dataset.m === 'stats') Screens.stats(app);
      if (m.dataset.m === 'settings') Screens.settings(app);
      if (m.dataset.m === 'help') Screens.help();
    };
    // little crowd of overlords on the menu
    const c = el.querySelector('.menu-crowd');
    const ctx = c.getContext('2d');
    const looks = [CW.HUMAN_PROFILE.look, ...CW.BOT_ROSTER.map((b) => b.look)];
    const hats = Object.values(CW.CLASSES).map((k) => k.hat);
    const ems = ['cheer', null, 'laugh', null, 'taunt', null, 'panic', null];
    const draw = () => {
      if (app.screen !== 'menu') return;
      const t = performance.now() / 1000;
      ctx.setTransform(2, 0, 0, 2, 0, 0); ctx.clearRect(0, 0, 540, 150);
      looks.forEach((lk, i) => {
        const x = 40 + i * 66, y = 136 - (i % 2) * 10;
        const em = ems[(i + Math.floor(t / 2.5)) % ems.length];
        CW.Art.drawOverlord(ctx, x, y, 0.72, lk, { t: t + i, face: i < 4 ? 1 : -1, emote: em, emoteT: (t % 2.5) / 2.5, hat: hats[i], heroRarity: CW.RARITY_ORDER[i % 5], weaponKind: Object.values(CW.WEAPONS)[i].epic[0].kind, weaponRarity: CW.RARITY_ORDER[(i + 2) % 5] });
      });
      requestAnimationFrame(draw);
    };
    requestAnimationFrame(draw);
  };

  Screens.stats = function (app) {
    const s = app.save.data.stats;
    const row = (k, v) => `<div><span>${k}</span><b>${v}</b></div>`;
    UI.openModal(`<h2>YOUR RECORD</h2>
      <div class="stats-grid">
        ${row('RAIDS', s.raidsPlayed)}${row('WINS', s.wins)}
        ${row('LEGENDARY+ PULLS', s.legendaryPulls)}${row('BEST POT CLEARED', s.highestPotCleared ? CW.potLabel(s.highestPotCleared) : '—')}
        ${row('STEALS', s.steals)}${row('BUSTED', s.stealFails)}
        ${row('PLAYERS GRIEFED', s.playersGriefed)}${row('TIMES GRIEFED', s.timesGriefed)}
        ${row('BOOSTS', s.boosts)}${row('REROLLS', s.rerolls)}
        ${row('RNG RAID', `${s.byMode.rng.wins}/${s.byMode.rng.played}`)}${row('GRIEF RAID', `${s.byMode.grief.wins}/${s.byMode.grief.played}`)}
      </div>
      <div class="row"><button class="btn" data-m="no">OK</button></div>`);
    $('#overlay .modal').onclick = (e) => { if (e.target.closest('[data-m]')) UI.closeModal(); };
  };

  Screens.settings = function (app) {
    const st = app.save.data.settings;
    UI.openModal(`<h2>SETTINGS</h2>
      <div class="toggle-row"><span>SOUND</span><button class="btn ${st.sound ? '' : 'dark'}" data-t="sound">${st.sound ? 'ON' : 'OFF'}</button></div>
      <div class="toggle-row"><span>FAST MODE (QA)</span><button class="btn ${app.fast ? '' : 'dark'}" data-t="fast">${app.fast ? 'ON' : 'OFF'}</button></div>
      <div class="toggle-row"><span>SAVE DATA</span><button class="btn red" data-t="reset">RESET SAVE</button></div>
      <div class="note">DEBUG PANEL: PRESS \` OR TAP "DBG" (BOTTOM LEFT)</div>
      <div class="row"><button class="btn" data-m="no">DONE</button></div>`);
    $('#overlay .modal').onclick = (e) => {
      const t = e.target.closest('[data-t]');
      if (e.target.closest('[data-m]')) return UI.closeModal();
      if (!t) return;
      if (t.dataset.t === 'sound') { st.sound = !st.sound; CW.Sfx.setEnabled(st.sound); app.save.save(); }
      if (t.dataset.t === 'fast') app.setFast(!app.fast);
      if (t.dataset.t === 'reset') { if (t.dataset.armed) { app.resetSave(); UI.toast('SAVE RESET', true); } else { t.dataset.armed = 1; t.textContent = 'TAP AGAIN'; return; } }
      Screens.settings(app);
    };
  };

  Screens.help = function () {
    UI.openModal(`<h2>HOW IT WORKS</h2>
      <div class="sub" style="text-align:left;line-height:1.3">
      1. Everyone pulls a <b>HERO</b>, then a <b>WEAPON</b> for that hero, then <b>GEAR</b>.<br>
      2. <b>CHAOS PHASE</b> (~18s): reroll a slot, shuffle everything, steal from others, or (Grief Raid) curse their stuff down a tier.<br>
      3. Anyone can <b>BOOST</b> the raid pot: more coins for everyone, nastier dungeon.<br>
      4. The timer hits zero and you all walk into the dungeon with whatever you ended up holding.</div>
      <div class="row"><button class="btn" data-m="no">GOT IT</button></div>`);
    $('#overlay .modal').onclick = (e) => { if (e.target.closest('[data-m]')) UI.closeModal(); };
  };

  // ------------------------------------------------------------ RESULTS
  Screens.results = function (app, r) {
    const el = $('#scr-results');
    el.className = 'screen' + (r.won ? '' : ' lost');
    const total = r.rewards.coins;
    const tokens = Object.entries(r.rewards.tokens).filter(([, v]) => v > 0);
    const rows = r.board.slice().sort((a, b) => b.dmg + b.heal - (a.dmg + a.heal));
    const max = Math.max(1, ...rows.map((x) => x.dmg + x.heal));
    el.innerHTML = `<div class="res-wrap">
      <div class="res-head">
        <div class="big">${r.won ? 'RAID CLEARED' : 'WIPED'}</div>
        <div class="sub">${r.biome} · RAID POT ${CW.potLabel(r.potX100)} · ${r.modeName}</div>
        ${r.rewards.greedy ? `<div class="greedy">YOU LOST THE JUICED RAID. WE GOT GREEDY.</div>` : ''}
        ${r.won && r.potX100 >= 200 ? `<div class="greedy">CHAOS RAID SURVIVED. LEGENDS.</div>` : ''}
      </div>
      <div class="res-pay">
        ${r.rewards.lines.map((l, i) => `<div class="line ${l.pot ? 'potline' : ''}" style="animation-delay:${0.2 + i * 0.25}s"><span>${l.label}${l.pot ? ' <small>(lobby boosts)</small>' : ''}</span><b>+${l.value}</b></div>`).join('')}
        <div class="total"><span>TOTAL</span><b class="tot">0</b></div>
        <div class="tokens">${tokens.length ? tokens.map(([k, v]) => `<span class="chip cur-${k}"><i></i>+${v} ${k.toUpperCase()} TOKEN</span>`).join('') : '<span style="color:#7d6b88">NO TOKEN DROPS THIS TIME</span>'}</div>
      </div>
      <div class="res-board"><h4>WHO CARRIED</h4>
        ${rows.map((x) => `<div class="res-row ${x.isHuman ? 'me' : ''}">
            <div class="ava"><img src="${CW.Art.heroIcon(x.classId, x.heroRarity, 40)}"></div>
            <div>${esc(x.name)} ${x.mvp ? '<span class="mvp">MVP</span>' : ''}<div class="pips">${CW.SLOTS.map((s) => `<span class="r-${x.rar[s]} pips"><b></b></span>`).join('')}</div></div>
            <div class="bar"><i style="width:${(x.dmg / max) * 100}%"></i><i class="h" style="width:${(x.heal / max) * 100}%"></i></div>
            <div class="num">${fmtK(x.dmg + x.heal)}</div></div>`).join('')}
      </div></div>
      <div class="res-btns"><button class="btn" data-r="again">PLAY AGAIN</button><button class="btn dark" data-r="menu">MENU</button></div>`;
    // count-up
    const tot = el.querySelector('.tot');
    const t0 = performance.now(), dur = app.fast ? 200 : 1200;
    const tick = () => { const k = Math.min(1, (performance.now() - t0) / dur); tot.textContent = Math.round(total * k); if (k < 1) requestAnimationFrame(tick); else CW.Sfx.play('coin'); };
    setTimeout(tick, app.fast ? 50 : 600);
    el.onclick = (e) => {
      const b = e.target.closest('[data-r]'); if (!b) return;
      CW.Sfx.play('click');
      if (b.dataset.r === 'again') app.startLobby(r.modeId);
      else app.showMenu();
    };
  };

  CW.Screens = Screens;
})(window);

</script>
  <script>/* js/debug.js */
/* QA / debug panel. Toggle with ` or the tiny DBG button. Everything is also scriptable via window.CW.App + CW.Debug. */
(function (root) {
  'use strict';
  const CW = root.CW;
  const UI = CW.UI;
  const $ = UI.$;
  const Debug = {};

  Debug.init = function (app) {
    this.app = app;
    this.panel = $('#debug-panel');
    $('#dbg-btn').onclick = () => this.toggle();
    this.render();
  };
  Debug.toggle = function (force) {
    const open = force ?? this.panel.hidden;
    this.panel.hidden = !open;
    if (open) this.render();
  };

  Debug.render = function () {
    const app = this.app, ds = app.debugState;
    const on = (c) => (c ? 'on' : '');
    const rs = ['auto', ...CW.RARITY_ORDER];
    this.panel.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center"><b style="font-family:var(--font-d);font-size:18px;color:var(--lime)">QA / DEBUG</b><button data-d="close">✕</button></div>
      <h4>FORCE RARITY (YOUR ROLLS)</h4>
      <div class="r">${rs.map((r) => `<button data-d="rar" data-v="${r}" class="${on((ds.forceRarity || 'auto') === r)}">${r === 'mythic' ? 'MYTHIC' : r.toUpperCase()}</button>`).join('')}</div>
      <div class="r" style="margin-top:4px"><button data-d="rarbots" class="${on(ds.forceRarityBots)}">ALSO FORCE BOTS</button></div>
      <h4>FORCE STEAL</h4>
      <div class="r">${['auto', 'success', 'fail'].map((v) => `<button data-d="steal" data-v="${v}" class="${on((ds.forceSteal || 'auto') === v)}">${v.toUpperCase()}</button>`).join('')}</div>
      <h4>WALLET</h4>
      <div class="r"><input id="dbg-coins" type="number" value="${app.save.data.wallet.coins}"><button data-d="coins">SET COINS</button></div>
      <div class="r" style="margin-top:4px"><button data-d="give" data-v="chaos">+1 CHAOS</button><button data-d="give" data-v="jack">+1 JACK</button><button data-d="give" data-v="grief">+1 GRIEF</button></div>
      <h4>RAID POT</h4>
      <div class="r">${[100, 125, 150, 175, 200].map((v) => `<button data-d="pot" data-v="${v}">${CW.potLabel(v)}</button>`).join('')}</div>
      <h4>FLOW</h4>
      <div class="r"><button data-d="skipphase">SKIP PHASE</button><button data-d="skiplobby">SKIP LOBBY</button></div>
      <div class="r" style="margin-top:4px"><button data-d="win">WIN BATTLE</button><button data-d="lose">LOSE BATTLE</button></div>
      <div class="r" style="margin-top:4px"><button data-d="fast" class="${on(app.fast)}">FAST MODE</button><button data-d="menu">MENU</button></div>
      <h4>SAVE</h4>
      <div class="r"><button data-d="reset">RESET SAVE</button></div>
      <h4>STATE</h4>
      <div class="info" id="dbg-info"></div>`;
    this.panel.onclick = (e) => {
      const b = e.target.closest('[data-d]');
      if (!b) return;
      const v = b.dataset.v;
      switch (b.dataset.d) {
        case 'close': return this.toggle(false);
        case 'rar': ds.forceRarity = v === 'auto' ? null : v; break;
        case 'rarbots': ds.forceRarityBots = !ds.forceRarityBots; break;
        case 'steal': ds.forceSteal = v === 'auto' ? null : v; break;
        case 'coins': this.setCoins(+$('#dbg-coins').value || 0); break;
        case 'give': this.give(v, 1); break;
        case 'pot': if (app.lobby) app.lobby.setPot(+v); else UI.toast('ONLY IN LOBBY'); break;
        case 'skipphase': if (app.lobby && app.screen === 'lobby') app.lobby.skipPhase(); break;
        case 'skiplobby': this.skipLobby(); break;
        case 'win': if (app.battle) app.battle.forceWin(); else UI.toast('ONLY IN BATTLE'); break;
        case 'lose': if (app.battle) app.battle.forceLose(); else UI.toast('ONLY IN BATTLE'); break;
        case 'fast': app.setFast(!app.fast); break;
        case 'menu': app.showMenu(); break;
        case 'reset': app.resetSave(); UI.toast('SAVE RESET', true); break;
      }
      this.render();
    };
  };

  Debug.setCoins = function (n) { this.app.save.data.wallet.coins = n; this.app.save.save(); };
  Debug.give = function (k, n) { this.app.save.data.wallet[k] += n; this.app.save.save(); };
  Debug.skipLobby = function () {
    const app = this.app;
    if (app.screen !== 'lobby' || !app.lobby) return UI.toast('ONLY IN LOBBY');
    app.lobby.skipToBattle();
  };

  Debug.frame = function () {
    if (this.panel.hidden) return;
    const info = $('#dbg-info');
    if (!info) return;
    const a = this.app, L = a.lobby, B = a.battle;
    const lines = [`screen: ${a.screen}  fast: ${a.fast}`, `seed: ${L ? L.seed : '-'}`];
    if (L) {
      lines.push(`phase: ${L.phase} t=${L.time.toFixed(1)} left=${L.phaseRemaining().toFixed(1)}`);
      lines.push(`pot: ${CW.potLabel(L.potX100)}  bot actions: ${L.stats.botActions}`);
      lines.push(`steals ${L.stats.steals}/${L.stats.stealFails} griefs ${L.stats.griefs} boosts ${L.stats.boosts}`);
    }
    if (B) lines.push(`battle: ${B.state} wave ${B.wave + 1} t=${B.time.toFixed(1)}`, `party alive: ${B.heroes().length}  enemies: ${B.enemies().length}`);
    const s = lines.join('\n');
    if (info.textContent !== s) info.textContent = s;
  };

  CW.Debug = Debug;
})(window);

</script>
  <script>/* js/main.js */
/* App flow: menu → lobby → battle → results → again. Owns the RAF loop + save. */
(function (root) {
  'use strict';
  const CW = root.CW;
  const UI = CW.UI;
  const $ = UI.$;

  const params = new URLSearchParams(location.search);
  const App = {
    screen: 'menu', fast: false, lobby: null, battle: null, modeId: 'rng', raidIndex: 0, lastResult: null,
    debugState: { forceRarity: null, forceRarityBots: false, forceSteal: null },
    params,
  };
  CW.App = App;

  App.init = function () {
    this.save = CW.Save;
    this.save.load();
    this.fast = params.get('fast') === '1' || !!this.save.data.settings.fast;
    CW.Sfx.setEnabled(this.save.data.settings.sound && params.get('sound') !== '0');
    document.documentElement.style.setProperty('--grain', `url(${CW.Art.grain()})`);
    UI.fit();
    window.addEventListener('resize', () => UI.fit());
    window.addEventListener('keydown', (e) => this.onKey(e));
    window.addEventListener('pointerdown', () => CW.Sfx.unlock(), { once: false, passive: true });
    CW.Debug.init(this);
    this.showMenu();
    if (params.get('debug') === '1') CW.Debug.toggle(true);
    const m = params.get('mode');
    if (m && CW.MODES[m]) this.startLobby(m);
    this._last = performance.now();
    requestAnimationFrame((t) => this.loop(t));
  };

  App.setScreen = function (s) {
    this.screen = s;
    $('#stage').dataset.screen = s;
    if (UI.modalOpen) UI.closeModal();
  };

  App.showMenu = function () {
    this.lobby = null; this.battle = null;
    CW.LobbyUI.unmount(); CW.BattleUI.unmount();
    this.setScreen('menu');
    CW.Screens.menu(this);
  };

  App.startLobby = function (modeId) {
    this.modeId = modeId;
    CW.BattleUI.unmount();
    const seedParam = params.get('seed');
    const seed = seedParam ? (+seedParam + this.raidIndex * 7919) >>> 0 : CW.randomSeed();
    this.raidIndex++;
    this.lobby = new CW.Lobby({ mode: modeId, seed, fast: this.fast, wallet: this.save.data.wallet, debug: this.debugState, biome: params.get('biome') || null });
    this.battle = null;
    this.setScreen('lobby');
    CW.LobbyUI.mount(this.lobby, { tutorial: !this.save.data.tutorial[modeId], onLaunch: () => this.startBattle() });
    CW.Sfx.play('pop');
  };

  App.startBattle = function () {
    const L = this.lobby;
    if (!L || this.screen !== 'lobby') return;
    this.save.data.tutorial[this.modeId] = true;
    this.save.save(); // coins spent in the lobby are committed
    const mods = CW.raidMods(L.potX100);
    this.battle = new CW.Battle({ party: L.partySpec(), seed: (L.seed + 99) >>> 0, mods, biome: L.biome, autoHuman: params.get('auto') === '1' });
    CW.Sfx.play('transition');
    UI.flash('#000');
    CW.LobbyUI.unmount();
    this.setScreen('battle');
    CW.BattleUI.mount(this.battle, { humanLoadout: L.human.loadout, auto: params.get('auto') === '1', onEnd: (r) => this.finishBattle(r) });
  };

  App.finishBattle = function (result) {
    const B = this.battle, L = this.lobby;
    if (!B || this.screen !== 'battle') return;
    const board = [];
    for (const u of B.units) {
      const st = B.stats[u.id];
      if (!st || u.summon) continue;
      const p = L.get(st.pid);
      board.push({ name: st.name, isHuman: st.isHuman, classId: st.classId, dmg: st.dmg, heal: st.heal, heroRarity: p.loadout.hero.rarity, rar: { hero: p.loadout.hero.rarity, weapon: p.loadout.weapon.rarity, gear: p.loadout.gear.rarity } });
    }
    const best = board.slice().sort((a, b) => b.dmg + b.heal - (a.dmg + a.heal))[0];
    if (best) best.mvp = true;
    const rewards = CW.computeRewards({ won: result.won, potX100: L.potX100, modeId: this.modeId, rng: new CW.RNG(L.seed + 7), mvp: result.won && best && best.isHuman });
    this.save.recordRaid({ modeId: this.modeId, won: result.won, potX100: L.potX100, rewards, lobbyHuman: L.human });
    this.lastResult = { won: result.won, potX100: L.potX100, rewards, board, modeId: this.modeId, modeName: L.mode.name, biome: L.biome.name, why: result.why };
    CW.BattleUI.unmount();
    this.setScreen('results');
    CW.Screens.results(this, this.lastResult);
  };

  App.setFast = function (on) {
    this.fast = on;
    this.save.data.settings.fast = on; this.save.save();
    if (this.lobby) this.lobby.setFast(on);
    UI.toast('FAST MODE ' + (on ? 'ON' : 'OFF'), true);
  };
  App.resetSave = function () {
    this.save.reset();
    if (this.lobby) this.lobby.human.wallet = this.save.data.wallet;
    if (this.screen === 'menu') CW.Screens.menu(this);
  };

  App.onKey = function (e) {
    if (e.key === '`' || e.key === '~') { CW.Debug.toggle(); return; }
    if (e.target && e.target.tagName === 'INPUT') return;
    if (this.screen === 'lobby') CW.LobbyUI.key(e);
    else if (this.screen === 'battle') { if (e.key === 'Escape') return; CW.BattleUI.key(e); }
    else if (this.screen === 'results' && (e.key === 'Enter' || e.key === ' ')) this.startLobby(this.modeId);
    else if (UI.modalOpen && e.key === 'Escape') UI.closeModal();
  };

  App.loop = function (t) {
    const dt = Math.min(0.05, Math.max(0, (t - this._last) / 1000));
    this._last = t;
    try {
      if (this.screen === 'lobby' && this.lobby) { this.lobby.update(dt); CW.LobbyUI.frame(dt); }
      else if (this.screen === 'battle' && this.battle) {
        const speed = this.fast ? CW.TIMINGS.battleFastSpeed : 1;
        let left = dt * speed;
        while (left > 0) { const s = Math.min(left, 1 / 30); this.battle.update(s); left -= s; }
        CW.BattleUI.frame(dt);
      }
      CW.Debug.frame();
    } catch (err) {
      console.error(err);
      this.lastError = String(err && err.stack || err);
    }
    requestAnimationFrame((tt) => this.loop(tt));
  };

  window.addEventListener('DOMContentLoaded', () => App.init());
})(window);

</script>
