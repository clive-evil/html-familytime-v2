  <style>/* css/style.css */
/* ChaosWorld RNG Raid — comic dungeon UI.
   Design space: 540 x 960 (1080x1920 @0.5), scaled to fit. Thick ink, hard shadows, no glass. */
:root {
  --ink: #140b17;
  --stone: #241b29;
  --stone2: #33283a;
  --stone3: #46384f;
  --paper: #f1e4c6;
  --purple: #7b2cff;
  --purple2: #a259ff;
  --lime: #c6ff2e;
  --gold: #ffbf1a;
  --red: #ff3b3b;
  --blue: #38a6ff;
  --pink: #ff2fa0;
  --c-common: #b8ae9c;
  --c-rare: #38a6ff;
  --c-epic: #b44dff;
  --c-legendary: #ffbf1a;
  --c-mythic: #ff2fa0;
  --grain: none;
  --sh: 4px 4px 0 var(--ink);
  --font-d: 'CW Display', Impact, 'Arial Black', sans-serif;
  --font-b: 'CW Bang', Impact, 'Arial Narrow', sans-serif;
  --outline: -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink), 2px 2px 0 var(--ink), 0 3px 0 var(--ink);
  --outline-s: -1px -1px 0 var(--ink), 1px -1px 0 var(--ink), -1px 1px 0 var(--ink), 1px 1px 0 var(--ink);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #0c070e; overflow: hidden; touch-action: manipulation; }
body { font-family: var(--font-b); color: var(--paper); user-select: none; -webkit-user-select: none; letter-spacing: 0.4px; }
button { font-family: var(--font-d); cursor: pointer; color: inherit; }
#viewport { position: fixed; inset: 0; overflow: hidden; display: flex; align-items: center; justify-content: center;
  background: radial-gradient(circle at 50% 40%, #241330 0%, #0c070e 70%); }
#stage { position: relative; width: 540px; height: 960px; flex: none; overflow: hidden; overflow: clip; transform-origin: 50% 50%;
  background: var(--stone); box-shadow: 0 0 0 4px var(--ink), 0 0 80px rgba(123, 44, 255, 0.25); }
.screen { position: absolute; inset: 0; display: none; }
#stage[data-screen='menu'] #scr-menu, #stage[data-screen='lobby'] #scr-lobby,
#stage[data-screen='battle'] #scr-battle, #stage[data-screen='results'] #scr-results { display: block; }
.hidden { display: none !important; }

/* ---------------------------------------------------------- shared bits */
.ol { text-shadow: var(--outline); }
.ol-s { text-shadow: var(--outline-s); }
.btn { position: relative; border: 3px solid var(--ink); border-radius: 10px; background: var(--lime); color: var(--ink);
  font-size: 22px; padding: 8px 14px 10px; box-shadow: inset 0 -6px 0 rgba(0, 0, 0, 0.25), var(--sh); min-height: 52px;
  transition: transform 0.06s; text-transform: uppercase; line-height: 1; }
.btn:active, .btn.pressed { transform: translate(3px, 3px); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.25), 1px 1px 0 var(--ink); }
.btn small { display: block; font-family: var(--font-b); font-size: 13px; letter-spacing: 0.5px; margin-top: 3px; opacity: 0.85; }
.btn.purple { background: var(--purple2); color: #fff; text-shadow: var(--outline-s); }
.btn.red { background: var(--red); color: #fff; text-shadow: var(--outline-s); }
.btn.gold { background: var(--gold); }
.btn.dark { background: var(--stone3); color: var(--paper); text-shadow: var(--outline-s); }
.btn.blue { background: var(--blue); color: #fff; text-shadow: var(--outline-s); }
.btn[disabled], .btn.off { filter: grayscale(0.85) brightness(0.7); }
.btn.active { outline: 4px solid #fff; outline-offset: -8px; animation: pulseBtn 0.8s infinite alternate; }
@keyframes pulseBtn { to { filter: brightness(1.2); } }
.btn.shake, .shake { animation: shakeX 0.35s; }
@keyframes shakeX { 0%,100% { translate: 0; } 20% { translate: -6px; } 40% { translate: 6px; } 60% { translate: -4px; } 80% { translate: 3px; } }

.chip { display: inline-flex; align-items: center; gap: 4px; background: var(--ink); border-radius: 999px; padding: 2px 8px 2px 3px;
  font-family: var(--font-d); font-size: 14px; line-height: 1; height: 24px; border: 2px solid #000; }
.chip i { display: inline-block; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--ink); flex: none; font-style: normal; }
.cur-coin i { background: radial-gradient(circle at 35% 35%, #fff3a3, #ffbf1a 55%, #a86d00); }
.cur-chaos i { background: radial-gradient(circle at 35% 35%, #e3c2ff, #8a2be2 60%, #3b0a6b); border-radius: 4px; transform: rotate(45deg) scale(0.85); }
.cur-jack i { background: radial-gradient(circle at 35% 35%, #c3ffd8, #19c26b 60%, #075b30); }
.cur-grief i { background: radial-gradient(circle at 35% 35%, #ffc2c2, #e01e37 60%, #5c0614); border-radius: 30% 30% 50% 50%; }
.chip.bump { animation: bump 0.4s; }
@keyframes bump { 40% { transform: scale(1.3); } }

/* rarity tokens */
.r-common { --rc: var(--c-common); }
.r-rare { --rc: var(--c-rare); }
.r-epic { --rc: var(--c-epic); }
.r-legendary { --rc: var(--c-legendary); }
.r-mythic { --rc: var(--c-mythic); }
.rtag { font-family: var(--font-b); color: var(--rc); text-shadow: var(--outline-s); letter-spacing: 1px; }
.pips { display: flex; gap: 2px; }
.pips b { width: 7px; height: 7px; border: 1.5px solid var(--ink); background: var(--rc); transform: rotate(45deg); }

/* ---------------------------------------------------------- SLOTS (item tiles) */
.slot { position: relative; display: flex; align-items: center; gap: 6px; border: 3px solid var(--ink); border-radius: 8px;
  background: #1a131e; overflow: visible; box-shadow: 3px 3px 0 var(--ink); cursor: pointer; }
.slot .art { position: relative; flex: none; border-radius: 5px; background: #2a2130; display: grid; place-items: center; overflow: hidden; }
.slot .art img { width: 100%; height: 100%; display: block; object-fit: contain; }
.slot .txt { min-width: 0; line-height: 1.02; }
.slot .nm { color: var(--paper); text-shadow: var(--outline-s); display: block; overflow: hidden; }
.slot .empty { font-family: var(--font-d); color: #6d5f74; font-size: 20px; }
.slot.empty-slot { background: repeating-linear-gradient(-45deg, #1a131e 0 8px, #221a27 8px 16px); }
/* frames — shape language per rarity, not just colour */
.slot.r-common { background: #29222c; }
.slot.r-common .art { background: linear-gradient(#4a4150, #2e2733); }
.slot.r-rare { background: #12233a; box-shadow: 3px 3px 0 var(--ink), inset 0 0 0 2px var(--c-rare); }
.slot.r-rare .art { background: radial-gradient(circle, #2f6bb0, #0f2846); }
.slot.r-rare::before, .slot.r-rare::after { content: ''; position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #cfe8ff; border: 1.5px solid var(--ink); top: 3px; left: 3px; box-shadow: 0 0 0 0 transparent; }
.slot.r-rare::after { left: auto; right: 3px; }

/* fly layer (steal transfers, coins) */

  <div id="viewport">
    <div id="stage" data-screen="menu">
      <section id="scr-menu" class="screen"></section>

  <!-- Plain scripts (no modules) so this runs from file:// with zero setup. Order matters. -->
  <script>/* js/config.js */
/* ChaosWorld RNG Raid — ALL tuning + content data lives here.
 * Plain script (no modules) so index.html runs straight from file://.
 * Everything hangs off window.CW (or globalThis.CW under Node tests).
 */
(function (root) {
  'use strict';
  const CW = (root.CW = root.CW || {});

  // ---------------------------------------------------------------- RARITY
  // weight = pull odds (%). tier drives grief/steal/stat tables.
  // frame/pips/shape give a non-colour read (frame style, pip count, label, reveal behaviour).
  CW.RARITIES = [
    { id: 'common',    name: 'COMMON',    tier: 0, weight: 55,  color: '#b8ae9c', dark: '#5a5247', pips: 1, frame: 'plain',  revealMs: 1500, sfx: 'reveal' },
    { id: 'rare',      name: 'RARE',      tier: 1, weight: 28,  color: '#38a6ff', dark: '#0f4f8a', pips: 2, frame: 'rivet',  revealMs: 1800, sfx: 'rare' },
    { id: 'epic',      name: 'EPIC',      tier: 2, weight: 13,  color: '#b44dff', dark: '#561a8c', pips: 3, frame: 'spike',  revealMs: 2200, sfx: 'epic' },
    { id: 'legendary', name: 'LEGENDARY', tier: 3, weight: 3.5, color: '#ffbf1a', dark: '#8a5300', pips: 4, frame: 'crown',  revealMs: 3200, sfx: 'legendary' },
    { id: 'mythic',    name: 'CHAOS',     tier: 4, weight: 0.5, color: '#ff2fa0', dark: '#6b0a45', pips: 5, frame: 'chaos',  revealMs: 3800, sfx: 'mythic' },
  ];
  CW.RARITY_ORDER = CW.RARITIES.map((r) => r.id);
  CW.RARITY = Object.fromEntries(CW.RARITIES.map((r) => [r.id, r]));
  // Chance a Common reel "teases" a big pull (slows like a Legendary) then lands Common anyway.
  CW.FAKEOUT_CHANCE = 0.06;

  // ---------------------------------------------------------------- CLASSES
  // Base combat stats. variants = hero name per rarity (a "Legendary Brute" is a Chaos Lord).

/* Seeded RNG (mulberry32). All gameplay randomness goes through this so debug/test runs are reproducible. */
(function (root) {
  'use strict';
  const CW = (root.CW = root.CW || {});

  class RNG {
    constructor(seed) {
      this.seed = (seed >>> 0) || 1;
      this.s = this.seed;
    }
    next() {
      let t = (this.s += 0x6d2b79f5);
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }
    range(a, b) { return a + (b - a) * this.next(); }
    int(a, b) { return Math.floor(this.range(a, b + 1)); }
    chance(p) { return this.next() < p; }
    pick(arr) { return arr[Math.floor(this.next() * arr.length)]; }
    weighted(items, weightOf) {
      let total = 0;
      for (const it of items) total += Math.max(0, weightOf(it));
      let r = this.next() * total;
      for (const it of items) {
        r -= Math.max(0, weightOf(it));
        if (r < 0) return it;
      }
      return items[items.length - 1];
    }
    shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(this.next() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }
  }
  CW.RNG = RNG;
  CW.randomSeed = () => (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0;

(function (root) {
  'use strict';
  const CW = (root.CW = root.CW || {});
  const SLOTS = ['hero', 'weapon', 'gear'];
  CW.SLOTS = SLOTS;

  const tierOf = (rarity) => CW.RARITY[rarity].tier;
  const rarityAt = (tier) => CW.RARITY_ORDER[Math.max(0, Math.min(CW.RARITY_ORDER.length - 1, tier))];
  CW.tierOf = tierOf;
  CW.rarityAt = rarityAt;

  // Cumulative raid modifiers for a pot value (x100 int).
  CW.raidMods = function (potX100) {
    const out = { pot: potX100, mult: potX100 / 100, enemyHp: 0, enemyDmg: 0, eliteChance: CW.BATTLE.baseEliteChance, bossEnraged: false, tiers: [], label: 'NORMAL' };
    for (const m of CW.RAID_MODIFIERS) {
      if (potX100 < m.at) continue;
      if (m.enemyHp) out.enemyHp += m.enemyHp;
      if (m.enemyDmg) out.enemyDmg += m.enemyDmg;
      if (m.eliteChance) out.eliteChance = Math.max(out.eliteChance, m.eliteChance);
      if (m.bossEnraged) out.bossEnraged = true;
      if (m.at > 100) out.tiers.push(m);
      out.label = m.label;
    }
    // single number for UI/tests: how much harder than baseline
    out.difficulty = (1 + out.enemyHp) * (1 + out.enemyDmg) * (1 + (out.eliteChance - CW.BATTLE.baseEliteChance)) * (out.bossEnraged ? 1.25 : 1);
    return out;
  };
  CW.potLabel = (x100) => 'x' + (x100 / 100).toFixed(x100 % 10 === 0 ? 1 : 2);

  CW.itemLabel = (item) => (item ? `${CW.RARITY[item.rarity].name} ${item.slot === 'hero' ? CW.CLASSES[item.classId].name : item.name}`.toUpperCase() : '—');

  class Lobby {
    constructor(opts = {}) {
      this.mode = CW.MODES[opts.mode || 'rng'];
      this.seed = opts.seed >>> 0 || CW.randomSeed();
      this.rng = new CW.RNG(this.seed);
      this.debug = opts.debug || { forceRarity: null, forceRarityBots: false, forceSteal: null };
      this.k = opts.fast ? CW.TIMINGS.fastScale : 1;
      this.firstSession = !!opts.firstSession;
      this.time = 0;
      this.phase = 'intro';
      this.phaseStart = 0;
      this.phaseEnd = CW.TIMINGS.intro * this.k;
      this.potX100 = CW.RAID_POT.start;
      this.events = [];
      this.log = []; // every event ever, for tests / results
      this.pending = [];
      this._uid = 1;
      this._chatGate = 0;
      this.humanTargetCd = 0;
      this.stats = { legendaryPulls: 0, steals: 0, stealFails: 0, griefs: 0, boosts: 0, botActions: 0 };
      this.biome = opts.biome ? CW.BIOMES.find((b) => b.id === opts.biome) || CW.BIOMES[0] : this.rng.pick(CW.BIOMES);
      this.players = [];
      const hp = opts.human || CW.HUMAN_PROFILE;
      this._addPlayer({ ...hp, isHuman: true, wallet: opts.wallet || { coins: CW.ECONOMY.startCoins, chaos: 1, jack: 2, grief: 1 } });
      const roster = opts.roster || CW.BOT_ROSTER;
      for (const b of roster) {
        const e = CW.ECONOMY;
        this._addPlayer({
          ...b, isHuman: false,
          wallet: {
            coins: Math.round(this.rng.range(e.botCoins[0], e.botCoins[1]) / 10) * 10,
            chaos: this.rng.int(...e.botTokens.chaos), jack: this.rng.int(...e.botTokens.jack), grief: this.rng.int(...e.botTokens.grief),
          },
        });
      }
      this.human = this.players[0];
      this.players.forEach((p, i) => {
        p.joinAt = i === 0 ? 0 : this.rng.range(0.1, CW.TIMINGS.intro * 0.85) * this.k;
      });
    }

    _addPlayer(d) {
      this.players.push({
        id: 'p' + this.players.length, idx: this.players.length, name: d.name, level: d.level, look: d.look,
        isHuman: d.isHuman, personality: d.personality || null, wallet: d.wallet,
        loadout: { hero: null, weapon: null, gear: null },
        revealAt: { hero: Infinity, weapon: Infinity, gear: Infinity },
        pullsDone: 0, nextPullAt: Infinity, idleSince: 0, joined: d.isHuman,
        griefsUsed: 0, rerollsUsed: 0, shieldUntil: 0, guardUntil: 0, nextThinkAt: Infinity,
        lastHitBy: null, chatCd: 0, status: '', statusUntil: 0,
        stats: { steals: 0, stealFails: 0, stolenFrom: 0, griefsDone: 0, griefed: 0, boosts: 0, rerolls: 0, shuffles: 0, legendaries: 0 },
      });
    }

    // ------------------------------------------------------------ helpers
    get(pid) { return this.players.find((p) => p.id === pid); }
    emit(e) { e.t = this.time; this.events.push(e); this.log.push(e); return e; }
    drain() { const e = this.events; this.events = []; return e; }
    isRevealed(p, slot) { return p.loadout[slot] && this.time >= p.revealAt[slot]; }
    allRevealed(p) { return SLOTS.every((s) => this.isRevealed(p, s)); }
    phaseRemaining() { return Math.max(0, this.phaseEnd - this.time); }
    score(p) {
      const l = p.loadout; let s = 0;
      if (l.hero) s += tierOf(l.hero.rarity) * 1.2;
      if (l.weapon) s += tierOf(l.weapon.rarity) * 1.0;
      if (l.gear) s += tierOf(l.gear.rarity) * 0.8;
      return s;
    }
    rerollCost(p) { return CW.REROLL.baseCost + CW.REROLL.costStep * p.rerollsUsed; }
    nextBoostCost() { return CW.RAID_POT.cost; }
    setFast(on) { this.k = on ? CW.TIMINGS.fastScale : 1; }
    status(p, text, sec = 2.5) { p.status = text; p.statusUntil = this.time + sec * this.k; }
    _later(sec, fn) { this.pending.push({ at: this.time + sec, fn }); }

    // ------------------------------------------------------------ item factories
    rollRarity(p) {
      const forced = this.debug.forceRarity;
      if (forced && forced !== 'auto' && (p.isHuman || this.debug.forceRarityBots)) return forced;
      return this.rng.weighted(CW.RARITIES, (r) => r.weight).id;
    }
    pickClass() {
      const counts = {};
      for (const p of this.players) if (p.loadout.hero) counts[p.loadout.hero.classId] = (counts[p.loadout.hero.classId] || 0) + 1;
      return this.rng.weighted(CW.CLASS_IDS, (c) => 1 / (1 + 2 * (counts[c] || 0)));
    }
    makeHero(classId, rarity) {
      return { uid: this._uid++, slot: 'hero', classId, rarity, kind: classId, name: CW.CLASSES[classId].variants[rarity], cracks: 0 };
    }
    makeWeapon(classId, rarity) {
      const def = this.rng.pick(CW.WEAPONS[classId][rarity]);
      return { uid: this._uid++, slot: 'weapon', classId, rarity, name: def.name, kind: def.kind, fx: def.fx || null, cracks: 0 };
    }
    makeGear(rarity) {
      const def = this.rng.pick(CW.GEAR[rarity]);
      return { uid: this._uid++, slot: 'gear', rarity, name: def.name, kind: def.kind, mod: def.mod || null, cracks: 0 };
    }
    // A weapon landing on the wrong class gets reforged into that class's pool at the SAME rarity.
    reforge(weapon, classId) {
      if (!weapon || !classId || weapon.classId === classId) return weapon;
      const w = this.makeWeapon(classId, weapon.rarity);
      w.reforgedFrom = weapon.name; w.cracks = weapon.cracks;
      return w;
    }
    _make(p, slot, rarity) {
      if (slot === 'hero') return this.makeHero(this.pickClass(), rarity);
      if (slot === 'weapon') return this.makeWeapon(p.loadout.hero.classId, rarity);
      return this.makeGear(rarity);
    }
    _reelSec(rarity, fakeout) {
      return (CW.TIMINGS.reelMin + CW.RARITY[rarity].revealMs / 1000 + (fakeout ? 1.4 : 0)) * this.k;
    }
    _place(p, slot, item, delaySec = 0, cause = 'pull') {
      const fakeout = item.rarity === 'common' && this.rng.chance(CW.FAKEOUT_CHANCE);
      const dur = this._reelSec(item.rarity, fakeout) * (cause === 'pull' ? 1 : 0.75);
      p.loadout[slot] = item;
      p.revealAt[slot] = this.time + delaySec + dur;
      this.emit({ type: 'spin', pid: p.id, slot, item, dur, delay: delaySec, fakeout, cause });
      this._later(delaySec + dur, () => this._onReveal(p, slot, item, cause));
      return item;
    }

    // ------------------------------------------------------------ PULLS
    canPull(p) {
      if (this.phase !== 'rolling' || p.pullsDone >= 3) return false;
      if (p.pullsDone > 0 && this.time < p.revealAt[SLOTS[p.pullsDone - 1]]) return false;
      return true;
    }
    pull(pid) {
      const p = typeof pid === 'string' ? this.get(pid) : pid;
      if (!this.canPull(p)) return null;
      const slot = SLOTS[p.pullsDone];
      const item = this._make(p, slot, this.rollRarity(p));
      p.pullsDone++;
      this._place(p, slot, item);
      return item;
    }
    humanPull() { return this.pull(this.human); }

    _onReveal(p, slot, item, cause) {
      if (p.loadout[slot] !== item) return; // replaced mid-spin
      const r = CW.RARITY[item.rarity];
      this.emit({ type: 'reveal', pid: p.id, slot, item, cause });
      if (cause === 'pull' && !p.isHuman && p.pullsDone < 3) {
        p.nextPullAt = this.time + this.rng.range(...CW.TIMINGS.botBetweenPulls) * this.k;
      }
      if (cause === 'pull' && p.isHuman) p.idleSince = this.time;
      if (r.tier >= 3) {
        p.stats.legendaries++;
        this.stats.legendaryPulls++;
        this.emit({ type: 'bigPull', pid: p.id, slot, item });
        this.status(p, r.tier === 4 ? 'CHAOS!!' : 'LEGENDARY!', 4);
        this.emote(p, 'cheer');
        for (const o of this.players) if (o !== p) this.emote(o, this.rng.chance(0.5) ? 'shock' : 'look', p.id);
        if (!p.isHuman) this.say(p, 'selfLegend', { i: item.name }, true);
        this._crowdSay(p, 'otherLegend', { t: p.name }, 2);
      } else if (r.tier === 0) {
        if (slot === 'gear') this.status(p, 'WELP.', 3);
        else if (p.pullsDone >= 3 && this.score(p) < 1.5) this.status(p, 'WELP.', 3);
        if (!p.isHuman) {
          if (item.name === 'Sandals') this._crowdSay(p, 'sandals', { t: p.name }, 1, 0.9);
          else if (this.rng.chance(0.3)) this.say(p, 'selfCommon');
          if (this.rng.chance(0.35)) this.emote(p, 'sad');
        } else if (this.rng.chance(0.5)) this._crowdSay(p, item.name === 'Sandals' ? 'sandals' : 'otherCommon', { t: p.name }, 1, 0.6);
      } else if (r.tier === 2) {
        this.emote(p, 'cheer');
        this.status(p, 'EPIC', 2.5);
      } else if (p.pullsDone >= 3 && !p.isHuman && this.time >= p.revealAt.gear) {
        this.status(p, 'READY', 30);
      }
      if (!p.isHuman && p.pullsDone >= 3 && slot === 'gear' && r.tier > 0 && r.tier < 3) this.status(p, 'READY', 30);
    }

    // ------------------------------------------------------------ CHAOS ACTIONS
    inFlight(item) { return !!(item && item._busy); }

    rerollCheck(p, slot) {
      if (this.phase !== 'chaos') return { ok: false, reason: 'NOT NOW' };
      const item = p.loadout[slot];
      if (!item || !this.isRevealed(p, slot) || this.inFlight(item)) return { ok: false, reason: 'BUSY' };
      const cost = this.rerollCost(p);
      if (p.wallet.coins < cost) return { ok: false, reason: 'NEED ' + cost + ' COINS', cost };
      return { ok: true, cost };
    }
    reroll(pid, slot) {
      const p = typeof pid === 'string' ? this.get(pid) : pid;
      const chk = this.rerollCheck(p, slot);
      if (!chk.ok) { this.emit({ type: 'denied', pid: p.id, action: 'reroll', reason: chk.reason }); return chk; }
      p.wallet.coins -= chk.cost;
      p.rerollsUsed++; p.stats.rerolls++;
      const old = p.loadout[slot];
      let item;
      if (slot === 'hero') {
        item = this.makeHero(this.pickClass(), this.rollRarity(p));
        // the weapon follows the new class (same rarity, reforged)
        const w = p.loadout.weapon;
        if (w && w.classId !== item.classId) { p.loadout.weapon = this.reforge(w, item.classId); this.emit({ type: 'reforge', pid: p.id, slot: 'weapon', item: p.loadout.weapon, from: w }); }
      } else item = this._make(p, slot, this.rollRarity(p));
      this._place(p, slot, item, 0.35 * this.k, 'reroll');
      const delta = tierOf(item.rarity) - tierOf(old.rarity);
      this.emit({ type: 'reroll', pid: p.id, slot, old, item, delta, cost: chk.cost });
      if (!p.isHuman) this.say(p, 'reroll');
      this._later(0.35 * this.k + this._reelSec(item.rarity) * 0.75 + 0.05, () => {
        if (delta < 0) { this.emote(p, 'sad'); if (!p.isHuman) this.say(p, 'rerollWorse', {}, true); else this._crowdSay(p, 'otherCommon', { t: p.name }, 1, 0.5); }
      });
      return { ok: true, old, item, delta, cost: chk.cost };
    }

    shuffleCheck(p) {
      if (this.phase !== 'chaos') return { ok: false, reason: 'NOT NOW' };
      if (SLOTS.some((s) => !this.isRevealed(p, s) || this.inFlight(p.loadout[s]))) return { ok: false, reason: 'BUSY' };
      if ((p.wallet[CW.SHUFFLE.token] || 0) < CW.SHUFFLE.amount) return { ok: false, reason: 'NEED A CHAOS TOKEN' };
      return { ok: true };
    }
    shuffle(pid) {
      const p = typeof pid === 'string' ? this.get(pid) : pid;
      const chk = this.shuffleCheck(p);
      if (!chk.ok) { this.emit({ type: 'denied', pid: p.id, action: 'shuffle', reason: chk.reason }); return chk; }
      p.wallet[CW.SHUFFLE.token] -= CW.SHUFFLE.amount;
      p.stats.shuffles++;
      const old = { ...p.loadout };
      const hero = this.makeHero(this.pickClass(), this.rollRarity(p));
      p.loadout.hero = hero; // so weapon pool uses new class
      const weapon = this.makeWeapon(hero.classId, this.rollRarity(p));
      const gear = this.makeGear(this.rollRarity(p));
      p.loadout.hero = old.hero; // _place will set each
      this._place(p, 'hero', hero, 0.3 * this.k, 'shuffle');
      this._place(p, 'weapon', weapon, 0.9 * this.k, 'shuffle');
      this._place(p, 'gear', gear, 1.5 * this.k, 'shuffle');
      const delta = this.scoreOf({ hero, weapon, gear }) - this.scoreOf(old);
      this.emit({ type: 'shuffle', pid: p.id, old, items: { hero, weapon, gear }, delta });
      if (!p.isHuman) this.say(p, 'shuffle', {}, true);
      this._crowdReact(p, 'look');
      return { ok: true, old, items: { hero, weapon, gear }, delta };
    }
    scoreOf(l) { return this.score({ loadout: l }); }

    stealCheck(actor, target, slot) {
      if (this.phase !== 'chaos') return { ok: false, reason: 'NOT NOW' };
      if (!target || actor === target) return { ok: false, reason: 'NO TARGET' };
      if (!CW.STEAL_RULES.stealableSlots.includes(slot)) return { ok: false, reason: "CAN'T STEAL A HERO" };
      const item = target.loadout[slot];
      if (!item || !this.isRevealed(target, slot) || this.inFlight(item) || this.inFlight(actor.loadout[slot]) || !this.isRevealed(actor, slot)) return { ok: false, reason: 'TOO LATE — MID-ACTION' };
      if (this.mode.unstealable.includes(item.rarity)) return { ok: false, reason: 'BOLTED DOWN', locked: true, chance: 0 };
      if (target.guardUntil > this.time) return { ok: false, reason: 'ON GUARD', chance: CW.STEAL_ODDS[item.rarity] };
      const chance = CW.STEAL_ODDS[item.rarity];
      const c = CW.STEAL_COST;
      let pay = null;
      if ((actor.wallet[c.token] || 0) >= c.amount) pay = c.token;
      else if (actor.wallet.coins >= c.coinAlt) pay = 'coins';
      if (!pay) return { ok: false, reason: 'NEED JACK TOKEN / ' + c.coinAlt + ' COINS', chance };
      return { ok: true, chance, pay, costLabel: pay === 'coins' ? c.coinAlt + ' COINS' : c.amount + ' JACK TOKEN', item };
    }
    steal(aid, tid, slot) {
      const a = typeof aid === 'string' ? this.get(aid) : aid;
      const t = typeof tid === 'string' ? this.get(tid) : tid;
      const chk = this.stealCheck(a, t, slot);
      if (!chk.ok) { this.emit({ type: 'denied', pid: a.id, action: 'steal', reason: chk.reason }); return chk; }
      if (chk.pay === 'coins') a.wallet.coins -= CW.STEAL_COST.coinAlt; else a.wallet[chk.pay] -= CW.STEAL_COST.amount;
      const item = t.loadout[slot];
      const mine = a.loadout[slot];
      item._busy = mine._busy = true;
      let roll = this.rng.next();
      // debug force keeps the dial honest: the needle lands inside the matching zone
      if (this.debug.forceSteal === 'success') roll = roll * chk.chance * 0.98;
      if (this.debug.forceSteal === 'fail') roll = chk.chance + (1 - chk.chance) * (0.02 + roll * 0.96);
      const success = roll < chk.chance;
      const dur = CW.STEAL_RULES.suspenseSec * this.k;
      t.guardUntil = this.time + dur + CW.STEAL_RULES.guardSec * this.k;
      if (t.isHuman || a.isHuman) this.humanTargetCd = this.time + dur + 4 * this.k;
      this.emit({ type: 'stealStart', aid: a.id, tid: t.id, slot, item, chance: chk.chance, roll, success, dur, pay: chk.pay });
      this.emote(a, 'sneak', t.id);
      this.status(a, 'STEALING…', dur / this.k + 0.3);
      if (this.mode.chaosTaxOnSteal) this.addPot(this.mode.chaosTaxOnSteal, a, 'steal');
      this._later(dur, () => this._resolveSteal(a, t, slot, item, mine, success, chk.chance));
      return { ok: true, pending: true, success, chance: chk.chance, pay: chk.pay };
    }
    _resolveSteal(a, t, slot, item, mine, success, chance) {
      item._busy = mine._busy = false;
      if (success) {
        const got = slot === 'weapon' ? this.reforge(item, a.loadout.hero.classId) : item;
        const gave = slot === 'weapon' ? this.reforge(mine, t.loadout.hero.classId) : mine;
        a.loadout[slot] = got; t.loadout[slot] = gave;
        a.revealAt[slot] = t.revealAt[slot] = this.time;
        a.stats.steals++; t.stats.stolenFrom++; this.stats.steals++;
        t.lastHitBy = a.id;
        this.emit({ type: 'stealResult', aid: a.id, tid: t.id, slot, success: true, item: got, original: item, gave, chance });
        this.status(a, 'YOINK', 3); this.status(t, 'ROBBED', 3);
        this.emote(a, 'cheer'); this.emote(t, 'angry', a.id);
        if (!a.isHuman) this.say(a, 'stealWin', { t: t.name }, true);
        if (!t.isHuman) this._later(0.5 * this.k, () => this.say(t, 'stolenFrom', { t: a.name }, true));
        this._crowdReact(a, 'laugh', 0.4);
      } else {
        a.stats.stealFails++; this.stats.stealFails++;
        t.lastHitBy = a.id;
        this.emit({ type: 'stealResult', aid: a.id, tid: t.id, slot, success: false, item, chance });
        this.status(a, 'BUSTED', 3);
        this.emote(a, 'sad'); this.emote(t, 'taunt', a.id);
        if (!t.isHuman) this.say(t, 'stealBlocked', { t: a.name }, true);
        if (!a.isHuman && this.rng.chance(0.5)) this._later(0.8 * this.k, () => this.say(a, 'stealLose', { t: t.name }));
        this._crowdReact(t, 'laugh', 0.5);
      }
    }

    griefCheck(actor, target, slot) {
      if (!this.mode.grief) return { ok: false, reason: 'GRIEF RAID ONLY' };
      if (this.phase !== 'chaos') return { ok: false, reason: 'NOT NOW' };
      if (!target || actor === target) return { ok: false, reason: 'NO TARGET' };
      const item = target.loadout[slot];
      if (!item || !this.isRevealed(target, slot) || this.inFlight(item)) return { ok: false, reason: 'BUSY' };
      if (tierOf(item.rarity) === 0) return { ok: false, reason: 'ALREADY COMMON' };
      if (target.shieldUntil > this.time) return { ok: false, reason: 'SHIELDED', shield: target.shieldUntil - this.time };
      const max = actor.isHuman ? CW.GRIEF_RULES.maxPerPlayer : Math.min(CW.GRIEF_RULES.botMaxPerPlayer, (CW.BOT_PERSONALITIES[actor.personality] || {}).griefMax ?? 1) + (actor.lastHitBy && (CW.BOT_PERSONALITIES[actor.personality] || {}).revenge ? 1 : 0);
      if (actor.griefsUsed >= max) return { ok: false, reason: 'NO CURSES LEFT' };
      const cost = CW.GRIEF_COSTS[item.rarity];
      if (cost.token) {
        if ((actor.wallet[cost.token] || 0) < cost.amount) return { ok: false, reason: 'NEED GRIEF TOKEN', cost };
      } else if (actor.wallet.coins < cost.coins) return { ok: false, reason: 'NEED ' + cost.coins + ' COINS', cost };
      const to = rarityAt(tierOf(item.rarity) - 1);
      return { ok: true, cost, costLabel: cost.token ? cost.amount + ' GRIEF TOKEN' : cost.coins + ' COINS', from: item.rarity, to, item, left: max - actor.griefsUsed };
    }
    grief(aid, tid, slot) {
      const a = typeof aid === 'string' ? this.get(aid) : aid;
      const t = typeof tid === 'string' ? this.get(tid) : tid;
      const chk = this.griefCheck(a, t, slot);
      if (!chk.ok) { this.emit({ type: 'denied', pid: a.id, action: 'grief', reason: chk.reason }); return chk; }
      if (chk.cost.token) a.wallet[chk.cost.token] -= chk.cost.amount; else a.wallet.coins -= chk.cost.coins;
      a.griefsUsed++;
      const item = t.loadout[slot];
      item._busy = true;
      // shield goes up immediately so two griefers can't double-tap the same victim
      const dur = CW.GRIEF_RULES.resolveSec * this.k;
      t.shieldUntil = this.time + dur + CW.GRIEF_RULES.immunitySec * this.k;
      if (t.isHuman || a.isHuman) this.humanTargetCd = this.time + dur + 4 * this.k;
      this.emit({ type: 'griefStart', aid: a.id, tid: t.id, slot, item, dur });
      this.emote(a, 'cast', t.id);
      this._later(dur, () => {
        item._busy = false;
        const from = item.rarity;
        item.rarity = chk.to;
        item.cracks++;
        if (item.slot === 'hero') item.name = CW.CLASSES[item.classId].variants[item.rarity];
        a.stats.griefsDone++; t.stats.griefed++; this.stats.griefs++;
        t.lastHitBy = a.id;
        this.emit({ type: 'grief', aid: a.id, tid: t.id, slot, item, from, to: item.rarity });
        this.status(t, 'CURSED', 3);
        this.emote(t, 'angry', a.id);
        if (!t.isHuman) this._later(0.4 * this.k, () => this.say(t, 'griefed', { t: a.name, i: item.name }, true));
        if (!a.isHuman && this.rng.chance(0.6)) this._later(1.1 * this.k, () => this.say(a, 'grieferGloat'));
        this._crowdReact(a, 'laugh', 0.4);
        if (this.mode.chaosTaxOnGrief) this.addPot(this.mode.chaosTaxOnGrief, a, 'grief');
      });
      return { ok: true, pending: true, from: chk.from, to: chk.to };
    }

    boostCheck(p) {
      if (this.phase !== 'chaos' && this.phase !== 'rolling') return { ok: false, reason: 'NOT NOW' };
      if (this.potX100 >= CW.RAID_POT.cap) return { ok: false, reason: 'POT MAXED' };

      const chk = this.boostCheck(p);
      if (!chk.ok) { this.emit({ type: 'denied', pid: p.id, action: 'boost', reason: chk.reason }); return chk; }
      p.wallet.coins -= chk.cost;
      p.stats.boosts++; this.stats.boosts++;
      const from = this.potX100;
      this.addPot(CW.RAID_POT.step, p, 'boost');
      this.emit({ type: 'boost', pid: p.id, from, to: this.potX100, cost: chk.cost });
      if (!p.isHuman && this.rng.chance(0.5)) this.say(p, 'boost');
      this.emote(p, 'cheer');
      for (const o of this.players) {
        if (o === p) continue;
        const per = CW.BOT_PERSONALITIES[o.personality];
        if (per && this.potX100 > per.boostCeil) { this.emote(o, 'panic', p.id); if (this.rng.chance(0.4)) this.say(o, 'boostPanic'); }
        else if (this.rng.chance(0.35)) this.emote(o, this.potX100 >= 170 ? 'panic' : 'cheer');

    }
    addPot(amount, p, reason) {
      const from = this.potX100;
      this.potX100 = Math.min(CW.RAID_POT.cap, this.potX100 + amount);
      if (reason !== 'boost' && this.potX100 !== from) this.emit({ type: 'chaosTax', pid: p && p.id, from, to: this.potX100, reason });

        if (m.at > from && m.at <= this.potX100) {
          this.emit({ type: 'potTier', mod: m, pot: this.potX100 });
          if (m.bossEnraged) {
            for (const o of this.players) this.emote(o, this.rng.chance(0.5) ? 'panic' : 'cheer');
            this._crowdSay(null, 'chaosRaid', {}, 2, 1);
          }
        }
      }
    }
    setPot(x100) { const v = Math.max(100, Math.min(CW.RAID_POT.cap, Math.round(x100))); if (v > this.potX100) this.addPot(v - this.potX100, null, 'debug'); else this.potX100 = v; }

    // ------------------------------------------------------------ chat / emotes
    say(p, key, vars = {}, force = false) {

      if (!force && per && !this.rng.chance(per.chatty)) return;

      this._chatGate = this.time + 0.5 * this.k;

    }
    _crowdSay(subject, key, vars, n = 1, p = 0.8) {

      let said = 0;
      for (const o of others) {
        if (said >= n) break;

    }
    _crowdReact(subject, emote, p = 0.5) {
      for (const o of this.players) if (o !== subject && this.rng.chance(p)) this.emote(o, emote, subject && subject.id);
    }
    emote(p, emote, at) { this.emit({ type: 'emote', pid: p.id, emote, at }); }

    // ------------------------------------------------------------ bots
    _botThink(p) {
      const per = CW.BOT_PERSONALITIES[p.personality];
      const agg = this.mode.botAggression;
      const opts = [];
      const hum = this.human;
      const humanOk = (o) => !o.isHuman || this.time >= this.humanTargetCd;
      // boost
      const bc = this.boostCheck(p);
      if (bc.ok && this.potX100 < per.boostCeil && p.stats.boosts < per.boostMax && p.wallet.coins >= bc.cost + 100) opts.push({ w: per.wBoost * this.mode.botBoostBias, fn: () => this.boost(p) });
      // reroll worst
      const worst = SLOTS.slice().sort((x, y) => tierOf(p.loadout[x].rarity) - tierOf(p.loadout[y].rarity))[0];
      const rc = this.rerollCheck(p, worst);
      if (rc.ok && p.wallet.coins >= rc.cost + 50) {
        const wt = tierOf(p.loadout[worst].rarity);
        opts.push({ w: per.wReroll * (wt === 0 ? 1.2 : wt === 1 ? 0.5 : 0.1), fn: () => this.reroll(p, worst) });
      }
      // shuffle when sad
      if (this.shuffleCheck(p).ok && this.score(p) < 2) opts.push({ w: per.wShuffle, fn: () => this.shuffle(p) });
      // steal: best EV (prefer revenge target)
      let best = null;
      for (const o of this.players) {
        if (o === p || !humanOk(o)) continue;
        for (const s of CW.STEAL_RULES.stealableSlots) {
          const c = this.stealCheck(p, o, s);
          if (!c.ok) continue;
          const gain = tierOf(o.loadout[s].rarity) - tierOf(p.loadout[s].rarity);
          if (gain <= 0) continue;
          let ev = c.chance * gain * (1 + 0.3 * gain);
          if (p.lastHitBy === o.id && per.revenge) ev *= 3;
          if (!best || ev > best.ev) best = { ev, o, s };
        }
      }
      if (best) opts.push({ w: per.wSteal * agg * Math.min(1.5, 0.6 + best.ev), fn: () => this.steal(p, best.o, best.s) });
      // grief: knock down the shiniest thing in the room
      if (this.mode.grief) {
        let gb = null;
        for (const o of this.players) {
          if (o === p || !humanOk(o)) continue;
          for (const s of SLOTS) {
            const c = this.griefCheck(p, o, s);
            if (!c.ok) continue;
            let v = tierOf(o.loadout[s].rarity) + this.score(o) * 0.2;
            if (o.isHuman) v *= 1.3;
            if (p.lastHitBy === o.id) v *= per.revenge ? 3 : 1.5;
            if (c.cost.token) v *= 0.8;
            if (!gb || v > gb.v) gb = { v, o, s };
          }
        }
        if (gb && gb.v >= 2) opts.push({ w: per.wGrief * agg, fn: () => this.grief(p, gb.o, gb.s) });
      }
      // revenge grudge: big weight boost if something targets attacker
      if (per.revenge && p.lastHitBy) for (const o of opts) o.w *= 1.1;
      opts.push({ w: 0.8, fn: () => { if (this.rng.chance(0.25)) { this.emote(p, 'taunt', hum.id); this.say(p, 'taunt'); } } });
      const pick = this.rng.weighted(opts, (o) => o.w);
      const before = this.log.length;
      pick.fn();
      if (this.log.slice(before).some((e) => ['boost', 'reroll', 'shuffle', 'stealStart', 'griefStart'].includes(e.type))) this.stats.botActions++;
      p.nextThinkAt = this.time + (this.rng.range(...per.think) * this.k) / agg;
    }

    // ------------------------------------------------------------ main loop
    setPhase(ph, dur) {
      this.phase = ph;
      this.phaseStart = this.time;
      this.phaseEnd = this.time + dur;
      this.emit({ type: 'phase', phase: ph, dur });
      if (ph === 'rolling') {
        for (const p of this.players) if (!p.isHuman) p.nextPullAt = this.time + this.rng.range(...CW.TIMINGS.botFirstPull) * this.k;
        this.human.idleSince = this.time;
      }
      if (ph === 'chaos') {
        for (const p of this.players) {
          if (!p.isHuman) { p.nextThinkAt = this.time + this.rng.range(1.2, 3.5) * this.k / this.mode.botAggression; this.status(p, '', 0); }
        }
      }
      if (ph === 'launch') this._crowdSay(null, 'launch', {}, 2, 0.7);
    }

    update(dt) {
      this.time += dt;
      // pending (sorted resolution)
      if (this.pending.length) {
        this.pending.sort((a, b) => a.at - b.at);
        while (this.pending.length && this.pending[0].at <= this.time) this.pending.shift().fn();
      }
      for (const p of this.players) if (p.status && this.time > p.statusUntil) p.status = '';
      switch (this.phase) {
        case 'intro':
          for (const p of this.players) if (!p.joined && this.time >= p.joinAt) { p.joined = true; this.emit({ type: 'join', pid: p.id }); if (this.rng.chance(0.3)) this.say(p, 'join'); }
          if (this.time >= this.phaseEnd) {
            this._joinAll();
            this.setPhase('rolling', CW.TIMINGS.rollPhaseMax * this.k);
          }
          break;
        case 'rolling': {
          for (const p of this.players) if (!p.isHuman && p.pullsDone < 3 && this.time >= p.nextPullAt) { p.nextPullAt = Infinity; this.pull(p); }
          const h = this.human;
          if (this.canPull(h) && this.time - Math.max(h.idleSince, h.pullsDone ? h.revealAt[SLOTS[h.pullsDone - 1]] : 0) > CW.TIMINGS.humanAutoPullSec * this.k) {
            this.emit({ type: 'autoPull', pid: h.id });
            this.pull(h);
          }
          const allDone = this.players.every((p) => p.pullsDone >= 3 && this.allRevealed(p));
          if (allDone) {
            if (!this._chaosAt) this._chaosAt = this.time + CW.TIMINGS.preChaosPause * this.k;
            if (this.time >= this._chaosAt) this.setPhase('chaos', this.mode.chaosSec * this.k);
          } else if (this.time >= this.phaseEnd) {
            // hard cap: force remaining pulls with short reels
            for (const p of this.players) while (p.pullsDone < 3) { const s = SLOTS[p.pullsDone]; p.loadout[s] = this._make(p, s, this.rollRarity(p)); p.revealAt[s] = this.time; p.pullsDone++; }

          }
          break;
        }
        case 'chaos':
          for (const p of this.players) if (!p.isHuman && this.time >= p.nextThinkAt) this._botThink(p);
          if (this.time >= this.phaseEnd) this.setPhase('launch', CW.TIMINGS.launchCountdown * this.k);
          break;
        case 'launch':
          if (this.time >= this.phaseEnd && !this.pending.length) { this.phase = 'done'; this.emit({ type: 'launchNow' }); }
          break;
      }
    }

    // Debug: finish everything instantly and jump to the dungeon.
    _joinAll() { for (const p of this.players) if (!p.joined) { p.joined = true; this.emit({ type: 'join', pid: p.id }); } }
    skipToBattle() {
      this._joinAll();
      for (const p of this.players) {
        while (p.pullsDone < 3) { const s = SLOTS[p.pullsDone]; p.loadout[s] = this._make(p, s, this.rollRarity(p)); p.pullsDone++; }
        for (const s of SLOTS) { p.revealAt[s] = this.time; if (p.loadout[s]) p.loadout[s]._busy = false; }
      }
      this.pending = [];
      this.phase = 'done';
      this.emit({ type: 'launchNow', skipped: true });
    }
    skipPhase() {
      if (this.phase === 'intro' || this.phase === 'rolling') {
        this._joinAll();
        for (const p of this.players) { while (p.pullsDone < 3) { const s = SLOTS[p.pullsDone]; p.loadout[s] = this._make(p, s, this.rollRarity(p)); p.pullsDone++; } for (const s of SLOTS) p.revealAt[s] = Math.min(p.revealAt[s], this.time); }
        this.setPhase('chaos', this.mode.chaosSec * this.k);
      } else if (this.phase === 'chaos') this.phaseEnd = this.time;
      else if (this.phase === 'launch') this.phaseEnd = this.time;
    }

    // Snapshot for the battle
    partySpec() {
      return this.players.map((p) => ({ id: p.id, name: p.name, isHuman: p.isHuman, look: p.look, level: p.level, personality: p.personality, loadout: { hero: p.loadout.hero, weapon: p.loadout.weapon, gear: p.loadout.gear } }));
    }
  }
  CW.Lobby = Lobby;
})(typeof window !== 'undefined' ? window : globalThis);

  <script>/* js/battle-core.js */
/* Dungeon battle — pure logic, deterministic with a seed. UI renders `units`, `projectiles` and drains `events`.
 * The RNG lobby loadout feeds deriveStats(), which is the ONLY place lobby items become combat numbers.
 */
(function (root) {
  'use strict';
  const CW = (root.CW = root.CW || {});

  // ------------------------------------------------------------ LOADOUT → STATS
  CW.deriveStats = function (loadout) {

    const hm = CW.HERO_RARITY_STATS[hero.rarity].mult;
    const ws = CW.WEAPON_RARITY_STATS[weapon ? weapon.rarity : 'common'];
    const gs = CW.GEAR_RARITY_STATS[gear ? gear.rarity : 'common'];
    const s = {
      classId: cls.id, role: cls.role, range: cls.range, dmgType: cls.dmgType,

      atk: cls.atk * hm * (1 + ws.dmg),
      aspd: cls.aspd * (1 + ws.aspd),
      crit: cls.crit + ws.crit,
      def: gs.def, dodge: 0, resist: 0, thorns: 0, lifesteal: 0, revive: 0,
      fx: weapon && weapon.fx && ws.fxChance > 0 ? weapon.fx : null,
      fxChance: ws.fxChance,
      skillPower: hm,
      skills: cls.skills.slice(),
    };
    if (gear && gear.mod) {
      const m = CW.GEAR_MODS[gear.mod];
      const v = (m.base * gs.modPower) / 100;
      if (gear.mod === 'haste') s.aspd *= 1 + v; else s[gear.mod] = v;
    }
    s.hp = Math.round(s.hp);
    s.atk = Math.round(s.atk * 10) / 10;
    s.dps = s.atk * s.aspd * (1 + (s.crit / 100) * (CW.BATTLE.critMult - 1));
    s.power = Math.round(s.dps * 4 + s.hp / 10);

  // Human-readable stat lines for an item card (keeps UI out of the maths).
  CW.itemStatLines = function (item) {

      const m = CW.HERO_RARITY_STATS[item.rarity].mult;
      return [`${c.role.toUpperCase()} · ${c.range.toUpperCase()}`, `HP ${Math.round(c.hp * m)} · ATK ${Math.round(c.atk * m)}`];
    }
    if (item.slot === 'weapon') {
      const w = CW.WEAPON_RARITY_STATS[item.rarity];
      const out = [`${w.dmg >= 0 ? '+' : ''}${Math.round(w.dmg * 100)}% DMG${w.crit ? ` · +${w.crit}% CRIT` : ''}`];
      if (item.fx && w.fxChance > 0) out.push(`${Math.round(w.fxChance * 100)}% ${CW.WEAPON_FX[item.fx].name.toUpperCase()}`);

  class Battle {

      while (ranged.length > 5) melee.push(ranged.pop());
      const place = (row, y) => row.forEach((u, i) => { u.hx = 270 + (i - (row.length - 1) / 2) * 96 + (y === PARTY_ROWS.back ? 20 : 0); u.hy = y + (i % 2) * 10; u.x = u.hx; u.y = u.hy; });

    }

    // ------------------------------------------------------------ combat maths
    _buffVal(u, type) { let v = 0; for (const b of u.buffs) if (b.type === type && b.until > this.time) v += b.val; return v; }

    _pickEnemyTarget(attacker) {

        return ens.slice().sort((a, b) => Math.abs(a.hx - attacker.hx) - Math.abs(b.hx - attacker.hx) + (b.hy - a.hy) * 0.5)[0];

      const taunter = p.find((u) => u.tauntUntil > this.time);
      if (taunter && this.rng.chance(0.75)) return taunter;
      return this.rng.weighted(p, (u) => (u.role === 'tank' ? 2.6 : u.range === 'melee' ? 1.6 : 1) * (u.summon ? 1.2 : 1));
    }

    _hit(src, tgt, power, opt = {}) {
      if (!tgt || !tgt.alive) return 0;

      if (src.side === 'party') dmg *= 1 + this._buffVal(src, 'dmg');

      if (opt.forceCrit || this.rng.chance(critChance)) { crit = true; dmg *= CW.BATTLE.critMult; }
      if (tgt.side === 'party') {
        const dodge = tgt.dodge + this._buffVal(tgt, 'dodge') / 100;
        if (!opt.unavoidable && this.rng.chance(dodge)) { this.emit({ type: 'dmg', tid: tgt.id, sid: src.id, amount: 0, dodge: true }); return 0; }

        if (ls) this._heal(src, src, dmg * ls, true);
        if (!opt.noFx && src.fx && this.rng.chance(src.fxChance)) this._weaponFx(src, tgt, dmg);
      }

    }

    _applyDamage(src, tgt, dmg, crit, fx) {
      if (!tgt.alive) return;

      tgt.hp -= real;
      tgt.anim.hit = 0.25;

      if (sst) sst.dmg += dmg;
      if (this.stats[tgt.id]) this.stats[tgt.id].taken += real;
      this.emit({ type: 'dmg', tid: tgt.id, sid: src.id, amount: Math.round(dmg), crit, fx, shielded: absorbed > 0 });

    }

    _die(u, killer) {
      if (u.side === 'party' && u.revive && !u.revived) {
        u.revived = true; u.hp = Math.round(u.maxHp * u.revive);

    }

    _statFor(u) { return this.stats[u.id] || (u.statOwner ? this.stats[u.statOwner] : null); }

    _heal(src, tgt, amt, quiet) {

      const real = Math.min(tgt.maxHp - tgt.hp, Math.round(amt));
      if (real <= 0) return 0;
      tgt.hp += real;
      const sst = this._statFor(src);
      if (sst) sst.heal += real;
      if (!quiet || real > 25) this.emit({ type: 'heal', tid: tgt.id, sid: src.id, amount: real });

    }

    _dot(src, tgt, type, dps, dur) {
      if (!tgt.alive) return;
      const ex = tgt.dots.find((d) => d.type === type && d.src === src.id);
      if (ex && type !== 'poison') { ex.until = this.time + dur; ex.dps = Math.max(ex.dps, dps); return; }
      tgt.dots.push({ type, dps, until: this.time + dur, src: src.id, tick: 0 });
    }

    _weaponFx(src, tgt, dmg) {
      const fx = src.fx;
      this.emit({ type: 'wfx', fx, sid: src.id, tid: tgt.id });
      switch (fx) {
        case 'burn': this._dot(src, tgt, 'burn', src.atk * 0.35, 3); break;
        case 'bleed': this._dot(src, tgt, 'bleed', src.atk * 0.3, 4); break;
        case 'poison': this._dot(src, tgt, 'poison', src.atk * 0.22, 4); break;
        case 'stun': tgt.stunUntil = Math.max(tgt.stunUntil, this.time + (tgt.boss ? 0.4 : CW.BATTLE.stunSec)); break;
        case 'chain': {

          for (const o of others) this._hit(src, o, 0.6, { noFx: true, fx: 'chain' });
          break;
        }
        case 'holy': {
          const low = this.party().sort((a, b) => a.hp / a.maxHp - b.hp / b.maxHp)[0];
          this._heal(src, low, dmg * 0.6);
          break;
        }
        case 'voidEcho':
          this._delayed(0.4, () => { if (tgt.alive) this._hit(src, tgt, 0.85, { noFx: true, fx: 'voidEcho' }); else { const e = this._pickEnemyTarget(src); if (e) this._hit(src, e, 0.85, { noFx: true, fx: 'voidEcho' }); } });
          break;
        case 'cataclysm':
          for (const e of this.enemies()) this._hit(src, e, 0.7, { noFx: true, fx: 'cataclysm' });
          this.emit({ type: 'shake', power: 6 });

    _delayed(sec, fn) { (this._timers || (this._timers = [])).push({ at: this.time + sec, fn }); }

    _attack(u) {
      const tgt = u.side === 'party' ? this._pickEnemyTarget(u) : this._pickPartyTarget();
      if (!tgt) return;
      if (u.side === 'party' && u.role === 'healer') {
        const low = this.party().sort((a, b) => a.hp / a.maxHp - b.hp / b.maxHp)[0];
        if (low && low.hp / low.maxHp < 0.7) {
          this.projectiles.push({ id: this._uid++, from: u.id, to: low.id, x: u.x, y: u.y, kind: 'heal', speed: 520, payload: () => this._heal(u, low, u.atk * 1.6 * u.skillPower) });
          u.anim.cast = 0.25;
          return;

      const ens = this.enemies();

        case 'shieldParty': for (const a of this.party()) a.shield += a.maxHp * d.shield * P; break;
        case 'summon':
          for (let i = 0; i < d.count; i++) {
            const sk = this._unit({ side: 'party', name: 'Skeleton', summon: true, owner: u.id, classId: 'skeleton', role: 'dps', range: 'melee', maxHp: Math.round(160 * P), atk: 14 * P, aspd: 1.0, crit: 5, hx: u.hx + (i ? 40 : -40), hy: PARTY_ROWS.front - 40, lifetime: 12, look: null });

          }

    _enemySpecial(e) {

    update(dt) {

      if (this.time > CW.BATTLE.maxTime) return this._end(false, 'timeout');

      for (const u of this.units) {

        u.buffs = u.buffs.filter((b) => b.until > this.time);
        // dots
        for (const d of u.dots) {
          d.tick += dt;
          if (d.tick >= 0.5) { d.tick -= 0.5; const src = this.get(d.src) || u; this._applyDamage(src, u, Math.round(d.dps * 0.5), false, d.type); }
        }
        u.dots = u.dots.filter((d) => d.until > this.time);
        if (!u.alive) continue;
        if (u.summon) { u.lifetime -= dt; if (u.lifetime <= 0) { u.alive = false; this.emit({ type: 'death', tid: u.id, side: 'party', summon: true }); continue; } }
        for (const s of u.skills) s.cdLeft = Math.max(0, s.cdLeft - dt);
        if (u.botCastDelay > 0) u.botCastDelay -= dt;
        if (this.time < u.stunUntil) continue;
        const aspd = u.aspd * (1 + this._buffVal(u, 'aspd'));
        u.atkCd -= dt * aspd;
        if (u.atkCd <= 0) { u.atkCd += 1; this._attack(u); }
        if (u.side === 'party' && (!u.isHuman || this.autoHuman)) this._botCast(u);
        if (u.side === 'enemy' && u.specialCd) { u.specialCd -= dt; if (u.specialCd <= 0) this._enemySpecial(u); }
        if (u.boss && u.enraged && !u.addsSpawned && u.hp < u.maxHp / 2) {
          u.addsSpawned = true;
          this.emit({ type: 'enrage', sid: u.id });
          for (let i = 0; i < CW.BATTLE.bossEnrage.addsAtHalf; i++) {
            const key = this.rng.pick(this.biome.enemies), def = CW.ENEMIES[key];
            const a = this._unit({ side: 'enemy', key, name: def.name, def, shape: def.shape, color: def.color, size: def.size, maxHp: Math.round(def.hp * CW.BATTLE.enemyHpScale * (1 + this.mods.enemyHp)), atk: def.atk * CW.BATTLE.enemyAtkScale * (1 + this.mods.enemyDmg), aspd: def.aspd, range: 'melee', hx: 110 + i * 160, hy: 430, x: 270, y: 300, crit: 5, specialCd: 0 });
            a.hx = 110 + i * 160;

      this.projectiles = this.projectiles.filter((p) => !p.dead);
      this._tickMove(dt);

      if (!this.heroes().length) return this._end(false);
      if (!this.enemies().length) {
        this.emit({ type: 'waveClear', wave: this.wave });
        for (const u of this.party(false)) if (u.summon) u.alive = false;
        for (const h of this.heroes()) { this._heal(h, h, h.maxHp * CW.BATTLE.waveHealPct, true); h.dots = []; }

    // headless run (tests / balance sim)
    runToEnd(step = 1 / 30, maxSec = 400) {
      let t = 0;

  }

  CW.computeRewards = function ({ won, potX100, modeId, rng, humanStats, mvp }) {

      if (extra > 0) lines.push({ label: `RAID POT ${CW.potLabel(potX100)}`, value: extra, pot: true });

    const b = UI.el(`<div class="burst r-${rarity}"></div>`);
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + Math.random() * 0.4, d = spread * (0.5 + Math.random() * 0.6);
      const p = document.createElement('i');
      p.style.setProperty('--dx', Math.cos(a) * d + 'px'); p.style.setProperty('--dy', Math.sin(a) * d + 'px');
      p.style.animationDelay = Math.random() * 0.08 + 's';
      b.appendChild(p);
    }
    host.appendChild(b); setTimeout(() => b.remove(), 1000);
  };
  UI.rays = function (host, mythic) {
    const r = UI.el(`<div class="rays${mythic ? ' mythic' : ''}"></div>`);
    host.appendChild(r); setTimeout(() => r.remove(), 2300);
  };
  UI.restartAnim = function (elm, cls) { elm.classList.remove(cls); void elm.offsetWidth; elm.classList.add(cls); };

  // Banner queue (one at a time, short)
  const bannerQ = [];
  let bannerBusy = false;
  UI.banner = function (host, { top = '', main = '', sub = '', color = null, ms = 1500, priority = false, key = null }) {
    const item = { host, top, main, sub, color, ms, key };
    // coalesce: a newer banner of the same kind replaces one still waiting in the queue (e.g. rapid boosts)
    if (key) { const i = bannerQ.findIndex((b) => b.key === key); if (i >= 0) { bannerQ[i] = item; return; } }
    if (priority) bannerQ.unshift(item); else bannerQ.push(item);
    if (bannerQ.length > 4) bannerQ.splice(1, bannerQ.length - 4);
    if (!bannerBusy) nextBanner();
  };
  UI.clearBanners = () => { bannerQ.length = 0; };
  function nextBanner() {
    const b = bannerQ.shift();
    if (!b) { bannerBusy = false; return; }
    bannerBusy = true;
    const k = (CW.App && CW.App.fast) ? 0.45 : 1;
    const e = UI.el(`<div class="banner" ${b.color ? `style="--bc:${b.color}"` : ''}>${b.top ? `<div class="b1">${b.top}</div>` : ''}<div class="b2">${b.main}</div>${b.sub ? `<div class="b3">${b.sub}</div>` : ''}</div>`);
    b.host.appendChild(e);
    setTimeout(() => { e.classList.add('out'); setTimeout(() => { e.remove(); nextBanner(); }, 230); }, b.ms * k);
  }

  // ------------------------------------------------------------ modal
  UI.modalOpen = false;
  UI.openModal = function (html, cls = '') {
    const ov = $('#overlay');
    ov.innerHTML = `<div class="modal ${cls}">${html}</div>`;
    ov.classList.add('open');
    UI.modalOpen = true;
    return ov.firstElementChild;
  };
  UI.closeModal = function () {
    const ov = $('#overlay');
    ov.classList.remove('open'); ov.innerHTML = '';
    UI.modalOpen = false;
    if (UI.onModalClose) { const f = UI.onModalClose; UI.onModalClose = null; f(); }
  };

  // ------------------------------------------------------------ fly animations
  UI.fly = function (fromEl, toEl, item, { ms = 650, chain = false, delay = 0 } = {}) {
    return new Promise((res) => {
      setTimeout(() => {
        const layer = $('#fly-layer');
        const a = UI.centerOf(fromEl), b = UI.centerOf(toEl);
        let ch = null;
        if (chain) {
          ch = UI.el('<div class="chain"></div>');
          ch.style.left = b.x + 'px'; ch.style.top = b.y - 4 + 'px';
          ch.style.width = Math.hypot(a.x - b.x, a.y - b.y) + 'px';
          ch.style.transform = `rotate(${Math.atan2(a.y - b.y, a.x - b.x)}rad)`;
          layer.appendChild(ch);
        }
        const f = UI.el(`<div class="flyer r-${item.rarity}"><img src="${UI.artFor(item)}"></div>`);
        f.style.left = a.x + 'px'; f.style.top = a.y + 'px';
        layer.appendChild(f);
        const anim = f.animate([
          { left: a.x + 'px', top: a.y + 'px', transform: 'scale(1) rotate(0deg)' },
          { left: (a.x + b.x) / 2 + 'px', top: Math.min(a.y, b.y) - 70 + 'px', transform: 'scale(1.5) rotate(200deg)', offset: 0.5 },
          { left: b.x + 'px', top: b.y + 'px', transform: 'scale(1) rotate(360deg)' },
        ], { duration: ms, easing: 'cubic-bezier(.5,0,.4,1)' });
        if (ch) ch.animate([{ width: ch.style.width }, { width: '0px' }], { duration: ms, easing: 'cubic-bezier(.5,0,.4,1)' });
        anim.onfinish = () => { f.remove(); if (ch) ch.remove(); res(); };
      }, delay);
    });
  };
  UI.beam = function (fromEl, toEl) {
    const a = UI.centerOf(fromEl), b = UI.centerOf(toEl);
    const bm = UI.el('<div class="beam"></div>');
    bm.style.left = a.x + 'px'; bm.style.top = a.y - 3 + 'px';
    bm.style.width = Math.hypot(b.x - a.x, b.y - a.y) + 'px';
    bm.style.transform = `rotate(${Math.atan2(b.y - a.y, b.x - a.x)}rad)`;
    $('#fly-layer').appendChild(bm);
    setTimeout(() => bm.remove(), 950);
  };
  UI.coins = function (fromEl, toEl, n = 6) {
    const a = UI.centerOf(fromEl), b = UI.centerOf(toEl);
    for (let i = 0; i < n; i++) {
      const c = UI.el('<div class="coin-fly"></div>');
      $('#fly-layer').appendChild(c);
      const mx = (a.x + b.x) / 2 + (Math.random() - 0.5) * 120, my = Math.min(a.y, b.y) - 40 - Math.random() * 60;
      c.animate([{ left: a.x + 'px', top: a.y + 'px' }, { left: mx + 'px', top: my + 'px' }, { left: b.x + 'px', top: b.y + 'px' }],
        { duration: 600 + i * 50, delay: i * 40, easing: 'ease-in', fill: 'both' }).onfinish = () => c.remove();
    }
  };

  CW.UI = UI;
})(window);

</script>
  <script>/* js/lobby-ui.js */
/* Lobby presentation. Reads CW.Lobby state + drains its events. Owns no game rules. */
(function (root) {
  'use strict';
  const CW = root.CW;
  const UI = CW.UI;
  const { $, $$, esc } = UI;
  const SLOTS = CW.SLOTS;
  const TOKEN_NAME = { jack: 'JACK TOKEN', chaos: 'CHAOS TOKEN', grief: 'GRIEF TOKEN' };

  const LobbyUI = {
    lobby: null, root: null, disp: {}, target: null, actors: {}, callouts: [], feed: [],
    _abSig: '', _tgSig: '', _tgAt: 0, _cdLast: null, _humanSteal: null, _rt: 0,
  };

  // ------------------------------------------------------------ mount
  LobbyUI.mount = function (lobby, opts = {}) {
    const L = (this.lobby = lobby);
    this.opts = opts;
    this.root = $('#scr-lobby');
    this.disp = {}; this.target = null; this.actors = {}; this.feed = []; this._abSig = ''; this._tgSig = ''; this._cdLast = null; this._humanSteal = null;
    this._tutorial = !!opts.tutorial; this._calloutStep = -1; this._potTier = 100;
    UI.clearBanners();
    const m = L.mode;
    const b = L.biome;
    const ticks = CW.RAID_MODIFIERS.filter((x) => x.at > 100).map((x) => {
      const pct = ((x.at - 100) / (CW.RAID_POT.cap - 100)) * 100;
      return `<div class="pot-tick" data-at="${x.at}" style="left:calc(${pct}% - ${x.at === CW.RAID_POT.cap ? 3 : 1.5}px)"><span>${x.at === CW.RAID_POT.cap ? '☠ x2' : x.short}</span></div>`;
    }).join('');
    this.root.className = 'screen';
    this.root.innerHTML = `
      <div class="lb-top">
        <div>
          <div class="lb-title ${m.grief ? 'grief' : ''}">${m.grief ? 'GRIEF RAID' : 'CHAOS RAID'}</div>
          <div class="lb-sub"><b>${b.name}</b> · <span class="skulls">${'☠'.repeat(b.difficulty)}</span></div>
        </div>
        <div class="lb-timer"><div><div class="num">--</div><div class="lbl">JOINING</div></div></div>
        <div class="lb-wallet">${UI.wallet(L.human.wallet)}</div>
      </div>
      <div class="pot">
        <div class="pot-label"><small>RAID POT</small><span class="mult">x1.0</span></div>
        <div class="pot-meter"><div class="pot-fill"></div>${ticks}<div class="pot-next"></div></div>
        <button class="btn gold" data-act="boost">BOOST<small>+0.1 · ${CW.RAID_POT.cost}c</small></button>
      </div>
      <div class="you" id="card-${L.human.id}" data-pid="${L.human.id}">
        <div class="shield">IMM</div><div class="status"></div>
        <div class="you-head"><div class="ava"><img src="${CW.Art.bust(L.human.look, null, null, 76, '#4b3a57')}"></div>
          <span class="you-name">${esc(L.human.name)}</span><span class="tag-you">YOUR LOADOUT</span><span class="lv">LV ${L.human.level}</span>
          <div class="you-power">LOADOUT POWER<br><b class="pw">—</b></div></div>
        <div class="you-slots">${SLOTS.map((s) => this.slotShell(L.human.id, s)).join('')}</div>
      </div>
      <div class="others">${L.players.filter((p) => !p.isHuman).map((p) => `
        <div class="pcard joining" id="card-${p.id}" data-pid="${p.id}">
          <div class="shield">IMM</div>
          <div class="ava"><img src="${CW.Art.bust(p.look, null, null, 64, '#4b3a57')}"></div>
          <div class="who"><span class="pn">${esc(p.name)}</span><span class="pl">LV ${p.level}</span><span class="persona">${CW.BOT_PERSONALITIES[p.personality].label}</span></div>
          <div class="slots">${SLOTS.map((s) => this.slotShell(p.id, s)).join('')}</div>
          <div class="status"></div>
        </div>`).join('')}</div>
      <div class="crowd"><canvas width="1080" height="408"></canvas><div class="feed"></div></div>
      <div class="actionbar"></div>
      <div class="banner-layer"></div>`;
    this.bannerHost = $('.banner-layer', this.root);
    this.canvas = $('.crowd canvas', this.root);
    this.ctx = this.canvas.getContext('2d');
    for (const p of L.players) {
      this.disp[p.id] = {};
      for (const s of SLOTS) this.disp[p.id][s] = { uid: null, rarity: null, cracks: 0, start: 0, end: 0, spinning: false, next: 0, teased: false, hold: false };
      this.actors[p.id] = this.makeActor(p);
    }
    this.root.onclick = (e) => this.onClick(e);
    this.renderPot(true);
  };

  LobbyUI.slotShell = (pid, s) => `<div class="slot empty-slot" data-pid="${pid}" data-slot="${s}"><span class="slot-lbl">${UI.slotLabel[s]}</span><div class="art"><img alt="" style="visibility:hidden"></div><div class="txt"><span class="rtag"></span><span class="nm"><span class="empty">?</span></span><span class="stat"></span></div><span class="pips"></span></div>`;
  LobbyUI.slotEl = function (pid, slot) { return this.root.querySelector(`.slot[data-pid="${pid}"][data-slot="${slot}"]`); };
  LobbyUI.cardEl = function (pid) { return this.root.querySelector('#card-' + pid); };

  LobbyUI.setSlotFinal = function (el, item) {
    const cr = item.cracks ? ` crack-${Math.min(3, item.cracks)}` : '';
    const keep = ['tg-ok', 'tg-no'].filter((c) => el.classList.contains(c));
    el.className = `slot r-${item.rarity}${cr} ${keep.join(' ')}`;
    const img = el.querySelector('img');
    img.src = UI.artFor(item, 72); img.style.visibility = 'visible';
    el.querySelector('.rtag').textContent = CW.RARITY[item.rarity].name + (item.reforgedFrom ? ' · REFORGED' : '');
    el.querySelector('.nm').textContent = item.slot === 'hero' ? `${CW.CLASSES[item.classId].name}` : item.name;
    el.querySelector('.stat').textContent = CW.itemStatLines(item)[0] || '';
    el.querySelector('.pips').innerHTML = '<b></b>'.repeat(CW.RARITY[item.rarity].pips);
    el.title = `${CW.itemLabel(item)}${item.slot === 'hero' ? ' — ' + item.name : ''}\n${CW.itemStatLines(item).join('\n')}`;
    // hero slot on your card shows the variant name (Chaos Lord etc.)
    if (item.slot === 'hero') {
      el.querySelector('.nm').textContent = item.name;
      if (el.closest('.you')) el.querySelector('.rtag').textContent = `${CW.RARITY[item.rarity].name} · ${CW.CLASSES[item.classId].name}`;
    }
  };

  // ------------------------------------------------------------ crowd actors
  LobbyUI.makeActor = function (p) {
    const i = p.idx;
    return { pid: p.id, x: 270 + (Math.random() - 0.5) * 20, y: 112, tx: 60 + ((i * 61) % 420), ty: 148 + (i % 3) * 18, face: 1, emote: null, emoteStart: 0, emoteUntil: 0, look: 0, lookAt: null, bubble: null, pause: 1 + Math.random() * 2, seed: i * 1.7, visible: p.isHuman, human: p.isHuman };
  };

  // ------------------------------------------------------------ events
  LobbyUI.handle = function (ev) {
    const L = this.lobby;
    const p = ev.pid ? L.get(ev.pid) : null;
    const human = p && p.isHuman;
    switch (ev.type) {
      case 'join': {
        const c = this.cardEl(ev.pid); if (c) c.classList.remove('joining');
        this.actors[ev.pid].visible = true;
        CW.Sfx.play('pop');
        break;
      }
      case 'phase':
        if (ev.phase === 'rolling') {
          UI.slam(this.root, `ROLL!<small>${L.mode.grief ? 'GRIEF RAID' : 'RNG RAID'} · ${L.biome.name}</small>`, '', 1600);
          if (this._tutorial) this.calloutStep(0);
        }
        if (ev.phase === 'chaos') {
          this.clearCallouts();
          UI.slam(this.root, `CHAOS PHASE<small>REROLL · SHUFFLE · STEAL${L.mode.grief ? ' · GRIEF' : ''} · BOOST</small>`, 'gold', 2000);
          CW.Sfx.play('chaosRaid');
          UI.quake();
          if (this._tutorial) this.chaosCallouts();
        }
        if (ev.phase === 'launch') {
          this.cancelTarget();
          if (UI.modalOpen && !this._humanSteal) UI.closeModal();
          this.clearCallouts();
          this.countdownEl = UI.el(`<div class="countdown"><div><div class="cd-t">ENTERING</div><div class="cd-b">${L.biome.name}</div><div class="cd-n">3</div><div class="cd-t">RAID POT ${CW.potLabel(L.potX100)} · ${esc(CW.raidMods(L.potX100).label)}</div></div></div>`);
          this.root.appendChild(this.countdownEl);
        }
        this._abSig = '';
        break;
      case 'spin': {
        const d = this.disp[ev.pid][ev.slot];
        Object.assign(d, { start: ev.t + ev.delay, end: ev.t + ev.delay + ev.dur, fakeout: ev.fakeout, cause: ev.cause, item: ev.item, teased: false, next: 0, hold: false });
        if (human && ev.cause === 'pull') { this.clearCallouts(); CW.Sfx.play('click'); }
        break;
      }
      case 'reveal': this.onReveal(ev, p); break;
      case 'bigPull':
        if (!human) {
          UI.banner(this.bannerHost, { top: `${esc(p.name)} PULLED`, main: `${CW.RARITY[ev.item.rarity].name} ${esc(ev.item.slot === 'hero' ? ev.item.name : ev.item.name)}`.toUpperCase(), color: CW.RARITY[ev.item.rarity].color, ms: 1700, priority: true });
        } else {
          UI.banner(this.bannerHost, { top: 'YOU PULLED', main: `${CW.RARITY[ev.item.rarity].name} ${esc(ev.item.name)}`.toUpperCase(), sub: 'THE WHOLE LOBBY SAW THAT', color: CW.RARITY[ev.item.rarity].color, ms: 2000, priority: true });
        }
        break;
      case 'autoPull': UI.toast('TOO SLOW — AUTO-PULLED'); break;
      case 'reroll': {
        const el = this.slotEl(ev.pid, ev.slot);
        UI.burst(el, ev.old.rarity, 10, 50);
        UI.restartAnim(el, 'cursed-now');
        if (human) CW.Sfx.play('stealTry');
        this.feedSys(`${p.name} rerolled ${CW.itemLabel(ev.old)}`);
        break;
      }
      case 'reforge': if (human) UI.toast(`WEAPON REFORGED → ${ev.item.name.toUpperCase()}`, true); break;
      case 'shuffle':
        this.feedSys(`${p.name} SHUFFLED EVERYTHING`);
        UI.banner(this.bannerHost, { top: esc(p.name), main: 'SHUFFLED EVERYTHING', sub: 'ALL IN', color: '#c45cff', ms: 1300, priority: human });
        for (const s of SLOTS) { const el = this.slotEl(ev.pid, s); UI.burst(el, ev.old[s].rarity, 8, 40); }
        CW.Sfx.play('epic');
        break;
      case 'stealStart': this.onStealStart(ev); break;
      case 'stealResult': this.onStealResult(ev); break;
      case 'griefStart': {
        const a = this.cardEl(ev.aid).querySelector('.ava'), t = this.slotEl(ev.tid, ev.slot);
        UI.beam(a, t);
        t.classList.add('busy');
        CW.Sfx.play('curse');
        if (L.get(ev.tid).isHuman) UI.banner(this.bannerHost, { top: `${esc(L.get(ev.aid).name)} IS CURSING`, main: `YOUR ${esc(ev.item.slot === 'hero' ? 'HERO' : ev.item.name).toUpperCase()}`, color: '#ff5a7a', ms: 1000, priority: true });
        break;
      }
      case 'grief': this.onGrief(ev); break;
      case 'boost': this.onBoost(ev, p); break;
      case 'chaosTax': {
        const m = $('.pot-label .mult', this.root);
        UI.restartAnim(m, 'bump');
        this.feedSys(`CHAOS TAX ${CW.potLabel(ev.from)} → ${CW.potLabel(ev.to)} (${ev.reason})`);
        break;
      }
      case 'potTier': this.onPotTier(ev); break;
      case 'chat': this.say(ev.pid, ev.text); break;
      case 'emote': {
        const a = this.actors[ev.pid];
        if (!a) break;
        if (ev.emote === 'look') { a.lookAt = ev.at; a.lookUntil = performance.now() + 1500; }
        else { a.emote = ev.emote; a.emoteStart = performance.now(); a.emoteUntil = a.emoteStart + 1700; if (ev.at) a.lookAt = ev.at; a.lookUntil = a.emoteUntil; }
        break;
      }
      case 'denied':
        if (human) { UI.toast(ev.reason); CW.Sfx.play('deny'); }
        break;
      case 'launchNow':
        if (this.countdownEl) this.countdownEl.remove();
        if (this.opts.onLaunch) this.opts.onLaunch();
        break;
    }
  };

  LobbyUI.onReveal = function (ev, p) {
    const L = this.lobby;
    const d = this.disp[ev.pid][ev.slot];
    const el = this.slotEl(ev.pid, ev.slot);
    const item = p.loadout[ev.slot];
    if (!item) return;
    d.spinning = false;
    d.uid = item.uid; d.rarity = item.rarity; d.cracks = item.cracks;
    this.setSlotFinal(el, item);
    const r = CW.RARITY[item.rarity];
    UI.restartAnim(el, 'rv-' + item.rarity);
    const human = p.isHuman;
    if (human || r.tier >= 2) CW.Sfx.play(r.sfx);
    else CW.Sfx.play('reveal', { gap: 0.1 });
    if (r.tier >= 1) UI.burst(el, item.rarity, 6 + r.tier * 5, 30 + r.tier * 18);
    if (r.tier >= 3) {
      UI.rays(el, r.tier === 4);
      const card = this.cardEl(ev.pid);
      UI.restartAnim(card, 'flash-gold');
      UI.flash(r.tier === 4 ? 'rgba(255,47,160,0.5)' : 'rgba(255,191,26,0.45)');
      if (r.tier === 4) UI.quake();
    }
    if (human && ev.cause === 'pull') {
      if (r.tier === 0 && ev.slot === 'gear') UI.slam(this.root, 'Welp.', 'red', 1300);
      else if (r.tier === 0 && Math.random() < 0.5) UI.toast(['UNLUCKY.', 'COMMON. COOL.', 'IT HAPPENS.'][Math.floor(Math.random() * 3)]);
      if (this._tutorial && p.pullsDone < 3) setTimeout(() => this.lobby.canPull(p) && this.calloutStep(p.pullsDone), 300);
    }
    if (ev.cause !== 'pull' && human) {
      const old = ev.cause === 'reroll' ? (L.log.slice().reverse().find((e) => e.type === 'reroll' && e.pid === p.id && e.slot === ev.slot) || {}).old : null;
      if (old) {
        const delta = CW.tierOf(item.rarity) - CW.tierOf(old.rarity);
        UI.toast(delta > 0 ? 'UPGRADE!' : delta < 0 ? 'IT GOT WORSE.' : 'SIDEWAYS.', delta > 0);
      }
    }
  };

  LobbyUI.onStealStart = function (ev) {
    const L = this.lobby;
    const a = L.get(ev.aid), t = L.get(ev.tid);
    const tEl = this.slotEl(ev.tid, ev.slot), aEl = this.slotEl(ev.aid, ev.slot);
    tEl.classList.add('busy'); aEl.classList.add('busy');
    this.disp[ev.aid][ev.slot].hold = this.disp[ev.tid][ev.slot].hold = true;
    if (a.isHuman) this.stealDial(ev);
    else {
      CW.Sfx.play('stealTry', { gap: 0.2 });
      if (t.isHuman) UI.banner(this.bannerHost, { top: `${esc(a.name)} IS STEALING`, main: `YOUR ${esc(ev.item.name).toUpperCase()}`, sub: `${Math.round(ev.chance * 100)}% CHANCE…`, color: '#ff3b3b', ms: ev.dur * 1000 * (CW.App.fast ? 2 : 0.9), priority: true });
      else if (CW.tierOf(ev.item.rarity) >= 1) this.feedSys(`${a.name} is trying to steal ${t.name}'s ${ev.item.name} (${Math.round(ev.chance * 100)}%)`);
    }
  };

  LobbyUI.onStealResult = function (ev) {
    const L = this.lobby;
    const a = L.get(ev.aid), t = L.get(ev.tid);
    const tEl = this.slotEl(ev.tid, ev.slot), aEl = this.slotEl(ev.aid, ev.slot);
    tEl.classList.remove('busy'); aEl.classList.remove('busy');
    const release = () => { this.disp[ev.aid][ev.slot].hold = this.disp[ev.tid][ev.slot].hold = false; };
    const finishHuman = () => { if (this._humanSteal && this._humanSteal.ev === ev.t) { this._humanSteal = null; setTimeout(() => UI.closeModal(), CW.App.fast ? 250 : 900); } };
    if (ev.success) {
      const delay = a.isHuman ? (CW.App.fast ? 300 : 1000) : 0;
      setTimeout(() => {
        Promise.all([UI.fly(tEl, aEl, ev.original, { chain: true }), UI.fly(aEl, tEl, ev.gave, { delay: 120 })]).then(() => {
          release();
          UI.restartAnim(aEl, 'rv-' + ev.item.rarity);
          UI.burst(aEl, ev.item.rarity, 14, 60);
        });
      }, delay);
      if (a.isHuman || t.isHuman) CW.Sfx.play('stealWin');
      else CW.Sfx.play('coin');
      UI.banner(this.bannerHost, { top: `${esc(a.name)} STOLE`, main: `${esc(t.name)}'S ${esc(ev.original.name)}`.toUpperCase(), sub: `${CW.RARITY[ev.original.rarity].name} · ${Math.round(ev.chance * 100)}% ODDS`, color: a.isHuman ? '#c6ff2e' : t.isHuman ? '#ff3b3b' : CW.RARITY[ev.original.rarity].color, ms: 1500, priority: a.isHuman || t.isHuman });
      if (t.isHuman) { UI.restartAnim(this.cardEl(t.id), 'flash-red'); UI.quake(); }
      this.feedSys(`${a.name} stole ${t.name}'s ${ev.original.name}`);
    } else {
      release();
      if (a.isHuman || t.isHuman) CW.Sfx.play(a.isHuman ? 'stealFail' : 'stealWin');

  // ------------------------------------------------------------ steal dial (human attempts)
  LobbyUI.stealDial = function (ev) {
    const L = this.lobby;
    const t = L.get(ev.tid);
    const ch = ev.chance;
    const R = 140, cx = 160, cy = 160;
    const pt = (deg) => [cx + R * Math.cos((deg * Math.PI) / 180), cy - R * Math.sin((deg * Math.PI) / 180)];
    const winEnd = 180 - ch * 180;
    const [x1, y1] = pt(180), [x2, y2] = pt(winEnd);
    const large = 0; // span is ch*180° ≤ 180°
    UI.openModal(`
      <h2>STEALING…</h2>
      <div class="sub">${esc(t.name)}'S ${UI.itemTitle(ev.item)}</div>
      <div class="dial"><svg viewBox="0 0 320 170">
        <path d="M ${pt(180)[0]} ${pt(180)[1]} A ${R} ${R} 0 0 1 ${pt(0)[0]} ${pt(0)[1]}" fill="none" stroke="#140b17" stroke-width="34"/>
        <path d="M ${pt(180)[0]} ${pt(180)[1]} A ${R} ${R} 0 0 1 ${pt(0)[0]} ${pt(0)[1]}" fill="none" stroke="#7a1626" stroke-width="26"/>
        <path d="M ${x1} ${y1} A ${R} ${R} 0 ${large} 1 ${x2} ${y2}" fill="none" stroke="#19c26b" stroke-width="26"/>
        <text x="${pt(180 - ch * 90)[0]}" y="${pt(180 - ch * 90)[1] + 5}" text-anchor="middle" font-family="CW Display" font-size="13" fill="#fff" stroke="#140b17" stroke-width="3" paint-order="stroke">${Math.round(ch * 100)}%</text>
        <g class="needle"><polygon points="${cx - 6},${cy} ${cx + 6},${cy} ${cx},${cy - R - 10}" fill="#f1e4c6" stroke="#140b17" stroke-width="3"/></g>
        <circle cx="${cx}" cy="${cy}" r="14" fill="#a259ff" stroke="#140b17" stroke-width="4"/>
      </svg></div>
      <div class="note">SUCCESS ZONE = GREEN. NO TAKE-BACKS.</div>`, 'danger');
    const modal = $('#overlay .modal');
    const needle = modal.querySelector('.needle');
    const final = 180 - ev.roll * 180;
    this._humanSteal = { ev: ev.t };
    CW.Sfx.play('stealTry');
    let lastSide = null;
    const step = () => {
      if (!UI.modalOpen || !needle.isConnected) return;
      const p = Math.min(1, (L.time - ev.t) / ev.dur);
      const wob = (1 - p) * (1 - p);
      let ang = final + wob * 160 * Math.sin(p * Math.PI * 7);
      ang = Math.max(2, Math.min(178, ang));
      needle.setAttribute('transform', `rotate(${90 - ang} ${cx} ${cy})`);
      const side = ang > winEnd;
      if (lastSide !== null && side !== lastSide) CW.Sfx.play('dialTick');
      lastSide = side;
      if (p < 1) requestAnimationFrame(step);
      else {
        const win = ev.success;
        modal.insertAdjacentHTML('beforeend', `<div class="stamp ${win ? 'win' : 'lose'}">${win ? 'SUCCESS' : 'BUSTED'}</div>`);
        if (win) UI.flash('rgba(198,255,46,0.35)'); else UI.quake();
      }
    };
    requestAnimationFrame(step);
  };

  // ------------------------------------------------------------ actions (human)

  LobbyUI.doAct = function (a, btn) {
    const L = this.lobby, h = L.human;
    switch (a) {
      case 'pull': if (!L.humanPull()) { if (btn) UI.restartAnim(btn, 'shake'); } break;
      case 'boost': {
        const r = L.boost(h);
        if (!r.ok && btn) UI.restartAnim(btn, 'shake');
        if (r.ok && this._tutorial && this._calloutStep >= 0) this.clearCallouts();
        break;
      }
      case 'reroll': case 'steal': case 'grief':
        if (L.phase !== 'chaos') return;
        this.target = this.target === a ? null : a;
        CW.Sfx.play('click');
        this._abSig = ''; this._tgSig = '';

      case 'shuffle': this.confirmShuffle(); break;

  LobbyUI.onSlotTap = function (pid, slot) {

    if (this.target === 'steal') return this.confirmSteal(t, slot);
    if (this.target === 'grief') return this.confirmGrief(t, slot);

      <div class="row"><button class="btn dark" data-m="no">CANCEL</button><button class="btn" data-m="yes">TRY IT</button></div>`, 'danger');

      <div class="kv"><span>COST</span><b>${chk.costLabel}</b></div>

      <div class="note">THEY GET ${CW.GRIEF_RULES.immunitySec}s IMMUNITY AFTER. EVERYONE SEES IT WAS YOU.</div>
      <div class="row"><button class="btn dark" data-m="no">CANCEL</button><button class="btn red" data-m="yes">CURSE IT</button></div>`, 'grief');

  LobbyUI.bindConfirm = function (yes, keepOpen) {

      if (b.dataset.m === 'yes') { if (b.classList.contains('off')) { UI.restartAnim(b, 'shake'); CW.Sfx.play('deny'); return; } this._confirmYes(); }
    };

  LobbyUI.key = function (e) {
    const L = this.lobby;
    if (!L) return;
    const k = e.key.toLowerCase();
    if (UI.modalOpen) {
      if (k === 'escape' && !this._humanSteal) UI.closeModal();
      if ((k === 'enter' || k === ' ') && this._confirmYes && !this._humanSteal) { const y = $('#overlay [data-m="yes"]'); if (y && !y.classList.contains('off')) this._confirmYes(); }
      return;
    }
    if ((k === ' ' || k === 'enter') && L.phase === 'rolling') { e.preventDefault(); this.doAct('pull', $('.actionbar .pull', this.root)); }
    if (L.phase === 'chaos' || L.phase === 'rolling') if (k === 'b') this.doAct('boost', $('[data-act="boost"]', this.root));
    if (L.phase !== 'chaos') return;
    if (k === '1' || k === '2' || k === '3') this.onSlotTap(L.human.id, SLOTS[+k - 1]);
    if (k === 'r') this.doAct('reroll');
    if (k === 's') this.doAct('steal');
    if (k === 'g' && L.mode.grief) this.doAct('grief');
    if (k === 'x') this.doAct('shuffle');
    if (k === 'escape') this.cancelTarget();
  };

  LobbyUI.clearCallouts = function () { clearTimeout(this._coT); if (!this.root) return; for (const c of $$(".callout", this.root)) c.remove(); };
  LobbyUI.callout = function (html, style, ms = 0) {
    const c = UI.el(`<div class="callout">${html}</div>`);
    Object.assign(c.style, style);
    this.root.appendChild(c);
    if (ms) setTimeout(() => c.remove(), ms);
    return c;
  };
  LobbyUI.calloutStep = function (n) {
    this.clearCallouts();
    this._calloutStep = n;
    const txt = ['ROLL YOUR HERO', 'NOW ROLL A WEAPON', 'LAST ONE — GEAR'][n];
    if (!txt) return;
    this.callout(`<span class="n">${n + 1}</span>${txt}`, { left: '50%', bottom: '92px', transform: 'translateX(-50%)' });
  };
  LobbyUI.chaosCallouts = function () {
    const k = CW.App.fast ? 0.4 : 1;
    const seq = [
      ['Bad roll? Reroll it.<small>Great roll next door? Steal it.</small>', { left: '24px', top: '296px' }],
      ...(this.lobby.mode.grief ? [["Can't take it? Ruin it.<small>Tap their item → GRIEF</small>", { right: '20px', top: '420px' }]] : []),
      ['More danger. More loot.<small>Boost the raid pot ↑</small>', { right: '14px', top: '138px' }],
    ];
    let i = 0;
    const next = () => {
      this.clearCallouts();
      if (i >= seq.length || this.lobby.phase !== 'chaos') return;
      const [h, st] = seq[i++];
      const c = this.callout(h, st);
      if (st.top === '138px') c.style.setProperty('--x', '0');
      this._coT = setTimeout(next, 3200 * k);
    };
    this._coT = setTimeout(next, 1700 * k);
