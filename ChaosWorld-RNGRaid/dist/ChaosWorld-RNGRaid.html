  <style>/* css/style.css */
/* ChaosWorld RNG Raid — comic dungeon UI.
   Design space: 540 x 960 (1080x1920 @0.5), scaled to fit. Thick ink, hard shadows, no glass. */
:root {
  --ink: #140b17;
  --stone: #241b29;
  --stone2: #33283a;
  --stone3: #46384f;
  --paper: #f1e4c6;
  --purple: #7b2cff;
  --purple2: #a259ff;
  --lime: #c6ff2e;
  --gold: #ffbf1a;
  --red: #ff3b3b;
  --blue: #38a6ff;
  --pink: #ff2fa0;
  --c-common: #b8ae9c;
  --c-rare: #38a6ff;
  --c-epic: #b44dff;
  --c-legendary: #ffbf1a;
  --c-mythic: #ff2fa0;
  --grain: none;
  --sh: 4px 4px 0 var(--ink);
  --font-d: 'CW Display', Impact, 'Arial Black', sans-serif;
  --font-b: 'CW Bang', Impact, 'Arial Narrow', sans-serif;
  --outline: -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink), 2px 2px 0 var(--ink), 0 3px 0 var(--ink);
  --outline-s: -1px -1px 0 var(--ink), 1px -1px 0 var(--ink), -1px 1px 0 var(--ink), 1px 1px 0 var(--ink);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #0c070e; overflow: hidden; touch-action: manipulation; }
body { font-family: var(--font-b); color: var(--paper); user-select: none; -webkit-user-select: none; letter-spacing: 0.4px; }
button { font-family: var(--font-d); cursor: pointer; color: inherit; }
#viewport { position: fixed; inset: 0; overflow: hidden; display: flex; align-items: center; justify-content: center;
  background: radial-gradient(circle at 50% 40%, #241330 0%, #0c070e 70%); }
#stage { position: relative; width: 540px; height: 960px; flex: none; overflow: hidden; overflow: clip; transform-origin: 50% 50%;
  background: var(--stone); box-shadow: 0 0 0 4px var(--ink), 0 0 80px rgba(123, 44, 255, 0.25); }
.screen { position: absolute; inset: 0; display: none; }
#stage[data-screen='menu'] #scr-menu, #stage[data-screen='lobby'] #scr-lobby,
#stage[data-screen='battle'] #scr-battle, #stage[data-screen='results'] #scr-results { display: block; }
.hidden { display: none !important; }

/* ---------------------------------------------------------- shared bits */
.ol { text-shadow: var(--outline); }
.ol-s { text-shadow: var(--outline-s); }
.btn { position: relative; border: 3px solid var(--ink); border-radius: 10px; background: var(--lime); color: var(--ink);
  font-size: 22px; padding: 8px 14px 10px; box-shadow: inset 0 -6px 0 rgba(0, 0, 0, 0.25), var(--sh); min-height: 52px;
  transition: transform 0.06s; text-transform: uppercase; line-height: 1; }
.btn:active, .btn.pressed { transform: translate(3px, 3px); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.25), 1px 1px 0 var(--ink); }
.btn small { display: block; font-family: var(--font-b); font-size: 13px; letter-spacing: 0.5px; margin-top: 3px; opacity: 0.85; }
.btn.purple { background: var(--purple2); color: #fff; text-shadow: var(--outline-s); }
.btn.red { background: var(--red); color: #fff; text-shadow: var(--outline-s); }
.btn.gold { background: var(--gold); }
.btn.dark { background: var(--stone3); color: var(--paper); text-shadow: var(--outline-s); }
.btn.blue { background: var(--blue); color: #fff; text-shadow: var(--outline-s); }
.btn[disabled], .btn.off { filter: grayscale(0.85) brightness(0.7); }
.btn.active { outline: 4px solid #fff; outline-offset: -8px; animation: pulseBtn 0.8s infinite alternate; }
@keyframes pulseBtn { to { filter: brightness(1.2); } }
.btn.shake, .shake { animation: shakeX 0.35s; }
@keyframes shakeX { 0%,100% { translate: 0; } 20% { translate: -6px; } 40% { translate: 6px; } 60% { translate: -4px; } 80% { translate: 3px; } }

.chip { display: inline-flex; align-items: center; gap: 4px; background: var(--ink); border-radius: 999px; padding: 2px 8px 2px 3px;
  font-family: var(--font-d); font-size: 14px; line-height: 1; height: 24px; border: 2px solid #000; }
.chip i { display: inline-block; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--ink); flex: none; font-style: normal; }
.cur-coin i { background: radial-gradient(circle at 35% 35%, #fff3a3, #ffbf1a 55%, #a86d00); }
.cur-chaos i { background: radial-gradient(circle at 35% 35%, #e3c2ff, #8a2be2 60%, #3b0a6b); border-radius: 4px; transform: rotate(45deg) scale(0.85); }
.cur-jack i { background: radial-gradient(circle at 35% 35%, #c3ffd8, #19c26b 60%, #075b30); }
.cur-grief i { background: radial-gradient(circle at 35% 35%, #ffc2c2, #e01e37 60%, #5c0614); border-radius: 30% 30% 50% 50%; }
.chip.bump { animation: bump 0.4s; }
@keyframes bump { 40% { transform: scale(1.3); } }

/* rarity tokens */
.r-common { --rc: var(--c-common); }
.r-rare { --rc: var(--c-rare); }
.r-epic { --rc: var(--c-epic); }
.r-legendary { --rc: var(--c-legendary); }
.r-mythic { --rc: var(--c-mythic); }
.rtag { font-family: var(--font-b); color: var(--rc); text-shadow: var(--outline-s); letter-spacing: 1px; }
.pips { display: flex; gap: 2px; }
.pips b { width: 7px; height: 7px; border: 1.5px solid var(--ink); background: var(--rc); transform: rotate(45deg); }

/* ---------------------------------------------------------- SLOTS (item tiles) */
.slot { position: relative; display: flex; align-items: center; gap: 6px; border: 3px solid var(--ink); border-radius: 8px;
  background: #1a131e; overflow: visible; box-shadow: 3px 3px 0 var(--ink); cursor: pointer; }
.slot .art { position: relative; flex: none; border-radius: 5px; background: #2a2130; display: grid; place-items: center; overflow: hidden; }
.slot .art img { width: 100%; height: 100%; display: block; object-fit: contain; }
.slot .txt { min-width: 0; line-height: 1.02; }
.slot .nm { color: var(--paper); text-shadow: var(--outline-s); display: block; overflow: hidden; }
.slot .empty { font-family: var(--font-d); color: #6d5f74; font-size: 20px; }
.slot.empty-slot { background: repeating-linear-gradient(-45deg, #1a131e 0 8px, #221a27 8px 16px); }
/* frames — shape language per rarity, not just colour */
.slot.r-common { background: #29222c; }
.slot.r-common .art { background: linear-gradient(#4a4150, #2e2733); }
.slot.r-rare { background: #12233a; box-shadow: 3px 3px 0 var(--ink), inset 0 0 0 2px var(--c-rare); }
.slot.r-rare .art { background: radial-gradient(circle, #2f6bb0, #0f2846); }
.slot.r-rare::before, .slot.r-rare::after { content: ''; position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #cfe8ff; border: 1.5px solid var(--ink); top: 3px; left: 3px; box-shadow: 0 0 0 0 transparent; }
.slot.r-rare::after { left: auto; right: 3px; }

/* fly layer (steal transfers, coins) */

.coin-fly { position: absolute; width: 16px; height: 16px; margin: -8px; border-radius: 50%; border: 2px solid var(--ink); background: radial-gradient(circle at 35% 35%, #fff3a3, #ffbf1a 55%, #a86d00); }

/* ---------------------------------------------------------- MODALS */

.chance-bar { position: relative; height: 26px; border: 3px solid var(--ink); border-radius: 6px; background: #4a1420; overflow: hidden; margin-top: 8px; }

/* steal dial */

/* Seeded RNG (mulberry32). All gameplay randomness goes through this so debug/test runs are reproducible. */
(function (root) {
  'use strict';
  const CW = (root.CW = root.CW || {});

  class RNG {
    constructor(seed) {
      this.seed = (seed >>> 0) || 1;
      this.s = this.seed;
    }
    next() {
      let t = (this.s += 0x6d2b79f5);
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }
    range(a, b) { return a + (b - a) * this.next(); }
    int(a, b) { return Math.floor(this.range(a, b + 1)); }
    chance(p) { return this.next() < p; }
    pick(arr) { return arr[Math.floor(this.next() * arr.length)]; }
    weighted(items, weightOf) {
      let total = 0;
      for (const it of items) total += Math.max(0, weightOf(it));
      let r = this.next() * total;
      for (const it of items) {
        r -= Math.max(0, weightOf(it));
        if (r < 0) return it;
      }
      return items[items.length - 1];
    }
    shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(this.next() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }
  }
  CW.RNG = RNG;
  CW.randomSeed = () => (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0;
})(typeof window !== 'undefined' ? window : globalThis);

    const key = kind + '|' + rarity + '|' + size;
    if (iconCache.has(key)) return iconCache.get(key);
    const c = makeCanvas(size, size);
    if (!c) return '';
    const ctx = c.getContext('2d');
    ctx.translate(size / 2, size / 2);
    ctx.scale(size / 72, size / 72);
    Art.drawItem(ctx, kind, rarity, true);
    const url = c.toDataURL();
    iconCache.set(key, url);
    return url;
  };

  // ------------------------------------------------------------ OVERLORD
  // (x,y) = feet. s = scale (1 ≈ 70px tall). pose fields all optional.
  Art.drawOverlord = function (ctx, x, y, s, look, pose = {}) {
    look = look || CW.HUMAN_PROFILE.look;
    const t = pose.t || 0;
    const em = pose.emote || null;
    const ep = pose.emoteT || 0; // 0..1 progress
    const face = pose.face || 1;
    let bob = Math.sin(t * 3 + (pose.seed || 0)) * 1.5;
    let jump = 0, shake = 0, squash = 1, armL = 0.3, armR = 0.3, tint = null;
    if (em === 'cheer') { jump = Math.abs(Math.sin(ep * Math.PI * 3)) * 14; armL = armR = -2.2; }
    if (em === 'shock') { jump = Math.max(0, Math.sin(ep * Math.PI)) * 8; armL = armR = -1.4; }
    if (em === 'angry') { shake = Math.sin(t * 50) * 2; tint = 'rgba(255,40,40,0.35)'; armL = armR = -0.6; }
    if (em === 'laugh') { shake = Math.sin(t * 30) * 1.5; squash = 1 + Math.sin(t * 30) * 0.05; armL = 0.9; armR = -0.4; }
    if (em === 'panic') { shake = Math.sin(t * 60) * 2.5; armL = armR = -2.6 + Math.sin(t * 25) * 0.4; }
    if (em === 'sad') { bob -= 3; squash = 0.92; armL = armR = 0.9; tint = 'rgba(60,90,200,0.22)'; }
    if (em === 'taunt') { armR = -2.4 + Math.sin(t * 16) * 0.4; jump = Math.abs(Math.sin(t * 8)) * 3; }
    if (em === 'sneak') { squash = 0.86; armL = armR = -0.2; }
    if (em === 'cast') { armR = -2.5; }
    if (pose.walk) { bob = Math.abs(Math.sin(t * 10)) * -3; }
    if (pose.lunge) jump += pose.lunge * 10;
    if (pose.dead) { ctx.save(); ctx.globalAlpha = 0.35; }

    ctx.save();
    ctx.translate(x + shake, y);
    ctx.scale(s * face, s);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    // ground shadow
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ell(ctx, 0, 0, 22 - jump * 0.4, 6); ctx.fill();
    ctx.translate(0, -jump + bob * 0.5);
    ctx.scale(1 / squash, squash);
    const body = look.body, belly = look.belly, bodyD = shade(body, -0.35);
    // legs
    const step = pose.walk ? Math.sin(t * 10) * 4 : 0;
    rr(ctx, -13, -12 + step * 0.3, 10, 13, 4); fs(ctx, bodyD, 3);
    rr(ctx, 3, -12 - step * 0.3, 10, 13, 4); fs(ctx, bodyD, 3);
    // back arm
    drawArm(ctx, -19, -30, armL, bodyD, true);
    // gear underlayer (cloak) behind body
    if (pose.gearKind === 'cloak') { ctx.beginPath(); ctx.moveTo(-18, -44); ctx.quadraticCurveTo(-30, -10, -22, -6); ctx.lineTo(22, -6); ctx.quadraticCurveTo(30, -10, 18, -44); fs(ctx, MAT[pose.gearRarity || 'common'].cloth); }
    // body
    ell(ctx, 0, -28, 21, 20); fs(ctx, body, 3.4);
    ell(ctx, 2, -24, 13, 12); ctx.fillStyle = belly; ctx.fill();
    if (pose.gearKind && pose.gearKind !== 'cloak' && pose.gearKind !== 'crown' && pose.gearKind !== 'helm' && pose.gearKind !== 'sandals' && pose.gearKind !== 'boots') drawArmour(ctx, pose.gearKind, pose.gearRarity);
    // head (big)
    ctx.save();
    ctx.translate((pose.look || 0) * 2, 0);
    drawHorns(ctx, look.horns, body, bodyD, pose.hat);
    ell(ctx, 0, -56, 22, 19); fs(ctx, body, 3.4);
    ctx.fillStyle = 'rgba(255,255,255,0.25)'; ell(ctx, -9, -66, 6, 3.5, -0.4); ctx.fill();
    drawFace(ctx, look, em, t, pose.look || 0, pose.hat);
    drawExtra(ctx, look.extra);
    if (pose.hat) drawHat(ctx, pose.hat, pose.heroRarity);
    else if (pose.gearKind === 'crown') { ctx.save(); ctx.translate(0, -78); ctx.scale(0.45, 0.45); GEARART.crown(ctx, MAT[pose.gearRarity || 'legendary']); ctx.restore(); }
    else if (pose.gearKind === 'helm') { ctx.save(); ctx.translate(0, -70); ctx.scale(0.62, 0.5); GEARART.helm(ctx, MAT[pose.gearRarity || 'common']); ctx.restore(); }
    ctx.restore();
    if (tint) { ctx.fillStyle = tint; ell(ctx, 0, -42, 24, 40); ctx.fill(); }
    // front arm + weapon
    drawArm(ctx, 19, -30, armR, body, false, pose.weaponKind, pose.weaponRarity);
    ctx.restore();
    if (pose.dead) ctx.restore();

    // emote glyphs (not mirrored)
    if (em && !pose.dead) drawEmoteGlyph(ctx, x, y - (78 + jump) * s, s, em, t);
  };

  function drawArm(ctx, ax, ay, ang, col, back, weaponKind, weaponRarity) {
    ctx.save();
    ctx.translate(ax, ay);
    ctx.rotate(ang * (back ? -1 : 1) * 0.6 + (back ? 0.3 : -0.3));
    if (weaponKind && !back) {
      ctx.save(); ctx.translate(4, 14); ctx.rotate(0.5); ctx.scale(0.5, 0.5);
      Art.drawItem(ctx, weaponKind, weaponRarity || 'common');
      ctx.restore();
    }
    rr(ctx, -5, -2, 10, 18, 5); fs(ctx, col, 3);
    ctx.restore();
  }

  function drawHorns(ctx, type, body, bodyD, hat) {
    if (hat === 'bucket' || hat === 'hood' || hat === 'skullhood') return;
    const horn = '#f3e6c8';
    switch (type) {
      case 'curl':
        for (const sx of [-1, 1]) { ctx.beginPath(); ctx.moveTo(sx * 12, -70); ctx.quadraticCurveTo(sx * 34, -84, sx * 30, -62); ctx.quadraticCurveTo(sx * 26, -56, sx * 22, -64); ctx.closePath(); fs(ctx, horn, 3); }
        break;
      case 'spike':
        for (const sx of [-1, 1]) { poly(ctx, [[sx * 8, -70], [sx * 20, -96], [sx * 18, -66]]); fs(ctx, horn, 3); }
        break;
      case 'nub':
        for (const sx of [-1, 1]) { ell(ctx, sx * 13, -73, 5, 6); fs(ctx, horn, 3); }
        break;
      case 'ears':
        for (const sx of [-1, 1]) { poly(ctx, [[sx * 14, -66], [sx * 36, -78], [sx * 20, -54]]); fs(ctx, body, 3); poly(ctx, [[sx * 18, -64], [sx * 30, -73], [sx * 21, -58]]); ctx.fillStyle = '#ff9aa8'; ctx.fill(); }
        break;
      case 'antenna':
        for (const sx of [-1, 1]) { ctx.beginPath(); ctx.moveTo(sx * 7, -72); ctx.quadraticCurveTo(sx * 10, -88, sx * 18, -92); ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke(); ell(ctx, sx * 18, -93, 4.5, 4.5); fs(ctx, '#ffe66d', 2.5); }
        break;
    }
  }

  function drawFace(ctx, look, em, t, lk, hat) {
    const eyesHidden = hat === 'bucket';
    const blink = Math.sin(t * 1.3 + look.body.length) > 0.985;
    if (!eyesHidden) {
      const ey = -59, ex = 8.5;
      const big = em === 'shock' || em === 'panic' ? 1.3 : 1;
      if (look.eyes === 'cool' && em !== 'shock') {
        rr(ctx, -19, ey - 6, 38, 11, 4); ctx.fillStyle = INK; ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fillRect(-15, ey - 4, 6, 2); ctx.fillRect(4, ey - 4, 6, 2);
      } else {
        for (const sx of [-1, 1]) {
          const cx = sx * ex;
          if (blink || em === 'laugh') { ctx.beginPath(); ctx.moveTo(cx - 5, ey); ctx.quadraticCurveTo(cx, ey - 5, cx + 5, ey); ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke(); continue; }
          ell(ctx, cx, ey, 6.5 * big, 7.5 * big); fs(ctx, '#ffffff', 2.6);
          const px = cx + lk * 2.5 + (look.eyes === 'shifty' ? Math.sin(t * 2) * 2 : 0);
          ctx.fillStyle = INK; ell(ctx, px, ey + 1, 3 * (em === 'shock' ? 0.7 : 1), 3.6 * (em === 'shock' ? 0.7 : 1)); ctx.fill();
          ctx.fillStyle = '#fff'; ell(ctx, px - 1, ey - 0.5, 1, 1); ctx.fill();
          if (look.eyes === 'shifty') { ctx.fillStyle = look.body; ctx.fillRect(cx - 7, ey - 9, 14, 6); ctx.beginPath(); ctx.moveTo(cx - 7, ey - 3); ctx.lineTo(cx + 7, ey - 3); ctx.lineWidth = 2.5; ctx.strokeStyle = INK; ctx.stroke(); }
        }
        // brows
        ctx.lineWidth = 3.2; ctx.strokeStyle = INK;
        const angry = look.eyes === 'angry' || em === 'angry';
        const worried = look.eyes === 'worried' || em === 'sad' || em === 'panic';
        for (const sx of [-1, 1]) {
          ctx.beginPath();
          if (angry) { ctx.moveTo(sx * 15, ey - 12); ctx.lineTo(sx * 3, ey - 7); }
          else if (worried) { ctx.moveTo(sx * 15, ey - 8); ctx.lineTo(sx * 4, ey - 13); }
          else { ctx.moveTo(sx * 14, ey - 11); ctx.lineTo(sx * 4, ey - 12); }
          ctx.stroke();
        }
      }
    }
    // mouth
    const my = -46;
    ctx.lineWidth = 3; ctx.strokeStyle = INK;
    const mouth = em === 'laugh' || em === 'cheer' || em === 'shock' || em === 'panic' ? 'open' : em === 'sad' ? 'frown' : look.mouth;
    switch (mouth) {
      case 'grin': case 'teeth':
        ctx.beginPath(); ctx.moveTo(-11, my - 2); ctx.quadraticCurveTo(0, my + 9, 11, my - 2); ctx.closePath(); fs(ctx, '#fff', 2.6);
        ctx.beginPath(); for (let i = -6; i <= 6; i += 4) { ctx.moveTo(i, my - 1); ctx.lineTo(i, my + 3); } ctx.lineWidth = 1.6; ctx.stroke();
        break;
      case 'fangs':
        ctx.beginPath(); ctx.moveTo(-10, my - 1); ctx.quadraticCurveTo(0, my + 5, 10, my - 1); ctx.stroke();
        poly(ctx, [[-7, my], [-5, my + 6], [-3, my + 1]]); fs(ctx, '#fff', 1.8); poly(ctx, [[3, my + 1], [5, my + 6], [7, my]]); fs(ctx, '#fff', 1.8);
        break;
      case 'smirk':
        ctx.beginPath(); ctx.moveTo(-8, my); ctx.quadraticCurveTo(2, my + 4, 10, my - 4); ctx.stroke();
        break;
      case 'wobble':
        ctx.beginPath(); ctx.moveTo(-8, my); for (let i = -8; i <= 8; i += 4) ctx.lineTo(i + 2, my + (i % 8 === 0 ? 2 : -2)); ctx.stroke();
        break;
      case 'frown':
        ctx.beginPath(); ctx.moveTo(-8, my + 3); ctx.quadraticCurveTo(0, my - 4, 8, my + 3); ctx.stroke();
        break;
      default: // open
        ell(ctx, 0, my + 1, 8, 7); fs(ctx, '#5a0f1f', 2.6); ell(ctx, 0, my + 4, 4.5, 2.5); ctx.fillStyle = '#ff6b81'; ctx.fill();
    }
  }

  function drawExtra(ctx, extra) {
    switch (extra) {
      case 'gold': ctx.beginPath(); ctx.arc(0, -40, 16, 0.2 * Math.PI, 0.8 * Math.PI); ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.stroke(); ctx.lineWidth = 3; ctx.strokeStyle = '#ffd23f'; ctx.stroke(); ell(ctx, 0, -24, 4.5, 4.5); fs(ctx, '#ffd23f', 2); break;
      case 'bandage': ctx.save(); ctx.translate(12, -66); ctx.rotate(0.6); rr(ctx, -8, -3, 16, 6, 2); fs(ctx, '#f6d7b0', 2); ctx.restore(); break;
      case 'whiskers': ctx.lineWidth = 1.6; ctx.strokeStyle = INK; ctx.beginPath(); for (const sx of [-1, 1]) for (const dy of [-2, 2]) { ctx.moveTo(sx * 12, -50 + dy); ctx.lineTo(sx * 26, -51 + dy * 2.5); } ctx.stroke(); break;
      case 'curlers': for (const [cx, cy] of [[-12, -74], [0, -77], [12, -74]]) { rr(ctx, cx - 4, cy - 3, 8, 7, 3); fs(ctx, '#7fd1ff', 2); } break;
      case 'nosering': ctx.beginPath(); ctx.arc(0, -50, 3.5, 0.1, Math.PI - 0.1); ctx.lineWidth = 2; ctx.strokeStyle = '#ffd23f'; ctx.stroke(); break;
    }
  }

  // Class hats — read the class from silhouette alone.
  function drawHat(ctx, hat, rarity) {
    const m = MAT[rarity || 'common'];
    switch (hat) {
      case 'hornhelm':
        ctx.beginPath(); ctx.moveTo(-23, -58); ctx.quadraticCurveTo(-22, -82, 0, -82); ctx.quadraticCurveTo(22, -82, 23, -58); ctx.closePath(); fs(ctx, m.metal);
        for (const sx of [-1, 1]) { ctx.beginPath(); ctx.moveTo(sx * 18, -72); ctx.quadraticCurveTo(sx * 40, -78, sx * 38, -100); ctx.quadraticCurveTo(sx * 30, -84, sx * 14, -80); ctx.closePath(); fs(ctx, '#f3e6c8', 3); }
        rr(ctx, -24, -62, 48, 7, 3); fs(ctx, m.metalD, 2.8); break;
      case 'hood':
        ctx.beginPath(); ctx.moveTo(-26, -44); ctx.quadraticCurveTo(-30, -88, 6, -90); ctx.quadraticCurveTo(26, -84, 26, -44); ctx.quadraticCurveTo(18, -70, 0, -72); ctx.quadraticCurveTo(-18, -70, -26, -44); fs(ctx, '#2e8b57');
        ctx.beginPath(); ctx.moveTo(14, -84); ctx.quadraticCurveTo(36, -104, 30, -78); ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke(); poly(ctx, [[18, -86], [36, -108], [28, -80]]); fs(ctx, m.gem === '#7d7468' ? '#d64545' : m.gem, 2.4); break;
      case 'wizard':
        ctx.beginPath(); ctx.moveTo(-28, -66); ctx.quadraticCurveTo(0, -60, 28, -66); ctx.quadraticCurveTo(0, -76, -28, -66); fs(ctx, '#4b2a9a');
        ctx.beginPath(); ctx.moveTo(-16, -68); ctx.quadraticCurveTo(-4, -96, 10, -118); ctx.quadraticCurveTo(12, -96, 16, -68); fs(ctx, '#5b35b8');
        ctx.fillStyle = m.gem; for (const [sx, sy] of [[-4, -80], [6, -92]]) { ctx.beginPath(); ctx.arc(sx, sy, 2.6, 0, Math.PI * 2); ctx.fill(); } break;
      case 'mask':
        rr(ctx, -24, -66, 48, 12, 5); fs(ctx, '#1c2333', 3);
        for (const sx of [-1, 1]) { ell(ctx, sx * 9, -60, 4.5, 3); ctx.fillStyle = '#fff'; ctx.fill(); }
        poly(ctx, [[20, -64], [34, -70], [32, -58]]); fs(ctx, '#1c2333', 2.6); break;
      case 'bucket':
        ctx.beginPath(); ctx.moveTo(-25, -40); ctx.lineTo(-22, -84); ctx.lineTo(22, -84); ctx.lineTo(25, -40); ctx.closePath(); fs(ctx, m.metal, 3.4);
        rr(ctx, -16, -64, 32, 5, 2); ctx.fillStyle = INK; ctx.fill(); ctx.fillRect(-2, -64, 4, 16);
        ctx.strokeStyle = m.metalD; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-24, -46); ctx.lineTo(24, -46); ctx.stroke();
        if (rarity !== 'common') { ctx.beginPath(); ctx.moveTo(0, -84); ctx.quadraticCurveTo(10, -104, 24, -100); ctx.lineWidth = 6; ctx.strokeStyle = INK; ctx.stroke(); ctx.lineWidth = 3; ctx.strokeStyle = m.gem; ctx.stroke(); } break;
      case 'skullhood':
        ctx.beginPath(); ctx.moveTo(-27, -40); ctx.quadraticCurveTo(-32, -92, 0, -90); ctx.quadraticCurveTo(32, -92, 27, -40); ctx.quadraticCurveTo(18, -72, 0, -72); ctx.quadraticCurveTo(-18, -72, -27, -40); fs(ctx, '#1f2a2e');
        ell(ctx, 0, -82, 8, 6.5); fs(ctx, '#efe6cf', 2.4); ctx.fillStyle = m.gem === '#7d7468' ? INK : m.gem; ell(ctx, -3, -82, 1.8, 2); ctx.fill(); ell(ctx, 3, -82, 1.8, 2); ctx.fill(); break;
      case 'mitre':
        ctx.beginPath(); ctx.moveTo(-17, -68); ctx.quadraticCurveTo(-18, -96, 0, -112); ctx.quadraticCurveTo(18, -96, 17, -68); ctx.closePath(); fs(ctx, '#fbf4e1');
        ctx.fillStyle = '#f1c40f'; ctx.fillRect(-3, -108, 6, 38); ctx.fillRect(-10, -96, 20, 5); ctx.strokeStyle = INK; ctx.lineWidth = 1.8; ctx.strokeRect(-3, -108, 6, 38);
        if (rarity && rarity !== 'common') { ctx.beginPath(); ctx.ellipse(0, -118, 14, 4, 0, 0, Math.PI * 2); ctx.lineWidth = 3; ctx.strokeStyle = '#ffe66d'; ctx.stroke(); } break;
      case 'viking':
        ctx.beginPath(); ctx.moveTo(-23, -60); ctx.quadraticCurveTo(-20, -84, 0, -84); ctx.quadraticCurveTo(20, -84, 23, -60); ctx.closePath(); fs(ctx, '#8d8d8d');
        for (const sx of [-1, 1]) { ctx.beginPath(); ctx.moveTo(sx * 20, -70); ctx.quadraticCurveTo(sx * 38, -72, sx * 32, -96); ctx.quadraticCurveTo(sx * 30, -80, sx * 16, -78); ctx.closePath(); fs(ctx, '#f3e6c8', 3); }
        ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 3; for (const sx of [-1, 1]) { ctx.beginPath(); ctx.moveTo(sx * 4, -62); ctx.lineTo(sx * 14, -56); ctx.stroke(); }
        for (const sx of [-1, 1]) { rr(ctx, sx * 24 - 4, -58, 8, 22, 4); fs(ctx, '#e67e22', 2.4); } break;
    }
  }

  function drawArmour(ctx, kind, rarity) {
    const m = MAT[rarity || 'common'];
    if (kind === 'plate') { ctx.beginPath(); ctx.ellipse(0, -30, 19, 15, 0, Math.PI, 0); ctx.lineTo(16, -18); ctx.quadraticCurveTo(0, -12, -16, -18); ctx.closePath(); fs(ctx, m.metal, 2.8); ell(ctx, 0, -32, 3.5, 3.5); fs(ctx, m.gem, 2); }
    else if (kind === 'robe') { poly(ctx, [[-14, -44], [14, -44], [20, -10], [-20, -10]]); fs(ctx, m.cloth, 2.8); ctx.fillStyle = m.metal; ctx.fillRect(-2, -44, 4, 34); }
    else { poly(ctx, [[-16, -42], [16, -42], [18, -14], [-18, -14]]); fs(ctx, m.cloth, 2.8); }
  }

  function drawEmoteGlyph(ctx, x, y, s, em, t) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    ctx.textAlign = 'center';
    ctx.font = '20px "CW Bang", Impact, sans-serif';
    ctx.lineWidth = 4; ctx.strokeStyle = INK;
    const txt = (str, col, dy = 0) => { ctx.strokeText(str, 0, dy); ctx.fillStyle = col; ctx.fillText(str, 0, dy); };
    switch (em) {
      case 'shock': txt('!', '#ffe14d', -2); break;
      case 'angry': for (const sx of [-1, 1]) { ctx.fillStyle = 'rgba(255,255,255,0.8)'; ell(ctx, sx * 14 + Math.sin(t * 9) * 2, -6 - ((t * 30) % 12), 5, 4); ctx.fill(); } txt('#@!', '#ff4040', 0); break;
      case 'laugh': txt('HA', '#fff', Math.sin(t * 20) * 2); break;
      case 'panic': ctx.fillStyle = '#7fd1ff'; for (const sx of [-1, 1]) { ell(ctx, sx * 24, 24 + ((t * 40) % 10), 3, 5); ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 1.5; ctx.stroke(); } break;
      case 'cheer': txt('★', '#ffd23f', -4); break;
      case 'sad': txt('…', '#9fc5ff', 0); break;
      case 'taunt': txt('EZ', '#c6ff2e', 0); break;
      case 'sneak': txt('?', '#c6ff2e', 0); break;
      case 'cast': ctx.fillStyle = '#d6a8ff'; for (let i = 0; i < 3; i++) { ell(ctx, Math.sin(t * 6 + i * 2) * 14, 10 + Math.cos(t * 6 + i * 2) * 6, 2.5, 2.5); ctx.fill(); } break;
    }
    ctx.restore();
  }

  // Bust portrait (head only) for avatars + hero class icons.
  const bustCache = new Map();
  Art.bust = function (look, hat, rarity, size = 72, bg = null) {
    const key = JSON.stringify(look) + '|' + hat + '|' + rarity + '|' + size + '|' + bg;
    if (bustCache.has(key)) return bustCache.get(key);
    const c = makeCanvas(size, size);
    if (!c) return '';
    const ctx = c.getContext('2d');
    if (bg) { ctx.fillStyle = bg; ctx.fillRect(0, 0, size, size); }
    const sc = size / (hat ? 118 : 100);
    Art.drawOverlord(ctx, size / 2, size + (hat ? 18 : 22) * sc * 1.6 + 6 * sc, sc * 1.55, look, { hat, heroRarity: rarity, t: 0 });
    const url = c.toDataURL();
    bustCache.set(key, url);
    return url;
  };
  // A class reads as: generic class-coloured overlord in its hat.
  Art.classLook = function (classId) {
    const c = CW.CLASSES[classId];
    return { body: shade(c.tint, 0.25), belly: shade(c.tint, 0.65), horns: 'nub', eyes: 'big', mouth: classId === 'berserker' || classId === 'brute' ? 'fangs' : 'grin', extra: 'none' };
  };
  // Hero class portraits now come from the archetype characters (chars.js), via ArtPack so real art can replace them.
  Art.heroIcon = function (classId, rarity, size = 72, accent) { return CW.ArtPack ? CW.ArtPack.heroIcon(classId, rarity, size, accent || CW.CLASSES[classId].tint) : Art.bust(Art.classLook(classId), CW.CLASSES[classId].hat, rarity, size); };
  Art.emoteGlyph = (...a) => drawEmoteGlyph(...a);

  // ------------------------------------------------------------ ENEMIES
  Art.drawEnemy = function (ctx, u, t) {
    const s = (u.size || 1) * 0.95;
    const hit = u.anim && u.anim.hit > 0;
    const stunned = u.stunUntil && u.stunUntil > (u._now || 0);
    ctx.save();
    ctx.translate(u.x + (hit ? Math.sin(t * 80) * 3 : 0), u.y);
    ctx.scale(s, s);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.fillStyle = 'rgba(0,0,0,0.4)'; ell(ctx, 0, 0, 30, 8); ctx.fill();
    const bob = Math.sin(t * 4 + u.hx) * 2;
    ctx.translate(0, bob);
    const col = u.color, colD = shade(col, -0.35);
    const lunge = u.anim && u.anim.lunge > 0 ? u.anim.lunge * 30 : 0;
    ctx.translate(0, lunge);
    switch (u.shape) {
      case 'blob':
        ctx.beginPath(); ctx.moveTo(-34, 0); ctx.quadraticCurveTo(-40, -50, -6, -58); ctx.quadraticCurveTo(30, -62, 36, -20); ctx.quadraticCurveTo(40, 0, 34, 0); ctx.closePath(); fs(ctx, col, 3.6);
        ctx.fillStyle = colD; for (const [x, y, r] of [[-18, -18, 5], [14, -36, 4], [22, -10, 3]]) { ell(ctx, x, y, r, r); ctx.fill(); }

/* ArtPack — the ONLY entry point game/UI code uses to draw characters, bosses and item icons.
 * It renders a sprite from CW.ART_MANIFEST when one is provided and loaded, otherwise the procedural placeholder.
 * So swapping in real Chaos World art = editing js/art-manifest.js. Nothing else.

    if (!entry || typeof Image === 'undefined') return null;
    const srcs = typeof entry.src === 'string' ? { idle: entry.src } : Object.fromEntries(['idle', 'attack', 'cast', 'down', 'stun'].filter((k) => entry[k]).map((k) => [k, entry[k]]));

    for (const [state, src] of Object.entries(srcs)) { const img = new Image(); img.src = src; out[state] = img; }

    const m = CW.ART_MANIFEST || { characters: {}, bosses: {}, items: {} };
    for (const [k, v] of Object.entries(m.characters || {})) load('char:' + k, v);
    for (const [k, v] of Object.entries(m.bosses || {})) load('boss:' + k, v);

/* Group boon vote — pure logic, used before the boss (lobby) and once mid-fight (battle).
 * Everybody votes; most votes wins; ties are broken by a visible, seeded tie-break spin.
 */
(function (root) {
  'use strict';
  const CW = (root.CW = root.CW || {});

  // Pick N boon ids. `avoid` = ids that must not appear (e.g. the boon already won);
  // `notSameAs` = a previous option set this one must differ from.
  CW.pickBoonOptions = function (rng, { avoid = [], notSameAs = null, n = CW.BOON_VOTE.choices } = {}) {
    const pool = Object.keys(CW.BOON_OPTIONS).filter((b) => !avoid.includes(b));
    for (let tries = 0; tries < 20; tries++) {
      const pick = rng.shuffle(pool).slice(0, n);
      if (!notSameAs || pick.slice().sort().join() !== notSameAs.slice().sort().join()) return pick;
    }
    return pool.slice(0, n);
  };

  class BoonVote {
    // voters: [{ id, isHuman, personality }]
    constructor({ rng, voters, options, k = 1, label = 'PRE-RAID', forceResult = null }) {
      this.rng = rng;
      this.voters = voters;
      this.options = options;
      this.k = k;
      this.label = label;
      this.forceResult = forceResult;
      this.time = 0;
      this.duration = CW.BOON_VOTE.seconds * k;
      this.votes = {};            // voterId → boonId
      this.events = [];
      this.state = 'open';        // open → tiebreak → done
      this.winner = null;
      this.tied = null;
      const [a, b] = CW.BOON_VOTE.botVoteWindow;
      this.botAt = {};
      for (const v of voters) if (!v.isHuman) this.botAt[v.id] = this.rng.range(a, b) * k;
    }
    emit(e) { e.t = this.time; this.events.push(e); }
    drain() { const e = this.events; this.events = []; return e; }
    remaining() { return Math.max(0, this.duration - this.time); }
    counts() {
      const c = Object.fromEntries(this.options.map((o) => [o, 0]));
      for (const b of Object.values(this.votes)) if (b in c) c[b]++;
      return c;
    }
    vote(voterId, boonId) {
      if (this.state !== 'open' || !this.options.includes(boonId)) return false;
      const changed = this.votes[voterId] !== boonId;
      this.votes[voterId] = boonId;
      if (changed) this.emit({ type: 'voteCast', voter: voterId, boon: boonId });
      return true;
    }
    _botChoice(v) {
      const per = CW.BOT_PERSONALITIES[v.personality] || {};
      const prefs = per.boonPrefs || {};
      const c = this.counts();
      return this.rng.weighted(this.options, (o) => 1 + (prefs[o] || 0) + CW.BOON_VOTE.herd * c[o]);
    }
    update(dt) {
      if (this.state === 'done') return;
      this.time += dt;
      if (this.state === 'open') {
        for (const v of this.voters) {
          if (v.isHuman || this.votes[v.id] || this.time < this.botAt[v.id]) continue;

      for (const v of this.voters) if (!v.isHuman && !this.votes[v.id]) this.vote(v.id, this._botChoice(v));

      const max = Math.max(...Object.values(c));
      const top = this.options.filter((o) => c[o] === max);
      if (top.length === 1) return this._finish(top[0]);
      // deterministic (seeded) tie-break spin
      this.tied = top;
      this.tieWinner = this.rng.pick(top);
      this.state = 'tiebreak';
      this.tieEnd = this.time + CW.BOON_VOTE.tieBreakSec * this.k;

    _finish(boon, forced = false) {

        this._crowdSay(p, 'otherLegend', { t: p.name }, 2);
      } else if (r.tier === 0) {
        if (slot === 'gear') this.status(p, 'WELP.', 3);
        else if (p.pullsDone >= 3 && this.score(p) < 1.5) this.status(p, 'WELP.', 3);
        if (!p.isHuman) {
          if (item.name === 'Sandals') this._crowdSay(p, 'sandals', { t: p.name }, 1, 0.9);
          else if (this.rng.chance(0.3)) this.say(p, 'selfCommon');
          if (this.rng.chance(0.35)) this.emote(p, 'sad');
        } else if (this.rng.chance(0.5)) this._crowdSay(p, item.name === 'Sandals' ? 'sandals' : 'otherCommon', { t: p.name }, 1, 0.6);
      } else if (r.tier === 2) {
        this.emote(p, 'cheer');
        this.status(p, 'EPIC', 2.5);
      } else if (p.pullsDone >= 3 && !p.isHuman && this.time >= p.revealAt.gear) {
        this.status(p, 'READY', 30);
      }
      if (!p.isHuman && p.pullsDone >= 3 && slot === 'gear' && r.tier > 0 && r.tier < 3) this.status(p, 'READY', 30);
    }

    // ------------------------------------------------------------ CHAOS ACTIONS
    inFlight(item) { return !!(item && item._busy); }
    static get LOCKED() { return { ok: false, reason: 'LOCKED IN (PROTECTED)', lockedIn: true }; }

    // PROTECT: ward one Legendary/Mythic item. Costs ALL your coins and ends your lobby manipulation.
    protectCheck(p, slot) {
      if (this.phase !== 'chaos') return { ok: false, reason: 'NOT NOW' };
      if (p.locked) return Lobby.LOCKED;
      const item = p.loadout[slot];
      if (!item || !this.isRevealed(p, slot) || this.inFlight(item)) return { ok: false, reason: 'BUSY' };
      if (!CW.PROTECT.eligible.includes(item.rarity)) return { ok: false, reason: 'LEGENDARY+ ONLY' };
      if (p.wallet.coins < CW.PROTECT.minCoins) return { ok: false, reason: 'NO COINS TO SPEND' };
      return { ok: true, cost: p.wallet.coins, item };
    }
    protect(pid, slot) {
      const p = typeof pid === 'string' ? this.get(pid) : pid;
      const chk = this.protectCheck(p, slot);
      if (!chk.ok) { this.emit({ type: 'denied', pid: p.id, action: 'protect', reason: chk.reason }); return chk; }
      p.wallet.coins = 0;
      p.locked = true;
      p.protectedSlot = slot;
      chk.item.protected = true;
      p.stats.protects++;
      this.emit({ type: 'protect', pid: p.id, slot, item: chk.item, spent: chk.cost });
      this.status(p, 'WARDED', 30);
      this.emote(p, 'cheer');
      if (!p.isHuman) this.say(p, 'protect', {}, true);
      this._crowdReact(p, 'look', 0.5);
      return { ok: true, spent: chk.cost };
    }

    rerollCheck(p, slot) {
      if (this.phase !== 'chaos') return { ok: false, reason: 'NOT NOW' };
      if (p.locked) return Lobby.LOCKED;
      const item = p.loadout[slot];
      if (!item || !this.isRevealed(p, slot) || this.inFlight(item)) return { ok: false, reason: 'BUSY' };
      const cost = this.rerollCost(p);
      if (p.wallet.coins < cost) return { ok: false, reason: 'NEED ' + cost + ' COINS', cost };
      return { ok: true, cost };
    }
    reroll(pid, slot) {
      const p = typeof pid === 'string' ? this.get(pid) : pid;
      const chk = this.rerollCheck(p, slot);
      if (!chk.ok) { this.emit({ type: 'denied', pid: p.id, action: 'reroll', reason: chk.reason }); return chk; }
      p.wallet.coins -= chk.cost;
      p.rerollsUsed++; p.stats.rerolls++;
      const old = p.loadout[slot];
      let item;
      if (slot === 'hero') {
        item = this.makeHero(this.pickClass(), this.rollRarity(p));
        // the weapon follows the new class (same rarity, reforged)
        const w = p.loadout.weapon;
        if (w && w.classId !== item.classId) { p.loadout.weapon = this.reforge(w, item.classId); this.emit({ type: 'reforge', pid: p.id, slot: 'weapon', item: p.loadout.weapon, from: w }); }
      } else item = this._make(p, slot, this.rollRarity(p));
      this._place(p, slot, item, 0.35 * this.k, 'reroll');
      const delta = tierOf(item.rarity) - tierOf(old.rarity);
      this.emit({ type: 'reroll', pid: p.id, slot, old, item, delta, cost: chk.cost });
      if (!p.isHuman) this.say(p, 'reroll');
      this._later(0.35 * this.k + this._reelSec(item.rarity) * 0.75 + 0.05, () => {
        if (delta < 0) { this.emote(p, 'sad'); if (!p.isHuman) this.say(p, 'rerollWorse', {}, true); else this._crowdSay(p, 'otherCommon', { t: p.name }, 1, 0.5); }
      });
      return { ok: true, old, item, delta, cost: chk.cost };
    }

    shuffleCheck(p) {
      if (this.phase !== 'chaos') return { ok: false, reason: 'NOT NOW' };
      if (p.locked) return Lobby.LOCKED;
      if (SLOTS.some((s) => !this.isRevealed(p, s) || this.inFlight(p.loadout[s]))) return { ok: false, reason: 'BUSY' };
      if ((p.wallet[CW.SHUFFLE.token] || 0) < CW.SHUFFLE.amount) return { ok: false, reason: 'NEED A CHAOS TOKEN' };
      return { ok: true };
    }
    shuffle(pid) {
      const p = typeof pid === 'string' ? this.get(pid) : pid;
      const chk = this.shuffleCheck(p);
      if (!chk.ok) { this.emit({ type: 'denied', pid: p.id, action: 'shuffle', reason: chk.reason }); return chk; }
      p.wallet[CW.SHUFFLE.token] -= CW.SHUFFLE.amount;
      p.stats.shuffles++;
      const old = { ...p.loadout };
      const hero = this.makeHero(this.pickClass(), this.rollRarity(p));
      p.loadout.hero = hero; // so weapon pool uses new class
      const weapon = this.makeWeapon(hero.classId, this.rollRarity(p));
      const gear = this.makeGear(this.rollRarity(p));
      p.loadout.hero = old.hero; // _place will set each
      this._place(p, 'hero', hero, 0.3 * this.k, 'shuffle');
      this._place(p, 'weapon', weapon, 0.9 * this.k, 'shuffle');
      this._place(p, 'gear', gear, 1.5 * this.k, 'shuffle');
      const delta = this.scoreOf({ hero, weapon, gear }) - this.scoreOf(old);
      this.emit({ type: 'shuffle', pid: p.id, old, items: { hero, weapon, gear }, delta });
      if (!p.isHuman) this.say(p, 'shuffle', {}, true);
      this._crowdReact(p, 'look');
      return { ok: true, old, items: { hero, weapon, gear }, delta };
    }
    scoreOf(l) { return this.score({ loadout: l }); }

    stealCheck(actor, target, slot) {
      if (this.phase !== 'chaos') return { ok: false, reason: 'NOT NOW' };
      if (!target || actor === target) return { ok: false, reason: 'NO TARGET' };
      if (actor.locked) return Lobby.LOCKED;
      if (!CW.STEAL_RULES.stealableSlots.includes(slot)) return { ok: false, reason: "CAN'T STEAL A HERO" };
      const item = target.loadout[slot];
      if (!item || !this.isRevealed(target, slot) || this.inFlight(item) || this.inFlight(actor.loadout[slot]) || !this.isRevealed(actor, slot)) return { ok: false, reason: 'TOO LATE — MID-ACTION' };
      if (this.mode.unstealable.includes(item.rarity)) return { ok: false, reason: 'BOLTED DOWN', locked: true, chance: 0 };
      if (target.guardUntil > this.time) return { ok: false, reason: 'ON GUARD', chance: CW.STEAL_ODDS[item.rarity] };
      const warded = !!item.protected;
      const chance = CW.STEAL_ODDS[item.rarity] * (warded ? CW.PROTECTION_STEAL_MULTIPLIER : 1);
      const c = CW.STEAL_COST;
      let pay = null;
      if ((actor.wallet[c.token] || 0) >= c.amount) pay = c.token;
      else if (actor.wallet.coins >= c.coinAlt) pay = 'coins';
      if (!pay) return { ok: false, reason: 'NEED JACK TOKEN / ' + c.coinAlt + ' COINS', chance };
      return { ok: true, chance, pay, costLabel: pay === 'coins' ? c.coinAlt + ' COINS' : c.amount + ' JACK TOKEN', item, warded, baseChance: CW.STEAL_ODDS[item.rarity] };
    }
    steal(aid, tid, slot) {
      const a = typeof aid === 'string' ? this.get(aid) : aid;
      const t = typeof tid === 'string' ? this.get(tid) : tid;
      const chk = this.stealCheck(a, t, slot);
      if (!chk.ok) { this.emit({ type: 'denied', pid: a.id, action: 'steal', reason: chk.reason }); return chk; }
      if (chk.pay === 'coins') a.wallet.coins -= CW.STEAL_COST.coinAlt; else a.wallet[chk.pay] -= CW.STEAL_COST.amount;
      const item = t.loadout[slot];
      const mine = a.loadout[slot];
      item._busy = mine._busy = true;
      let roll = this.rng.next();
      // debug force keeps the dial honest: the needle lands inside the matching zone
      if (this.debug.forceSteal === 'success') roll = roll * chk.chance * 0.98;
      if (this.debug.forceSteal === 'fail') roll = chk.chance + (1 - chk.chance) * (0.02 + roll * 0.96);
      const success = roll < chk.chance;
      const dur = CW.STEAL_RULES.suspenseSec * this.k;
      t.guardUntil = this.time + dur + CW.STEAL_RULES.guardSec * this.k;
      if (t.isHuman || a.isHuman) this.humanTargetCd = this.time + dur + 4 * this.k;
      this.emit({ type: 'stealStart', aid: a.id, tid: t.id, slot, item, chance: chk.chance, roll, success, dur, pay: chk.pay, warded: chk.warded });
      this.emote(a, 'sneak', t.id);
      this.status(a, 'STEALING…', dur / this.k + 0.3);
      if (this.mode.chaosTaxOnSteal) this.addPot(this.mode.chaosTaxOnSteal, a, 'steal');
      this._later(dur, () => this._resolveSteal(a, t, slot, item, mine, success, chk.chance));
      return { ok: true, pending: true, success, chance: chk.chance, pay: chk.pay };
    }
    _resolveSteal(a, t, slot, item, mine, success, chance) {
      item._busy = mine._busy = false;
      if (success) {
        const wardBroken = !!item.protected;
        if (wardBroken) { item.protected = false; t.stats.wardsBroken++; t.protectedSlot = null; }
        const got = slot === 'weapon' ? this.reforge(item, a.loadout.hero.classId) : item;
        const gave = slot === 'weapon' ? this.reforge(mine, t.loadout.hero.classId) : mine;
        a.loadout[slot] = got; t.loadout[slot] = gave;
        a.revealAt[slot] = t.revealAt[slot] = this.time;
        a.stats.steals++; t.stats.stolenFrom++; this.stats.steals++;
        t.lastHitBy = a.id;
        this.emit({ type: 'stealResult', aid: a.id, tid: t.id, slot, success: true, item: got, original: item, gave, chance, wardBroken });
        if (wardBroken) { this.emote(t, 'panic', a.id); this._crowdReact(t, 'shock', 0.9); if (!t.isHuman) this._later(0.3 * this.k, () => this.say(t, 'wardBroken', {}, true)); }
        this.status(a, 'YOINK', 3); this.status(t, 'ROBBED', 3);
        this.emote(a, 'cheer'); this.emote(t, 'angry', a.id);
        if (!a.isHuman) this.say(a, 'stealWin', { t: t.name }, true);
        if (!t.isHuman) this._later(0.5 * this.k, () => this.say(t, 'stolenFrom', { t: a.name }, true));
        this._crowdReact(a, 'laugh', 0.4);
      } else {
        a.stats.stealFails++; this.stats.stealFails++;
        t.lastHitBy = a.id;
        this.emit({ type: 'stealResult', aid: a.id, tid: t.id, slot, success: false, item, chance });
        this.status(a, 'BUSTED', 3);
        this.emote(a, 'sad'); this.emote(t, 'taunt', a.id);
        if (!t.isHuman) this.say(t, 'stealBlocked', { t: a.name }, true);
        if (!a.isHuman && this.rng.chance(0.5)) this._later(0.8 * this.k, () => this.say(a, 'stealLose', { t: t.name }));
        this._crowdReact(t, 'laugh', 0.5);
      }
    }

    griefCheck(actor, target, slot) {
      if (!this.mode.grief) return { ok: false, reason: 'GRIEF RAID ONLY' };
      if (this.phase !== 'chaos') return { ok: false, reason: 'NOT NOW' };
      if (!target || actor === target) return { ok: false, reason: 'NO TARGET' };
      if (actor.locked) return Lobby.LOCKED;
      const item = target.loadout[slot];
      if (!item || !this.isRevealed(target, slot) || this.inFlight(item)) return { ok: false, reason: 'BUSY' };
      if (tierOf(item.rarity) === 0) return { ok: false, reason: 'ALREADY COMMON' };
      if (target.shieldUntil > this.time) return { ok: false, reason: 'SHIELDED', shield: target.shieldUntil - this.time };
      const max = actor.isHuman ? CW.GRIEF_RULES.maxPerPlayer : Math.min(CW.GRIEF_RULES.botMaxPerPlayer, (CW.BOT_PERSONALITIES[actor.personality] || {}).griefMax ?? 1) + (actor.lastHitBy && (CW.BOT_PERSONALITIES[actor.personality] || {}).revenge ? 1 : 0);
      if (actor.griefsUsed >= max) return { ok: false, reason: 'NO CURSES LEFT' };
      const cost = CW.GRIEF_COSTS[item.rarity];
      if (cost.token) {
        if ((actor.wallet[cost.token] || 0) < cost.amount) return { ok: false, reason: 'NEED GRIEF TOKEN', cost };
      } else if (actor.wallet.coins < cost.coins) return { ok: false, reason: 'NEED ' + cost.coins + ' COINS', cost };
      const to = rarityAt(tierOf(item.rarity) - 1);
      return { ok: true, cost, costLabel: cost.token ? cost.amount + ' GRIEF TOKEN' : cost.coins + ' COINS', from: item.rarity, to, item, left: max - actor.griefsUsed, warded: !!item.protected, passChance: item.protected ? CW.PROTECT.griefPassChance : 1 };
    }
    grief(aid, tid, slot) {
      const a = typeof aid === 'string' ? this.get(aid) : aid;
      const t = typeof tid === 'string' ? this.get(tid) : tid;
      const chk = this.griefCheck(a, t, slot);
      if (!chk.ok) { this.emit({ type: 'denied', pid: a.id, action: 'grief', reason: chk.reason }); return chk; }
      if (chk.cost.token) a.wallet[chk.cost.token] -= chk.cost.amount; else a.wallet.coins -= chk.cost.coins;
      a.griefsUsed++;
      const item = t.loadout[slot];
      item._busy = true;
      // shield goes up immediately so two griefers can't double-tap the same victim
      const dur = CW.GRIEF_RULES.resolveSec * this.k;
      t.shieldUntil = this.time + dur + CW.GRIEF_RULES.immunitySec * this.k;
      if (t.isHuman || a.isHuman) this.humanTargetCd = this.time + dur + 4 * this.k;
      const passes = !chk.warded || this.rng.chance(chk.passChance);
      this.emit({ type: 'griefStart', aid: a.id, tid: t.id, slot, item, dur, warded: chk.warded });
      this.emote(a, 'cast', t.id);
      this._later(dur, () => {
        item._busy = false;
        if (!passes) {
          this.emit({ type: 'griefBlocked', aid: a.id, tid: t.id, slot, item });
          this.status(t, 'WARD HELD', 2.5);
          this.emote(t, 'taunt', a.id);
          return;
        }
        if (item.protected) { item.protected = false; t.protectedSlot = null; t.stats.wardsBroken++; this.emit({ type: 'wardBroken', aid: a.id, tid: t.id, slot, item, by: 'grief' }); }
        const from = item.rarity;
        item.rarity = chk.to;
        item.cracks++;
        if (item.slot === 'hero') item.name = CW.CLASSES[item.classId].variants[item.rarity];
        a.stats.griefsDone++; t.stats.griefed++; this.stats.griefs++;
        t.lastHitBy = a.id;
        this.emit({ type: 'grief', aid: a.id, tid: t.id, slot, item, from, to: item.rarity });
        this.status(t, 'CURSED', 3);
        this.emote(t, 'angry', a.id);
        if (!t.isHuman) this._later(0.4 * this.k, () => this.say(t, 'griefed', { t: a.name, i: item.name }, true));
        if (!a.isHuman && this.rng.chance(0.6)) this._later(1.1 * this.k, () => this.say(a, 'grieferGloat'));
        this._crowdReact(a, 'laugh', 0.4);
        if (this.mode.chaosTaxOnGrief) this.addPot(this.mode.chaosTaxOnGrief, a, 'grief');
      });
      return { ok: true, pending: true, from: chk.from, to: chk.to };
    }

    boostCheck(p) {
      if (this.phase !== 'chaos' && this.phase !== 'rolling') return { ok: false, reason: 'NOT NOW' };
      if (p.locked) return Lobby.LOCKED;
      if (this.potX100 >= CW.RAID_POT.cap) return { ok: false, reason: 'POT MAXED' };
      const cost = this.nextBoostCost();
      if (p.wallet.coins < cost) return { ok: false, reason: 'NEED ' + cost + ' COINS', cost };
      return { ok: true, cost };
    }
    boost(pid) {
      const p = typeof pid === 'string' ? this.get(pid) : pid;
      const chk = this.boostCheck(p);
      if (!chk.ok) { this.emit({ type: 'denied', pid: p.id, action: 'boost', reason: chk.reason }); return chk; }
      p.wallet.coins -= chk.cost;
      p.stats.boosts++; this.stats.boosts++;
      const from = this.potX100;
      this.addPot(CW.RAID_POT.step, p, 'boost');
      this.emit({ type: 'boost', pid: p.id, from, to: this.potX100, cost: chk.cost });
      if (!p.isHuman && this.rng.chance(0.5)) this.say(p, 'boost');
      this.emote(p, 'cheer');
      for (const o of this.players) {
        if (o === p) continue;
        const per = CW.BOT_PERSONALITIES[o.personality];
        if (per && this.potX100 > per.boostCeil) { this.emote(o, 'panic', p.id); if (this.rng.chance(0.4)) this.say(o, 'boostPanic'); }
        else if (this.rng.chance(0.35)) this.emote(o, this.potX100 >= 170 ? 'panic' : 'cheer');
      }
      return { ok: true, from, to: this.potX100, cost: chk.cost };
    }
    addPot(amount, p, reason) {
      const from = this.potX100;
      this.potX100 = Math.min(CW.RAID_POT.cap, this.potX100 + amount);
      if (reason !== 'boost' && this.potX100 !== from) this.emit({ type: 'chaosTax', pid: p && p.id, from, to: this.potX100, reason });
      for (const m of CW.RAID_MODIFIERS) {
        if (m.at > from && m.at <= this.potX100) {
          this.emit({ type: 'potTier', mod: m, pot: this.potX100 });
          if (m.bossEnraged) {
            for (const o of this.players) this.emote(o, this.rng.chance(0.5) ? 'panic' : 'cheer');
            this._crowdSay(null, 'chaosRaid', {}, 2, 1);
          }
        }
      }
    }
    setPot(x100) { const v = Math.max(100, Math.min(CW.RAID_POT.cap, Math.round(x100))); if (v > this.potX100) this.addPot(v - this.potX100, null, 'debug'); else this.potX100 = v; }

    // ------------------------------------------------------------ chat / emotes
    say(p, key, vars = {}, force = false) {
      if (!p || p.isHuman) return;
      if (!force && (this.time < p.chatCd || this.time < this._chatGate)) return;
      const per = CW.BOT_PERSONALITIES[p.personality];
      if (!force && per && !this.rng.chance(per.chatty)) return;
      let text = this.rng.pick(CW.LINES[key]);
      text = text.replace('{t}', vars.t || '').replace('{i}', vars.i || 'stuff');
      p.chatCd = this.time + 2.2 * this.k;
      this._chatGate = this.time + 0.5 * this.k;
      this.emit({ type: 'chat', pid: p.id, text, key });
    }
    _crowdSay(subject, key, vars, n = 1, p = 0.8) {
      const others = this.rng.shuffle(this.players.filter((o) => o !== subject && !o.isHuman));
      let said = 0;
      for (const o of others) {
        if (said >= n) break;
        if (this.rng.chance(p)) { this._later(this.rng.range(0.2, 1.0) * this.k, () => this.say(o, key, vars, true)); said++; }
      }
    }
    _crowdReact(subject, emote, p = 0.5) {
      for (const o of this.players) if (o !== subject && this.rng.chance(p)) this.emote(o, emote, subject && subject.id);
    }
    emote(p, emote, at) { this.emit({ type: 'emote', pid: p.id, emote, at }); }

    // ------------------------------------------------------------ bots
    _botThink(p) {
      const per = CW.BOT_PERSONALITIES[p.personality];
      if (!p.protectDecided) {
        p.protectDecided = true;
        const best = SLOTS.filter((s) => this.protectCheck(p, s).ok).sort((x, y) => tierOf(p.loadout[y].rarity) - tierOf(p.loadout[x].rarity))[0];
        if (best && this.rng.chance((per.protect || {})[p.loadout[best].rarity] || 0)) {
          this.protect(p, best);
          this.stats.botActions++;
          p.nextThinkAt = Infinity;
          return;
        }
      }
      if (p.locked) { p.nextThinkAt = Infinity; return; }
      const agg = this.mode.botAggression;
      const opts = [];
      const hum = this.human;
      const humanOk = (o) => !o.isHuman || this.time >= this.humanTargetCd;
      // boost
      const bc = this.boostCheck(p);
      if (bc.ok && this.potX100 < per.boostCeil && p.stats.boosts < per.boostMax && p.wallet.coins >= bc.cost + 100) opts.push({ w: per.wBoost * this.mode.botBoostBias, fn: () => this.boost(p) });
      // reroll worst
      const worst = SLOTS.slice().sort((x, y) => tierOf(p.loadout[x].rarity) - tierOf(p.loadout[y].rarity))[0];
      const rc = this.rerollCheck(p, worst);
      if (rc.ok && p.wallet.coins >= rc.cost + 50) {
        const wt = tierOf(p.loadout[worst].rarity);
        opts.push({ w: per.wReroll * (wt === 0 ? 1.2 : wt === 1 ? 0.5 : 0.1), fn: () => this.reroll(p, worst) });
      }
      // shuffle when sad
      if (this.shuffleCheck(p).ok && this.score(p) < 2) opts.push({ w: per.wShuffle, fn: () => this.shuffle(p) });
      // steal: best EV (prefer revenge target)
      let best = null;
      for (const o of this.players) {
        if (o === p || !humanOk(o)) continue;
        for (const s of CW.STEAL_RULES.stealableSlots) {
          const c = this.stealCheck(p, o, s);
          if (!c.ok) continue;
          const gain = tierOf(o.loadout[s].rarity) - tierOf(p.loadout[s].rarity);
          if (gain <= 0) continue;
          let ev = c.chance * gain * (1 + 0.3 * gain);
          if (p.lastHitBy === o.id && per.revenge) ev *= 3;
          if (!best || ev > best.ev) best = { ev, o, s };
        }
      }
      if (best) opts.push({ w: per.wSteal * agg * Math.min(1.5, 0.6 + best.ev), fn: () => this.steal(p, best.o, best.s) });
      // grief: knock down the shiniest thing in the room
      if (this.mode.grief) {
        let gb = null;
        for (const o of this.players) {
          if (o === p || !humanOk(o)) continue;
          for (const s of SLOTS) {

    // Debug: finish everything instantly and jump to the dungeon.
    _joinAll() { for (const p of this.players) if (!p.joined) { p.joined = true; this.emit({ type: 'join', pid: p.id }); } }
    skipToBattle() {

/* Loadout → combat numbers. deriveStats() is the ONLY place lobby items become combat numbers.
 * The boss race itself lives in battle-race.js.
 */
(function (root) {
  'use strict';
  const CW = (root.CW = root.CW || {});

  // ------------------------------------------------------------ LOADOUT → STATS
  CW.deriveStats = function (loadout) {
    const hero = loadout.hero, weapon = loadout.weapon, gear = loadout.gear;
    const cls = CW.CLASSES[hero.classId];
    const hm = CW.HERO_RARITY_STATS[hero.rarity].mult;
    const ws = CW.WEAPON_RARITY_STATS[weapon ? weapon.rarity : 'common'];
    const gs = CW.GEAR_RARITY_STATS[gear ? gear.rarity : 'common'];
    const s = {
      classId: cls.id, role: cls.role, range: cls.range, dmgType: cls.dmgType,
      hp: cls.hp * hm * (1 + gs.hp),
      atk: cls.atk * hm * (1 + ws.dmg),
      aspd: cls.aspd * (1 + ws.aspd),
      crit: cls.crit + ws.crit,
      def: gs.def, dodge: 0, resist: 0, thorns: 0, lifesteal: 0, revive: 0,
      fx: weapon && weapon.fx && ws.fxChance > 0 ? weapon.fx : null,
      fxChance: ws.fxChance,
      skillPower: hm,
      skills: cls.skills.slice(),
    };
    if (gear && gear.mod) {
      const m = CW.GEAR_MODS[gear.mod];
      const v = (m.base * gs.modPower) / 100;
      if (gear.mod === 'haste') s.aspd *= 1 + v; else s[gear.mod] = v;
    }
    s.hp = Math.round(s.hp);
    s.atk = Math.round(s.atk * 10) / 10;
    s.dps = s.atk * s.aspd * (1 + (s.crit / 100) * (CW.BATTLE.critMult - 1));
    s.power = Math.round(s.dps * 4 + s.hp / 10);
    return s;
  };

  // Human-readable stat lines for an item card (keeps UI out of the maths).
  CW.itemStatLines = function (item) {
    if (!item) return [];
    if (item.slot === 'hero') {
      const c = CW.CLASSES[item.classId];
      const m = CW.HERO_RARITY_STATS[item.rarity].mult;
      return [`${c.role.toUpperCase()} · ${c.range.toUpperCase()}`, `HP ${Math.round(c.hp * m)} · ATK ${Math.round(c.atk * m)}`];
    }
    if (item.slot === 'weapon') {
      const w = CW.WEAPON_RARITY_STATS[item.rarity];
      const out = [`${w.dmg >= 0 ? '+' : ''}${Math.round(w.dmg * 100)}% DMG${w.crit ? ` · +${w.crit}% CRIT` : ''}`];
      if (item.fx && w.fxChance > 0) out.push(`${Math.round(w.fxChance * 100)}% ${CW.WEAPON_FX[item.fx].name.toUpperCase()}`);
      else out.push(item.fx ? `${CW.WEAPON_FX[item.fx].name.toUpperCase()} (DEAD AT COMMON)` : 'NO SPECIAL');
      return out;
    }
    const g = CW.GEAR_RARITY_STATS[item.rarity];
    const out = [g.hp ? `+${Math.round(g.hp * 100)}% HP · ${Math.round(g.def * 100)}% DEF` : 'BASICALLY CLOTHES'];
    if (item.mod) { const m = CW.GEAR_MODS[item.mod]; out.push(`${m.name.toUpperCase()} ${Math.round(m.base * g.modPower)}${m.unit}`); }
    return out;
  };

})(typeof window !== 'undefined' ? window : globalThis);

/* V2 battle: ONE enormous boss, all 8 raiders hit it at once, and it's a DAMAGE RACE.

 * Pure logic, deterministic per seed. UI reads state + drains `events`.
 */
(function (root) {
  'use strict';

  // Isometric staging: raiders on a diagonal from lower-left towards the boss at upper-right.
  CW.RACE_LAYOUT = {
    boss: { x: 368, y: 418, hitX: 352, hitY: 285 },
    lineFrom: { x: 58, y: 768 }, lineTo: { x: 336, y: 540 }, stagger: 38,
    humanSlot: 5, // the human stands near the front of the swarm

  class RaceBattle {

      this.debug = opts.debug || {};

      this.firstVoteOptions = opts.firstVoteOptions || null;
      this.time = 0;
      this.state = 'intro';
      this.stateEnd = 1.6;
      this.events = [];
      this.projectiles = [];
      this.summons = [];
      this.telegraphs = [];
      this._timers = [];
      this._uid = 1;
      this.result = null;
      this.midVoteDone = false;
      this.vote = null;
      this._rankT = 0;
      this._leaderCd = 0;
      this._chatGate = 0;
      this._buildParty(opts.party);
      this._buildBoss();
      this._rank(true);
    }

    // ------------------------------------------------------------ setup
    _buildParty(spec) {
      const L = CW.RACE_LAYOUT;
      const order = spec.filter((p) => !p.isHuman);
      const human = spec.find((p) => p.isHuman);
      if (human) order.splice(Math.min(L.humanSlot, order.length), 0, human);
      const dx = L.lineTo.x - L.lineFrom.x, dy = L.lineTo.y - L.lineFrom.y, len = Math.hypot(dx, dy);
      const px = -dy / len, py = dx / len;
      this.units = order.map((p, i) => {
        const t = order.length > 1 ? i / (order.length - 1) : 0;
        const off = (i % 2 ? 1 : -1) * L.stagger;
        const base = { hero: p.loadout.hero, weapon: p.loadout.weapon, gear: p.loadout.gear };
        const u = {
          id: 'u' + this._uid++, idx: i, pid: p.id, name: p.name, isHuman: !!p.isHuman, personality: p.personality || null, look: p.look,
          classId: base.hero.classId, accent: (p.look && p.look.body) || '#8b5cf6',
          base, cur: { ...base }, effects: [], shield: 0, down: false, koUntil: 0,
          atkCd: 0.3 + this.rng.next() * 0.8, botCastDelay: 0,
          item: null, reel: null, itemCd: this.rng.range(...CW.ITEM_FIRST), itemHeldAt: 0, holdUntil: 0, swap: null,
          secondWindUsed: false, revived: false, lastHitBy: null, chatCd: 0,
          dmg: 0, heal: 0, score: 0, rank: i + 1, prevRank: i + 1,
          hx: L.lineFrom.x + dx * t + px * off, hy: L.lineFrom.y + dy * t + py * off,
          anim: { lunge: 0, hit: 0, cast: 0 },
          tally: { itemsUsed: 0, rivalsHit: 0, ghostSwaps: 0, swapCurses: 0, lightnings: 0, crowns: 0, biggestHit: 0, timesKO: 0, timesStunned: 0, blocked: 0 },
        };

      const L = CW.RACE_LAYOUT.boss;

        key, def, name: def.name,
        maxHp: Math.round(def.hp * CW.BATTLE.enemyHpScale * (1 + this.mods.enemyHp) * (this.mods.bossEnraged ? 1 + CW.BATTLE.chaosRaidEnrage.hp : 1)),
        atk: def.atk * CW.BATTLE.enemyAtkScale * (1 + this.mods.enemyDmg) * (this.mods.bossEnraged ? 1 + CW.BATTLE.chaosRaidEnrage.atk : 1),
        x: L.x, y: L.y, hitX: L.hitX, hitY: L.hitY,

    emit(e) { e.t = this.time; this.events.push(e); return e; }
    drain() { const e = this.events; this.events = []; return e; }
    get(id) { return this.units.find((u) => u.id === id || u.pid === id); }
    get human() { return this.units.find((u) => u.isHuman); }

    rivalsOf(u, includeDown = false) { return this.units.filter((o) => o !== u && (includeDown || !o.down)); }

      if (ex) { ex.until = Math.max(ex.until, e.until); Object.assign(ex, vals); return ex; }

    }
    _recalc(u, init) {
      const ratio = init ? 1 : u.hp / u.maxHp;
      const s = CW.deriveStats(u.cur);
      Object.assign(u, { maxHp: s.hp, atk: s.atk, baseAspd: s.aspd, crit: s.crit, def: s.def, dodge: s.dodge, resist: s.resist, thorns: s.thorns, lifesteal: s.lifesteal, revive: s.revive, fx: s.fx, fxChance: s.fxChance, skillPower: s.skillPower, range: s.range, role: s.role, dmgType: s.dmgType, power: s.power });
      u.weaponKind = u.cur.weapon.kind; u.weaponRarity = u.cur.weapon.rarity; u.heroRarity = u.cur.hero.rarity;

    // ------------------------------------------------------------ damage to the boss
    _variance() {

    hitBoss(u, power, opt = {}) {

      src.heal += real;
