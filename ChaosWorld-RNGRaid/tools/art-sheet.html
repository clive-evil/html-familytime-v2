<!doctype html><html><head><meta charset="utf-8"><title>Chaos World art sheet</title><link rel="stylesheet" href="../css/fonts.css"><style>body{background:#2a2030;margin:0;font-family:'CW Bang',sans-serif;color:#f1e4c6}canvas{display:block}</style></head><body>
<canvas id="c" width="1080" height="1240"></canvas>
<script src="../js/config.js"></script><script src="../js/art.js"></script><script src="../js/chars.js"></script><script src="../js/boss-art.js"></script><script src="../js/art-manifest.js"></script><script src="../js/art-pack.js"></script>
<script>
// Placeholder art sheet: every archetype in every state, rarity auras, bosses, item icons. Open in a browser to review.
CW.ArtPack.init();
const c=document.getElementById('c'),x=c.getContext('2d'); x.font='18px "CW Display"'; x.fillStyle='#f1e4c6';
const ids=CW.CLASS_IDS, acc=['#8b5cf6','#3b82f6','#f97316','#db2777','#10b981','#a16207','#a3a3a3','#7bc142','#ef4444'];
const W=['sword','shield','bow','staff','axe','dagger','mace','scythe','hammer'];
ids.forEach((id,i)=>{ x.fillText(CW.CLASSES[id].name, 24+i*116, 30); CW.ArtPack.drawCharacter(x,id,60+i*116,175,1.05,{accent:acc[i],weaponKind:CW.WEAPONS[id].epic[0].kind,weaponRarity:'epic',t:1}); });
const st=['attack','cast','stun','cheer','hurt','down'];
st.forEach((s,j)=>{ x.fillText(s.toUpperCase(), 24+j*175, 230); for(let k=0;k<2;k++){const id=ids[(j*2+k)%9]; CW.ArtPack.drawCharacter(x,id,60+j*175+k*72,360,0.75,{accent:acc[(j+k)%9],state:s,attackT:.5,weaponKind:W[(j+k)%9],weaponRarity:'rare',t:2});} });
['common','rare','epic','legendary','mythic'].forEach((r,j)=>{ x.fillText(r.toUpperCase(), 24+j*210, 410); CW.ArtPack.drawCharacter(x,['knight','paladin','archer','mage','scrub'][j],90+j*210,540,0.95,{accent:'#8b5cf6',rarity:r,weaponKind:'greatsword',weaponRarity:r,t:3}); });
Object.keys(CW.BOSSES).forEach((k,j)=>{ const B={x:190+j*340,y:950,def:CW.BOSSES[k],key:k,pose:['idle','windup','roar'][j],flinch:0,enraged:j===2}; CW.ArtPack.drawBoss(x,B,1,{scale:0.62}); x.fillText(CW.BOSSES[k].name+' ('+B.pose+')', 40+j*340, 980); });
const items=Object.keys(CW.BATTLE_ITEMS); items.forEach((id,j)=>{ x.save(); x.translate(50+j*84,1060); x.scale(0.8,0.8); CW.Art.drawItem(x,CW.BATTLE_ITEMS[id].icon,'epic'); x.restore(); x.font='12px "CW Bang"'; x.fillText(CW.BATTLE_ITEMS[id].name, 20+j*84, 1110); });
ids.forEach((id,i)=>{ const im=new Image(); im.src=CW.ArtPack.heroIcon(id,['common','rare','epic','legendary','mythic'][i%5],80,acc[i]); im.onload=()=>x.drawImage(im,20+i*116,1140); });
</script></body></html>
