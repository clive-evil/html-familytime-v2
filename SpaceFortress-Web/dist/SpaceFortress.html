<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space Fortress</title>
<style>:root {
  --holo: #5fd4ff;
  --holo-dim: #2a6f8f;
  --holo-faint: rgba(95, 212, 255, 0.12);
  --warn: #ff8a2a;
  --alert: #ff3b30;
  --ok: #6dff9c;
  --steel: #8b97a3;
  --bg: #04070b;
  --panel: rgba(6, 14, 22, 0.86);
  --panel-edge: rgba(95, 212, 255, 0.35);
  --text: #d8e8f2;
  --text-dim: #7f98a8;
  --met: #c4ccd4; --fis: #a6ff4d; --cry: #4fd8ff; --exo: #c77dff;
  --font: "Bahnschrift", "DIN Alternate", "Roboto Condensed", "Arial Narrow", "Segoe UI", sans-serif;
  --mono: "Consolas", "SFMono-Regular", "Menlo", monospace;
  --ui: clamp(12px, 0.78vw + 3px, 17px);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); font-size: var(--ui); overflow: hidden; user-select: none; }
button { font-family: inherit; font-size: inherit; color: inherit; }
.hidden { display: none !important; }
#app { position: fixed; inset: 0; }
#map, #console { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#console { z-index: 50; cursor: default; }

/* ---------- panels ---------- */
.panel {
  background: linear-gradient(180deg, rgba(10, 24, 36, 0.92), var(--panel));
  border: 1px solid var(--panel-edge);
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.6), 0 8px 30px rgba(0, 0, 0, 0.55), inset 0 0 30px rgba(95, 212, 255, 0.05);
  clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
}
.hud { position: absolute; z-index: 10; }
h2, h3 { margin: 0; font-weight: 600; letter-spacing: 0.12em; }
.label { color: var(--text-dim); font-size: 0.78em; letter-spacing: 0.14em; text-transform: uppercase; }
.num { font-family: var(--mono); }

/* ---------- top bar ---------- */
#topbar {
  top: 0; left: 0; right: 0; height: 3.6em; display: flex; align-items: center; gap: 1.2em; padding: 0 1em;
  background: linear-gradient(180deg, rgba(4, 10, 16, 0.97), rgba(4, 10, 16, 0.82));
  border-bottom: 1px solid var(--panel-edge);
}
.brand { font-weight: 700; letter-spacing: 0.3em; color: var(--warn); white-space: nowrap; font-size: 1.05em; }
.brand-mark { color: var(--alert); margin-right: 0.4em; }
.sysname { white-space: nowrap; line-height: 1.1; }
.sysname b { display: block; letter-spacing: 0.18em; color: var(--holo); }
.sysname span { font-size: 0.75em; color: var(--text-dim); letter-spacing: 0.12em; }
.resbar { display: flex; gap: 0.5em; margin-left: auto; }
.res { display: flex; flex-direction: column; align-items: flex-start; padding: 0.2em 0.6em; border-left: 3px solid; background: rgba(255, 255, 255, 0.03); min-width: 5.4em; }
.res .v { font-family: var(--mono); font-size: 1.15em; font-weight: 700; }
.res .d { font-size: 0.7em; color: var(--text-dim); font-family: var(--mono); }
.res .n { font-size: 0.62em; letter-spacing: 0.14em; color: var(--text-dim); }
.res.flash { animation: resflash 0.9s; }
@keyframes resflash { 0% { background: rgba(255, 255, 255, 0.35); } 100% { background: rgba(255, 255, 255, 0.03); } }
.fortbars { display: grid; grid-template-columns: auto 8em; gap: 0.15em 0.5em; align-items: center; font-size: 0.75em; }
.bar { height: 0.7em; background: rgba(255, 255, 255, 0.08); position: relative; overflow: hidden; }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; transition: width 0.4s; }
.top-actions { display: flex; gap: 0.5em; }
.btn {
  border: 1px solid var(--panel-edge); background: rgba(95, 212, 255, 0.08); padding: 0.55em 1em; cursor: pointer; letter-spacing: 0.14em; font-weight: 600;
  clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px)); transition: background 0.15s, transform 0.08s;
}
.btn:hover:not(:disabled) { background: rgba(95, 212, 255, 0.22); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: 0.38; cursor: not-allowed; }
.btn-end { background: linear-gradient(180deg, #ff9a3a, #c4560c); color: #1a0a00; border-color: #ffb066; }
.btn-end:hover:not(:disabled) { background: linear-gradient(180deg, #ffb35e, #dd6a18); }
.btn-steel { background: linear-gradient(180deg, #3a4652, #1c242c); border-color: #6b7a88; }
.btn-icon { padding: 0.55em 0.8em; }
.btn-warn { background: rgba(255, 138, 42, 0.18); border-color: var(--warn); color: #ffd2a8; }
.btn-alert { background: linear-gradient(180deg, #ff4b3a, #9a1208); border-color: #ff8a7a; color: #fff; }
.btn-ok { background: rgba(109, 255, 156, 0.14); border-color: var(--ok); color: #c8ffd9; }
.btn-big { padding: 0.8em 1.6em; font-size: 1.1em; }

/* ---------- station bar (physical deck selector) ---------- */
#stationbar {
  left: 0; top: 3.6em; bottom: 0; width: 6.2em; z-index: 14;
  display: flex; flex-direction: column; gap: 2px; padding: 0.5em 0.3em; align-items: stretch;
  background: linear-gradient(90deg, #10151a, #0a0e12 70%, #05080b);
  border-right: 2px solid #000; box-shadow: 4px 0 14px rgba(0,0,0,0.6), inset -3px 0 8px rgba(0,0,0,0.7);
}
.deck-hidden { display: none !important; }
#topbar.deckmode #res-bar, #topbar.deckmode #fort-bars { display: none; }
#topbar.deckmode .sysname { margin-left: auto; }
.stn {
  position: relative; flex: 1 1 auto; max-height: 6.5em; border: 1px solid #2a3139; cursor: pointer;
  background: linear-gradient(180deg, #2b333b, #161b20); color: var(--text-dim);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.3em;
  letter-spacing: 0.08em; font-weight: 700; font-size: 0.7em; padding: 0.3em 0.1em;
  border-radius: 2px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), inset 0 -2px 4px rgba(0,0,0,0.5);
  transition: background 0.12s, color 0.12s;
}
.stn::before, .stn::after { content: ''; position: absolute; width: 4px; height: 4px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #8a929a, #20262c); top: 3px; }
.stn::before { left: 3px; } .stn::after { right: 3px; }
.stn:hover { background: linear-gradient(180deg, #3a444e, #20262c); color: var(--text); }
.stn.active { background: linear-gradient(180deg, #4a3a1a, #2a1e08); color: #ffd2a8; border-color: var(--warn); box-shadow: inset 0 0 14px rgba(255,138,42,0.3), -3px 0 10px rgba(255,138,42,0.15); }
.stn:not(.avail) { opacity: 0.45; }
.stn-name { text-align: center; line-height: 1.05; }
.stn-key { position: absolute; bottom: 2px; right: 4px; font-size: 0.8em; color: var(--text-dim); opacity: 0.6; }
.stn-lamp { width: 9px; height: 9px; border-radius: 50%; background: #20262c; box-shadow: inset 0 0 3px #000, 0 0 0 2px #0a0d10; }
.stn.avail .stn-lamp { background: #3a7a4a; }
.stn.armed .stn-lamp { background: #6dff9c; box-shadow: inset 0 0 3px #000, 0 0 0 2px #0a0d10, 0 0 8px #6dff9c; animation: lamppulse 1.4s infinite; }
.stn.active.armed .stn-lamp { background: #ffd24a; box-shadow: 0 0 8px #ffd24a; }
@keyframes lamppulse { 50% { box-shadow: inset 0 0 3px #000, 0 0 0 2px #0a0d10, 0 0 14px #6dff9c; } }

/* ---------- deck HUD overlay ---------- */
#deckhud { top: 4.2em; left: 7em; right: 1em; z-index: 12; pointer-events: none; display: flex; justify-content: space-between; gap: 1em; background: none; border: none; box-shadow: none; }
#deckhud .deck-obj { pointer-events: auto; max-width: 26em; clip-path: none; padding: 0.7em 1em 0.8em; background: linear-gradient(180deg, rgba(10,18,26,0.9), rgba(6,12,18,0.82)); }
#deckhud .deck-obj .obj-title { color: var(--warn); font-weight: 700; letter-spacing: 0.14em; margin: 0.2em 0 0.35em; font-size: 1.02em; }
#deckhud .deck-obj .obj-text { line-height: 1.35; font-size: 0.9em; }
#deckhud .deck-obj .obj-meta { margin-top: 0.5em; display: flex; flex-direction: column; gap: 0.25em; font-size: 0.82em; color: var(--text-dim); }
#deckhud .deck-obj .threat { color: #ffb38a; }

/* ---------- objective + log ---------- */
#objective { top: 4.4em; left: 7em; width: 22em; padding: 0.8em 1em 0.9em; }
#objective .obj-title { color: var(--warn); font-weight: 700; letter-spacing: 0.16em; margin: 0.15em 0 0.35em; font-size: 1.05em; }
#objective .obj-text { color: var(--text); line-height: 1.35; font-size: 0.92em; }
#objective .obj-meta { margin-top: 0.6em; display: flex; flex-direction: column; gap: 0.25em; font-size: 0.82em; color: var(--text-dim); }
#objective .threat { color: #ffb38a; }
#objective .tut-progress { display: flex; gap: 3px; margin-top: 0.6em; }
#objective .tut-progress i { flex: 1; height: 4px; background: rgba(255, 255, 255, 0.1); }
#objective .tut-progress i.on { background: var(--warn); }
#log { left: 7em; top: 20em; width: 22em; max-height: calc(100vh - 34em); overflow: hidden; padding: 0.6em 0.8em; font-size: 0.78em; display: flex; flex-direction: column-reverse; gap: 0.3em; opacity: 0.92; }
#log .e { line-height: 1.3; color: var(--text-dim); border-left: 2px solid transparent; padding-left: 0.5em; }
#log .e b { color: var(--holo-dim); font-family: var(--mono); font-weight: 400; margin-right: 0.4em; }
#log .e.kill { color: #ffd0a0; border-color: var(--warn); }
#log .e.loss { color: #ff9c94; border-color: var(--alert); }
#log .e.gain { color: #b8ffcf; border-color: var(--ok); }
#log .e.warn { color: #ffc77a; border-color: #ffc04d; }
#log .e.sys { color: var(--holo); border-color: var(--holo); }

/* ---------- planet command panel ---------- */
#panel { top: 4.4em; right: 1em; width: 24em; bottom: 13.6em; overflow-y: auto; padding: 0.9em 1em 1em; scrollbar-width: thin; scrollbar-color: var(--holo-dim) transparent; }
.p-head { display: flex; justify-content: space-between; align-items: baseline; gap: 0.5em; }
.p-name { font-size: 1.5em; font-weight: 700; letter-spacing: 0.12em; }
.p-owner { font-size: 0.75em; padding: 0.2em 0.6em; letter-spacing: 0.15em; border: 1px solid; white-space: nowrap; }
.own-enemy { color: #ff8a7a; border-color: #ff8a7a; }
.own-neutral { color: #e8e0b0; border-color: #a89f70; }
.own-player { color: var(--ok); border-color: var(--ok); }
.own-destroyed { color: #888; border-color: #555; }
.p-desc { color: var(--text-dim); font-size: 0.85em; margin: 0.3em 0 0.7em; line-height: 1.35; }
.statgrid { display: grid; grid-template-columns: 8.2em 1fr auto; gap: 0.35em 0.6em; align-items: center; font-size: 0.86em; }
.statgrid .bar { height: 0.6em; }
.sec { margin-top: 0.9em; padding-top: 0.6em; border-top: 1px solid rgba(95, 212, 255, 0.15); }
.sec-title { display: flex; justify-content: space-between; align-items: baseline; color: var(--holo); letter-spacing: 0.16em; font-size: 0.8em; font-weight: 700; margin-bottom: 0.45em; }
.resrow { display: grid; grid-template-columns: 1.3em 1fr auto; gap: 0.3em; align-items: center; font-size: 0.86em; padding: 0.1em 0; }
.pips { display: inline-flex; gap: 2px; }
.pips i { width: 0.8em; height: 0.45em; background: rgba(255, 255, 255, 0.1); }
.insts { display: flex; flex-direction: column; gap: 0.3em; }
.inst {
  display: grid; grid-template-columns: 2.1em 1fr auto; gap: 0.5em; align-items: center; padding: 0.35em 0.5em; cursor: pointer;
  background: rgba(255, 255, 255, 0.03); border: 1px solid transparent; transition: background 0.12s;
}
.inst:hover { background: rgba(95, 212, 255, 0.1); }
.inst.sel { border-color: var(--warn); background: rgba(255, 138, 42, 0.12); }
.inst.dead { opacity: 0.45; cursor: default; }
.inst .ic { width: 2.1em; height: 2.1em; }
.inst .nm { font-size: 0.9em; line-height: 1.15; }
.inst .nm small { display: block; color: var(--text-dim); font-size: 0.78em; }
.inst .hp { width: 4.2em; text-align: right; font-family: var(--mono); font-size: 0.8em; }
.inst .hp .bar { height: 0.35em; margin-top: 0.2em; }
.tag { display: inline-block; font-size: 0.68em; padding: 0.05em 0.4em; margin-left: 0.3em; letter-spacing: 0.1em; border: 1px solid; vertical-align: middle; }
.tag-dis { color: #8fd8ff; border-color: #4a9ac0; }
.tag-sh { color: #9fb8ff; border-color: #5a6fb0; }
.actions { display: flex; flex-wrap: wrap; gap: 0.4em; margin-top: 0.6em; }
.actions .btn { flex: 1 1 auto; }
.inv-box { background: rgba(0, 0, 0, 0.25); padding: 0.6em 0.7em; border: 1px solid rgba(255, 255, 255, 0.06); }
.inv-big { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.4em; text-align: center; margin: 0.4em 0; }
.inv-big .k { font-size: 0.68em; color: var(--text-dim); letter-spacing: 0.12em; }
.inv-big .v { font-family: var(--mono); font-size: 1.35em; font-weight: 700; }
.inv-big .delta { font-size: 0.72em; font-family: var(--mono); }
.chance-bar { height: 0.9em; background: rgba(255, 60, 48, 0.25); position: relative; margin: 0.3em 0; }
.chance-bar > i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #4bd27a, #8dffb0); transition: width 0.4s; }
.factors { font-size: 0.78em; color: var(--text-dim); display: flex; flex-wrap: wrap; gap: 0.25em 0.8em; margin-top: 0.3em; }
.factors b { color: #ffb38a; font-weight: 400; }
input[type=range] { width: 100%; accent-color: var(--warn); }
.hint { font-size: 0.8em; color: var(--text-dim); line-height: 1.35; margin-top: 0.4em; }
.verdict { font-size: 0.85em; line-height: 1.4; padding: 0.5em 0.6em; background: rgba(255, 138, 42, 0.08); border-left: 3px solid var(--warn); margin-top: 0.6em; }

/* ---------- weapon dock ---------- */
#dock { left: 30em; right: 26em; bottom: 0.8em; display: flex; gap: 0.5em; align-items: stretch; height: 12em; }
.wcard {
  flex: 1 1 0; min-width: 0; position: relative; padding: 0.6em 0.7em; cursor: pointer; display: flex; flex-direction: column; gap: 0.3em;
  background: linear-gradient(180deg, rgba(20, 30, 40, 0.95), rgba(8, 14, 20, 0.95)); border: 1px solid #34424f;
  clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
}
.wcard:hover { border-color: #5a6c7c; }
.wcard.sel { border-color: var(--warn); box-shadow: inset 0 0 24px rgba(255, 138, 42, 0.18); }
.wcard.locked { opacity: 0.5; }
.wcard .wn { font-weight: 700; letter-spacing: 0.14em; font-size: 0.95em; }
.wcard .ws { font-size: 0.72em; color: var(--text-dim); letter-spacing: 0.08em; }
.wcard .wstat { font-size: 0.74em; font-family: var(--mono); color: var(--text-dim); }
.wcard .ready { color: var(--ok); }
.wcard .notready { color: #ff9c74; }
.ammo { display: flex; gap: 0.25em; flex-wrap: wrap; }
.chip { font-size: 0.7em; padding: 0.2em 0.45em; border: 1px solid #3f4e5b; background: rgba(255, 255, 255, 0.03); cursor: pointer; letter-spacing: 0.05em; white-space: nowrap; }
.chip.on { border-color: var(--warn); color: #ffd2a8; background: rgba(255, 138, 42, 0.14); }
.chip.lock { opacity: 0.4; cursor: not-allowed; }
.preview { font-size: 0.74em; line-height: 1.3; margin-top: auto; }
.rating { font-weight: 700; letter-spacing: 0.1em; }
.r-DECISIVE { color: #7dffb0; } .r-STRONG { color: #c8ff7a; } .r-MODERATE { color: #ffd27a; } .r-POOR { color: #ff8a7a; }
.fire-row { display: flex; gap: 0.3em; }
.fire-row .btn { flex: 1; padding: 0.45em 0.3em; font-size: 0.82em; }
.heat { height: 0.5em; background: rgba(255, 255, 255, 0.08); position: relative; }
.heat > i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #ffd25a, #ff5a2a, #ff1a1a); }
.wcard.pk { flex: 1.15 1 0; background: linear-gradient(180deg, rgba(40, 10, 30, 0.95), rgba(12, 4, 10, 0.95)); border-color: #6a2a55; }
.wcard.pk .wn { color: #e9a6ff; }
.wcard.pk.armed { border-color: #ff4bd8; box-shadow: inset 0 0 30px rgba(255, 75, 216, 0.25); animation: pkpulse 2s infinite; }
@keyframes pkpulse { 50% { box-shadow: inset 0 0 50px rgba(255, 75, 216, 0.45); } }
.req { font-size: 0.7em; color: var(--text-dim); line-height: 1.35; }
.req .ok { color: var(--ok); } .req .no { color: #ff8a7a; }

/* ---------- toasts / tooltip / tutorial ---------- */
#toasts { position: absolute; top: 4.6em; left: 50%; transform: translateX(-50%); z-index: 30; display: flex; flex-direction: column; align-items: center; gap: 0.4em; pointer-events: none; }
.toast { background: rgba(6, 14, 22, 0.94); border: 1px solid var(--panel-edge); padding: 0.55em 1.2em; letter-spacing: 0.08em; animation: toastin 0.25s ease-out; max-width: 40em; text-align: center; }
.toast.kill { border-color: var(--warn); color: #ffd8b0; }
.toast.loss { border-color: var(--alert); color: #ffb0a8; }
.toast.gain { border-color: var(--ok); color: #c8ffd9; }
.toast.big { font-size: 1.5em; font-weight: 700; letter-spacing: 0.2em; padding: 0.6em 1.6em; }
@keyframes toastin { from { opacity: 0; transform: translateY(-8px); } }
#tooltip { position: absolute; z-index: 60; max-width: 22em; background: rgba(4, 10, 16, 0.97); border: 1px solid var(--holo-dim); padding: 0.55em 0.7em; font-size: 0.82em; line-height: 1.4; pointer-events: none; }
#tooltip b { color: var(--holo); }
#tut-ring { position: absolute; z-index: 40; border: 2px solid var(--warn); box-shadow: 0 0 0 4px rgba(255, 138, 42, 0.25), 0 0 24px rgba(255, 138, 42, 0.6); pointer-events: none; animation: ring 1.1s infinite; }
@keyframes ring { 50% { box-shadow: 0 0 0 8px rgba(255, 138, 42, 0.1), 0 0 34px rgba(255, 138, 42, 0.9); } }
#tut-arrow { position: absolute; z-index: 41; color: var(--warn); font-size: 2em; pointer-events: none; text-shadow: 0 0 12px var(--warn); animation: bob 0.8s infinite alternate; }
@keyframes bob { to { transform: translateY(8px); } }

/* ---------- overlays ---------- */
#overlay { position: absolute; inset: 0; z-index: 45; background: rgba(2, 5, 8, 0.72); display: flex; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
.modal { width: min(92vw, 78em); max-height: 90vh; overflow-y: auto; padding: 1.4em 1.6em; }
.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1em; gap: 1em; }
.modal-head h2 { color: var(--holo); font-size: 1.4em; }
.branches { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1em; }
.branch { background: rgba(0, 0, 0, 0.25); padding: 0.7em; border: 1px solid rgba(95, 212, 255, 0.12); }
.branch h3 { font-size: 0.85em; color: var(--warn); margin-bottom: 0.5em; }
.upg { padding: 0.55em 0.65em; margin-bottom: 0.45em; border: 1px solid #34424f; background: rgba(255, 255, 255, 0.03); position: relative; }
.upg .un { font-weight: 700; letter-spacing: 0.06em; }
.upg .ud { font-size: 0.8em; color: var(--text-dim); margin: 0.2em 0 0.35em; line-height: 1.3; }
.upg .uc { font-size: 0.78em; font-family: var(--mono); }
.upg.owned { border-color: var(--ok); background: rgba(109, 255, 156, 0.07); }
.upg.owned .un::after { content: '  INSTALLED'; color: var(--ok); font-size: 0.7em; letter-spacing: 0.15em; }
.upg.available { border-color: var(--warn); cursor: pointer; }
.upg.available:hover { background: rgba(255, 138, 42, 0.15); }
.upg.locked { opacity: 0.45; }
.upg.unaffordable { opacity: 0.75; }
.upg-arrow { text-align: center; color: var(--holo-dim); font-size: 0.8em; margin: -0.25em 0 0.2em; }
.fort-top { display: grid; grid-template-columns: 1.3fr 1fr; gap: 1em; margin-bottom: 1em; }
.fort-top canvas { width: 100%; height: 13em; background: #02060a; border: 1px solid rgba(95, 212, 255, 0.15); }
.fort-stats { display: grid; grid-template-columns: auto 1fr; gap: 0.35em 1em; font-size: 0.9em; align-content: start; }

/* title */
.title-wrap { text-align: center; }
.title-logo { font-size: clamp(36px, 6vw, 96px); font-weight: 800; letter-spacing: 0.32em; color: #ffd2a8; text-shadow: 0 0 30px rgba(255, 138, 42, 0.6), 0 0 2px #fff; margin-right: -0.32em; }
.title-sub { color: var(--holo); letter-spacing: 0.5em; margin: 0.6em 0 2.6em; font-size: 0.95em; }
.title-btns { display: flex; flex-direction: column; gap: 0.7em; align-items: center; }
.title-btns .btn { width: 22em; padding: 0.9em; font-size: 1.05em; }

@media (max-width: 1500px) {
  #dock { left: 7em; right: 26em; }
  #log { display: none; }
}
@media (max-height: 820px) {

  #dock { right: 23em; }

// Core namespace + small utilities shared by sim (Node-testable) and browser code.

  const SF = (globalThis.SF = globalThis.SF || {});
  SF.RES = ['metals', 'fissile', 'crystals', 'exotic'];
  SF.RES_INFO = {
    metals: { name: 'Metals', short: 'MET', color: '#c4ccd4', icon: '▰' },
    fissile: { name: 'Fissile Material', short: 'FIS', color: '#a6ff4d', icon: '☢' },
    crystals: { name: 'Energy Crystals', short: 'CRY', color: '#4fd8ff', icon: '◆' },
    exotic: { name: 'Exotic Matter', short: 'EXO', color: '#c77dff', icon: '✦' },
  };
  // Deterministic RNG whose state lives in the save game (mulberry32).
  SF.rand = function (g) {
    g.rng = (g.rng + 0x6d2b79f5) | 0;
    let t = g.rng;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  SF.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  SF.lerp = (a, b, t) => a + (b - a) * t;
  SF.fmtInt = (n) => Math.round(n).toLocaleString('en-US');
  SF.fmtK = (n) => (Math.abs(n) >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + 'k' : String(Math.round(n)));
  SF.pct = (v) => Math.round(v * 100) + '%';
  SF.costText = function (cost) {
    if (!cost) return 'free';
    return SF.RES.filter((r) => cost[r]).map((r) => cost[r] + ' ' + SF.RES_INFO[r].short).join(' · ') || 'free';
  };
})();

})();

// Weapon resolution: previews (used heavily by the UI) and actual firing.
(function () {
  const SF = globalThis.SF;
  const { clamp, rand } = SF;

  SF.ammoUnlocked = function (g, wid, aid) {
    const A = SF.WEAPONS[wid].ammo[aid];
    return !A.req || SF.has(g, A.req);
  };
  SF.shotCost = function (g, wid, aid) {
    const c = Object.assign({}, SF.WEAPONS[wid].ammo[aid].cost);
    c.power = SF.weaponPower(g, wid);
    return c;
  };

  // Resolve a target reference: { kind:'inst', p, i } or { kind:'fleet', f }.
  SF.resolveTarget = function (g, pid, iid) {
    if (pid && pid.startsWith('fleet:')) {
      const f = SF.fleet(g, pid.slice(6));
      return f ? { kind: 'fleet', f } : null;
    }
    const p = SF.planet(g, pid);
    if (!p) return null;
    const i = SF.inst(p, iid);
    return i ? { kind: 'inst', p, i } : null;
  };

  SF.canFire = function (g, wid, aid, pid, iid) {
    const ws = SF.weaponState(g, wid);
    if (!ws.ok) return ws;
    if (!SF.ammoUnlocked(g, wid, aid)) return { ok: false, reason: 'AMMO LOCKED' };
    const t = SF.resolveTarget(g, pid, iid);
    if (!t) return { ok: false, reason: 'NO TARGET' };
    if (t.kind === 'inst') {
      if (SF.planetSys(g, t.p.id) !== g.sysIndex) return { ok: false, reason: 'OUT OF RANGE' };
      if (t.p.owner !== 'enemy') return { ok: false, reason: 'NOT HOSTILE' };
      if (!t.p.scanned) return { ok: false, reason: 'SCAN REQUIRED' };
      if (t.i.hp <= 0) return { ok: false, reason: 'DESTROYED' };
      const A = SF.WEAPONS[wid].ammo[aid];
      if (SF.INST[t.i.type].orbital && (A.mult.orbital || 0) <= 0) return { ok: false, reason: 'CANNOT REACH ORBIT' };
      if (SF.troopsOnSurface(g, t.p.id) && (wid === 'bombard' || aid === 'nuke')) return { ok: false, reason: 'OUR TROOPS ARE ON THE SURFACE' };
    } else {
      if (!(SF.WEAPONS[wid].ammo[aid].mult.ship > 0)) return { ok: false, reason: 'CANNOT ENGAGE SHIPS' };
    }
    if (!SF.canAfford(g, SF.shotCost(g, wid, aid))) return { ok: false, reason: 'INSUFFICIENT RESOURCES' };
    return { ok: true };
  };

  // Damage before randomness. q = manual quality (0..1) or null for auto.
  function baseDamage(g, wid, aid, t, q) {
    const W = SF.WEAPONS[wid];
    const A = W.ammo[aid];
    const armor = t.kind === 'fleet' ? 'ship' : SF.INST[t.i.type].armor;
    let d = A.dmg * (A.mult[armor] || 0);
    if (t.kind === 'inst' && A.vsType && A.vsType[t.i.type]) d *= A.vsType[t.i.type];
    if (wid === 'railgun' && SF.has(g, 'rail_caps')) d *= 1.25;
    if (wid === 'laser' && SF.has(g, 'laser_lance')) d *= 1.5;
    let shielded = false;
    if (t.kind === 'inst' && t.i.type !== 'shield' && !SF.INST[t.i.type].orbital && SF.shieldUp(t.p)) {

      const sm = A.shieldMult != null ? A.shieldMult : W.shieldMult;

    if (!t) return null;
    const W = SF.WEAPONS[wid];
    const A = W.ammo[aid];
    const b = baseDamage(g, wid, aid, t, q);
    const hp = t.kind === 'fleet' ? t.f.hp : t.i.hp;
    const hit = q != null ? 1 : W.accuracy;

      collat, collatTargets: A.collatTargets || 1, nuke: aid === 'nuke', emp: !!A.disable, popLoss: A.popLoss || 0,

    if (wid === 'laser') {
      ws.heat += SF.laserHeatPerShot(g);

    }
    const res = { ok: true, wid, aid, pid, iid, hit: false, intercepted: false, crit: false, dmg: 0, killed: [], collateral: [], popLoss: 0, q, nuke: aid === 'nuke', emp: !!A.disable };
    const hitRoll = q != null ? (q >= 0.15 || opts.guarantee ? 1 : 0) : rand(g) < W.accuracy || opts.guarantee ? 1 : 0;

      t.i.disabled = A.disable;
      res.disabled = true;
      SF.log(g, t.i.name + ' on ' + p.name + ' disabled by EMP for ' + A.disable + ' cycles.', 'kill');
    }
    if (wid === 'laser' && SF.has(g, 'laser_lance')) {
      const near = p.insts.filter((x) => x.hp > 0 && x !== t.i && !SF.INST[x.type].orbital)
        .sort((a, c) => Math.hypot(a.pos[0] - t.i.pos[0], a.pos[1] - t.i.pos[1]) - Math.hypot(c.pos[0] - t.i.pos[0], c.pos[1] - t.i.pos[1]))[0];
      if (near) { const sd = d * 0.6; damageInst(g, p, near, sd, res); res.collateral.push({ iid: near.id, dmg: sd, sweep: true }); }
    }
    if (A.blast) {
      for (const o of p.insts) {
        if (o === t.i || o.hp <= 0) continue;
        const A2 = SF.INST[o.type];
        let bd = A.blast * (A.mult[A2.armor] || 0);
        if (o.type !== 'shield' && !A2.orbital && SF.shieldUp(p)) bd *= 0.5;
        damageInst(g, p, o, bd, res);
        res.collateral.push({ iid: o.id, dmg: bd });
      }
      p.contamination = clamp(p.contamination + A.contam, 0, 1);
      g.stats.nukes++;
      SF.log(g, 'NUCLEAR DETONATION on ' + p.name + '. Surface contaminated.', 'loss');
    } else if (A.collat > 0) {
      const c = A.collat * (q != null ? 1 - 0.8 * q : 1);
      const others = p.insts.filter((x) => x.hp > 0 && x !== t.i && !SF.INST[x.type].orbital);
      const n = Math.min(others.length, A.collatTargets || 1);
      for (let k = 0; k < n; k++) {
        const idx = Math.floor(rand(g) * others.length);
        const o = others.splice(idx, 1)[0];
        const cd = d * c;
        if (cd < 1) continue;
        damageInst(g, p, o, cd, res);
        res.collateral.push({ iid: o.id, dmg: cd });
      }
    }
    if (A.popLoss && p.pop > 0) {
      const pl = p.pop * A.popLoss * (q != null ? 1 - 0.5 * q : 1);
      p.pop -= pl; g.stats.civilians += pl; res.popLoss += pl;
    }
    if (A.garrisonHit) p.garrisonMod = clamp(p.garrisonMod * (1 - A.garrisonHit), 0, 1);
    p.scorch = clamp(p.scorch + (A.blast ? 0.5 : wid === 'bombard' ? 0.12 : 0.04), 0, 1);
    return res;
  };
})();

// ===== campaign.js =====
// Strategic actions, cycle resolution, enemy pressure, progression, save/load.
(function () {
  const SF = globalThis.SF;
  const { clamp, rand } = SF;

  SF.scan = function (g, pid) {
    const p = SF.planet(g, pid);
    if (!p || p.scanned || p.owner === 'destroyed') return { ok: false, reason: 'NOTHING TO SCAN' };
    if (!SF.pay(g, SF.COSTS.scan)) return { ok: false, reason: 'INSUFFICIENT POWER' };
    p.scanned = true;
    SF.log(g, 'Deep scan of ' + p.name + ' complete: ' + p.insts.length + ' installations identified.', 'info');
    return { ok: true };
  };

  SF.claim = function (g, pid) {
    const p = SF.planet(g, pid);
    if (!p || p.owner !== 'neutral') return { ok: false, reason: 'NOT CLAIMABLE' };
    const c = { power: SF.COSTS.claim.power, metals: SF.COSTS.claim.metals };
    if (!SF.pay(g, c)) return { ok: false, reason: 'INSUFFICIENT RESOURCES' };
    p.owner = 'player'; p.scanned = true;
    g.stats.captured++;
    SF.log(g, p.name + ' claimed. Mining rigs online.', 'gain');
    return { ok: true };
  };

  SF.deploy = function (g, pid, troops) {
    const p = SF.planet(g, pid);
    troops = Math.floor(troops);
    if (!p || p.owner !== 'enemy') return { ok: false, reason: 'NOT HOSTILE' };
    if (SF.planetSys(g, pid) !== g.sysIndex) return { ok: false, reason: 'OUT OF RANGE' };
    if (!p.scanned) return { ok: false, reason: 'SCAN REQUIRED' };
    if (SF.troopsOnSurface(g, pid)) return { ok: false, reason: 'INVASION ALREADY UNDER WAY' };
    if (troops < 1000) return { ok: false, reason: 'COMMIT AT LEAST 1,000' };
    if (troops > g.troops) return { ok: false, reason: 'NOT ENOUGH TROOPS' };
    const f = SF.invasionForecast(g, pid, troops);
    g.troops -= troops;
    g.invasions.push({ pid, sys: g.sysIndex, troops, cycles: f.cycles, startChance: f.chance });
    SF.log(g, SF.fmtInt(troops) + ' troops deploying to ' + p.name + '. Victory chance ' + SF.pct(f.chance) + ', est. ' + f.cycles + ' cycle(s).', 'info');
    return { ok: true, forecast: f };
  };

  SF.capturePlanet = function (g, p) {
    p.owner = 'player';
    p.garrisonMod = 0;
    for (const i of p.insts) { i.disabled = 0; if (SF.INST[i.type].mil) i.hp = Math.min(i.hp, i.maxHp); }
    g.stats.captured++;
    if (p.spoils) {
      // Spoils scale with how intact the world is.
      const k = 0.4 + 0.6 * SF.intactPct(p);
      SF.gain(g, p.spoils, k);
      SF.log(g, p.name + ' CAPTURED. Spoils seized: ' + SF.costText(Object.fromEntries(Object.entries(p.spoils).map(([r, v]) => [r, Math.round(v * k)]))) + '.', 'gain');
    } else SF.log(g, p.name + ' CAPTURED.', 'gain');
  };

  SF.mineUpgradeCost = (i) => (i.level === 1 ? SF.COSTS.mine2 : i.level === 2 ? SF.COSTS.mine3 : null);
  SF.upgradeMine = function (g, pid, iid) {
    const p = SF.planet(g, pid); const i = SF.inst(p, iid);
    if (!p || p.owner !== 'player' || !i || i.type !== 'mine' || i.hp <= 0) return { ok: false, reason: 'INVALID' };
    const c = SF.mineUpgradeCost(i);
    if (!c) return { ok: false, reason: 'MAX LEVEL' };
    if (!SF.pay(g, c)) return { ok: false, reason: 'INSUFFICIENT RESOURCES' };
    i.level++;
    SF.log(g, i.name + ' on ' + p.name + ' upgraded to ' + SF.MINE_NAME[i.level] + '.', 'gain');
    return { ok: true };
  };
  SF.repairCost = (i) => ({ metals: Math.ceil(((i.maxHp - i.hp) / i.maxHp) * 30) });
  SF.repairInst = function (g, pid, iid) {
    const p = SF.planet(g, pid); const i = SF.inst(p, iid);
    if (!p || p.owner !== 'player' || !i || !SF.INST[i.type].econ || i.hp <= 0 || i.hp >= i.maxHp) return { ok: false, reason: 'INVALID' };
    if (!SF.pay(g, SF.repairCost(i))) return { ok: false, reason: 'INSUFFICIENT RESOURCES' };
    i.hp = i.maxHp;
    return { ok: true };
  };

  SF.upgradeState = function (g, uid) {
    const U = SF.UPGRADES[uid];
    if (g.upgrades[uid]) return 'owned';
    if (U.req && !g.upgrades[U.req]) return 'locked';
    return SF.canAfford(g, U.cost) ? 'available' : 'unaffordable';
  };
  SF.buyUpgrade = function (g, uid) {
    const st = SF.upgradeState(g, uid);
    if (st !== 'available') return { ok: false, reason: st.toUpperCase() };
    SF.pay(g, SF.UPGRADES[uid].cost);
    g.upgrades[uid] = g.cycle;
    if (uid === 'fort_modules') { g.fort.shield += 20; g.fort.hull += 40; g.fort.power += 30; }
    if (uid === 'def_armour') g.fort.hull += 60;
    if (uid === 'fort_reactor') g.fort.power += 40;
    SF.log(g, 'FORTRESS UPGRADE: ' + SF.UPGRADES[uid].name + ' installed.', 'gain');
    return { ok: true };
  };

  SF.repairFortress = function (g) {
    const C = SF.COSTS.repair;
    if (g.fort.hull >= SF.hullMax(g)) return { ok: false, reason: 'HULL INTACT' };
    if (!SF.pay(g, { power: C.power, metals: C.metals })) return { ok: false, reason: 'INSUFFICIENT RESOURCES' };
    g.fort.hull = Math.min(SF.hullMax(g), g.fort.hull + C.hull);
    return { ok: true };
  };

  // ------------------------------------------------------------------ planet killer
  SF.pkState = function (g) {
    if (!SF.has(g, 'fort_pk')) return { ok: false, reason: 'INFRASTRUCTURE INCOMPLETE', locked: true };
    if (g.pk.cooldown > 0) return { ok: false, reason: 'RECHARGING: ' + g.pk.cooldown + ' CYCLES' };
    if (!SF.canAfford(g, SF.PK.cost)) return { ok: false, reason: 'INSUFFICIENT EXOTIC MATTER / FISSILE' };
    if (g.fort.power < SF.powerMax(g)) return { ok: false, reason: 'REQUIRES FULL REACTOR OUTPUT' };
    return { ok: true };
  };
  SF.canPlanetKill = function (g, pid) {
    const s = SF.pkState(g);
    if (!s.ok) return s;
    const p = SF.planet(g, pid);
    if (!p || SF.planetSys(g, pid) !== g.sysIndex) return { ok: false, reason: 'NO TARGET' };
    if (p.owner === 'player') return { ok: false, reason: 'FRIENDLY WORLD' };
    if (p.owner === 'destroyed') return { ok: false, reason: 'ALREADY DESTROYED' };
    if (SF.troopsOnSurface(g, pid)) return { ok: false, reason: 'OUR TROOPS ARE ON THE SURFACE' };
    return { ok: true };
  };
  SF.firePlanetKiller = function (g, pid) {
    const c = SF.canPlanetKill(g, pid);
    if (!c.ok) return c;
    const p = SF.planet(g, pid);
    SF.pay(g, SF.PK.cost);
    g.fort.power = 0;
    g.pk.cooldown = SF.PK.cooldown;
    g.pk.fired++;
    g.stats.planetKills++;
    g.stats.civilians += p.pop;
    const lost = SF.valueOf(SF.planetYield(p, true));
    p.pop = 0; p.owner = 'destroyed'; p.garrisonMod = 0;
    for (const i of p.insts) { i.hp = 0; i.disabled = 0; }
    g.stats.destroyed++;
    // Moons of a destroyed world are scoured too, but survive as rubble-claimable? No: they are lost with it.
    SF.log(g, p.name + ' ANNIHILATED. All future value (' + Math.round(lost) + '/cycle) erased.', 'loss');
    return { ok: true, lostValue: lost };
  };

  // ------------------------------------------------------------------ system flow
  SF.enemyWorlds = (g) => SF.curSys(g).planets.filter((p) => p.owner === 'enemy');
  SF.systemSecured = (g) => SF.enemyWorlds(g).length === 0 && SF.curSys(g).fleets.length === 0;
  SF.canJump = (g) => SF.systemSecured(g) && g.sysIndex < SF.CAMPAIGN.length - 1;
  SF.jump = function (g) {
    if (!SF.canJump(g)) return { ok: false, reason: 'SYSTEM NOT SECURED' };
    SF.curSys(g).secured = true;
    g.cycle++;
    SF.enterSystem(g, g.sysIndex + 1);
    g.fort.shield = SF.shieldMax(g);
    g.fort.hull = Math.min(SF.hullMax(g), g.fort.hull + 25);
    g.fort.power = SF.powerMax(g);
    for (const w in g.weapons) { g.weapons[w].shots = 0; g.weapons[w].offline = 0; }
    g.weapons.laser.heat = 0; g.weapons.laser.overheated = 0;
    return { ok: true };
  };

  // Grows every cycle spent in the system: the clock that stops perfect, slow play.
  SF.sectorStrike = function (g) {
    const def = SF.sysDef(g);
    const n = SF.enemyWorlds(g).length;
    if (!n || g.sysIndex === 0) return 0;
    const t = g.cycle - g.sysStartCycle;
    return def.threat * (3 * n + 2.2 * t);
  };

  SF.nextFleetIn = function (g) {
    const sch = SF.sysDef(g).fleets;
    const s = SF.curSys(g);
    if (s.fleetIdx >= sch.length) return null;
    return sch[s.fleetIdx] - (g.cycle - g.sysStartCycle);
  };

  SF.incomeOf = function (g) {
    const inc = { metals: SF.BASE_INCOME.metals, fissile: 0, crystals: 0, exotic: 0, troops: SF.troopRegen(g) };
    for (const s of g.systems) if (s) for (const p of s.planets) if (p.owner === 'player') {
      const y = SF.planetYield(p, false);
      for (const r of SF.RES) inc[r] += y[r];
      inc.troops += y.troops;
    }
    return inc;
  };

  function damageFortress(g, amt, src, report) {
    if (amt <= 0) return;
    const absorbed = Math.min(g.fort.shield, amt);
    g.fort.shield -= absorbed;
    const hull = amt - absorbed;
    g.fort.hull -= hull;
    g.stats.damageTaken += amt;
    report.fortDmg += amt;
    report.hullDmg += hull;
    report.attacks.push({ src, amt });
  }

  // ------------------------------------------------------------------ END CYCLE
  SF.endCycle = function (g) {
    if (g.over) return null;
    const rep = { cycle: g.cycle, fortDmg: 0, hullDmg: 0, attacks: [], invasions: [], income: null, fleetsArrived: [], raids: [], offline: [], events: [] };
    const def = SF.sysDef(g);
    const sys = SF.curSys(g);

    // 1. Invasions resolve.
    for (const iv of g.invasions.slice()) {
      iv.cycles--;
      if (iv.cycles > 0) continue;
      const p = SF.planet(g, iv.pid);
      g.invasions.splice(g.invasions.indexOf(iv), 1);
      if (p.owner !== 'enemy') { g.troops += iv.troops; continue; }
      const f = SF.invasionForecast(g, iv.pid, iv.troops);
      const win = (g.tutorial.active && !g.tutorial.done) || rand(g) < f.chance;
      let loss = win ? f.lossWin * (0.8 + rand(g) * 0.4) : f.lossLose * (0.85 + rand(g) * 0.3);
      loss = Math.min(iv.troops, Math.round(loss / 100) * 100);
      g.troops += iv.troops - loss;
      g.stats.troopsLost += loss;
      if (win) SF.capturePlanet(g, p);
      else { p.garrisonMod = clamp(p.garrisonMod * 0.7, 0, 1); SF.log(g, 'INVASION OF ' + p.name + ' REPULSED. ' + SF.fmtInt(loss) + ' troops lost.', 'loss'); }
      rep.invasions.push({ pid: p.id, win, loss, troops: iv.troops });
    }

    // 2. Enemy defences fire on the fortress.
    const pd = SF.has(g, 'def_pd') ? 0.6 : 1;
    for (const p of sys.planets) {
      if (p.owner !== 'enemy') continue;
      const eff = SF.powerEff(p);
      let dmg = 0;
      for (const i of p.insts) {
        if (!SF.activeInst(i) || !i.fortDmg) continue;
        const f = i.hp / i.maxHp;
        if (i.type === 'cannon') dmg += i.fortDmg * f * eff;
        else if (i.type === 'station') dmg += i.fortDmg * f;
        else if (i.type === 'silo' && (g.cycle - g.sysStartCycle) % 2 === 1) dmg += i.fortDmg * f * pd;
      }
      dmg *= def.threat;
      if (dmg > 0) damageFortress(g, dmg, p.name, rep);
    }

    // 2b. Sector command: escalating long-range strikes while any enemy world holds out.
    const holdouts = SF.enemyWorlds(g).length;
    if (holdouts) {
      const dmg = SF.sectorStrike(g);
      if (dmg > 0) damageFortress(g, dmg * pd, 'Sector Command long-range strike', rep);
    }

    // 3. Fleets: arrive, attack, raid.
    for (const fl of sys.fleets) {
      if (fl.eta > 0) { fl.eta--; if (fl.eta === 0) { rep.fleetsArrived.push(fl.id); SF.log(g, fl.name + ' has reached engagement range!', 'warn'); } continue; }
      const mine = sys.planets.filter((p) => p.owner === 'player' && p.insts.some((i) => i.type === 'mine' && i.hp > 0));
      if (mine.length && rand(g) < 0.35) {
        const p = mine[Math.floor(rand(g) * mine.length)];
        const ms = p.insts.filter((i) => i.type === 'mine' && i.hp > 0);
        const m = ms[Math.floor(rand(g) * ms.length)];
        m.hp = Math.max(0, m.hp - 35);
        rep.raids.push({ pid: p.id, iid: m.id });
        SF.log(g, fl.name + ' raided ' + p.name + ': ' + m.name + (m.hp <= 0 ? ' destroyed.' : ' damaged.'), 'loss');
      } else damageFortress(g, fl.dmg * pd, fl.name, rep);
    }

    // 4. Module damage when the hull takes real hits.
    if (rep.hullDmg >= 8 && !SF.has(g, 'def_armour') && rand(g) < 0.35) {
      const cand = SF.WEAPON_ORDER.filter((w) => !SF.WEAPONS[w].req || SF.has(g, SF.WEAPONS[w].req));
      const w = cand[Math.floor(rand(g) * cand.length)];
      g.weapons[w].offline = 2; // ticks down below, leaving 1 full cycle offline
      rep.offline.push(w);
      SF.log(g, 'HULL BREACH: ' + SF.WEAPONS[w].name + ' knocked offline for a cycle.', 'warn');
    }

    // 5. Enemy repairs and reinforcement.
    for (const p of sys.planets) {
      if (p.owner !== 'enemy') continue;
      const organised = p.insts.some((i) => (i.type === 'industry' || i.type === 'hq') && SF.activeInst(i));
      if (organised) for (const i of p.insts) if (i.hp > 0 && i.hp < i.maxHp && !SF.troopsOnSurface(g, p.id)) i.hp = Math.min(i.maxHp, i.hp + i.maxHp * 0.08);
      p.garrisonMod = clamp(p.garrisonMod + (organised ? 0.06 : 0.03), 0, organised ? 1.35 : 1.15);
      for (const i of p.insts) if (i.disabled > 0) i.disabled--;
    }

    // 6. New fleets.
    const rel = g.cycle - g.sysStartCycle + 1;
    if (sys.fleetIdx < def.fleets.length && rel >= def.fleets[sys.fleetIdx] && SF.enemyWorlds(g).length) {
      sys.fleetIdx++;
      const n = sys.fleetIdx;
      const fl = { id: def.id + '-f' + n, name: 'Strike Group ' + ['Aster', 'Blade', 'Cinder', 'Dirge', 'Ember', 'Fury', 'Gale', 'Hex', 'Iron', 'Jackal'][(n - 1) % 10], hp: Math.round(260 * def.threat), maxHp: Math.round(260 * def.threat), eta: 2, dmg: Math.round(24 * def.threat), angle: rand(g) * Math.PI * 2 };
      sys.fleets.push(fl);
      rep.events.push('fleet');
      SF.log(g, 'ENEMY FLEET DETECTED: ' + fl.name + ' inbound, ETA 2 cycles.', 'warn');
    }

    // 7. Income + recovery.
    const inc = SF.incomeOf(g);
    for (const r of SF.RES) g.res[r] += inc[r];
    g.troops = Math.min(SF.troopCap(g), g.troops + inc.troops);
    rep.income = inc;
    g.fort.shield = Math.min(SF.shieldMax(g), g.fort.shield + SF.shieldRegen(g));
    g.fort.power = SF.powerMax(g);
    for (const w in g.weapons) { const ws = g.weapons[w]; ws.shots = 0; if (ws.offline > 0) ws.offline--; }
    const L = g.weapons.laser;
    if (L.overheated > 0) { L.overheated--; L.heat = 60; } else L.heat = Math.max(0, L.heat - SF.laserCooling(g));
    if (g.pk.cooldown > 0) g.pk.cooldown--;
    for (const r of SF.RES) g.res[r] = Math.max(0, g.res[r]);

    g.cycle++;
    // 8. Win / lose.
    if (g.fort.hull <= 0) {
      g.fort.hull = 0; g.over = 'lose';
      SF.log(g, 'FORTRESS LOST. Reactor containment failed.', 'loss');
    } else if (def.final && SF.enemyWorlds(g).length === 0) {
      g.over = 'win';
      SF.log(g, 'THE PALE THRONE HAS FALLEN.', 'gain');
    }
    return rep;
  };

  // The final system is won as soon as its enemy worlds are gone (even mid-cycle via Planet Killer).
  SF.checkVictory = function (g) {
    if (!g.over && SF.sysDef(g).final && SF.enemyWorlds(g).length === 0) { g.over = 'win'; SF.log(g, 'THE PALE THRONE HAS FALLEN.', 'gain'); }
    return g.over;
  };

  SF.score = function (g) {
    let intact = 0, worlds = 0;
    for (const s of g.systems) if (s) for (const p of s.planets) if (p.owner === 'player') { worlds++; intact += SF.valueOf(SF.planetYield(p, false)); }
    return { worlds, income: Math.round(intact), troopsLost: g.stats.troopsLost, civilians: g.stats.civilians, destroyed: g.stats.destroyed, cycles: g.cycle - 1 };
  };

  // ------------------------------------------------------------------ save / load
  SF.SAVE_KEY = 'spacefortress.save.v1';
  SF.serialize = (g) => JSON.stringify(g);
  SF.deserialize = function (s) {
    const g = JSON.parse(s);
    if (!g || g.v !== 1 || !Array.isArray(g.systems) || !g.res) throw new Error('Incompatible save');
    return g;
  };
})();

// ===== tutorial.js =====
// Guided first session. Steps are pure predicates over (game, ui) so they are testable.
// ui = { selected, selectedInst, weapon, mode, ack } — supplied by the UI layer.
(function () {
  const SF = globalThis.SF;
  const varn = (g) => SF.planet(g, 'varn');
  const cannon = (g) => varn(g).insts.find((i) => i.type === 'cannon');
  SF.TUTORIAL = [
    { id: 'select', title: 'SELECT A TARGET WORLD', text: 'This is Varn II, a weakly held mining colony. Click it on the tactical display.', hl: 'planet:varn',
      done: (g, ui) => ui.selected === 'varn' },
    { id: 'scan', title: 'SCAN THE WORLD', text: 'You know nothing about its defences yet. Run a deep scan (10 power).', hl: '#act-scan',
      done: (g) => varn(g).scanned },
    { id: 'identify', title: 'IDENTIFY THE THREAT', text: 'The scan found an Anti-Orbital Cannon. It shoots at the fortress and at your dropships. Select it.', hl: 'inst:cannon',
      done: (g, ui) => ui.selectedInst === cannon(g).id || cannon(g).hp <= 0 },
    { id: 'weapon', title: 'ARM THE RAILGUN', text: 'Armoured targets call for precision. Select the RAILGUN.', hl: '#w-railgun',
      done: (g, ui) => ui.weapon === 'railgun' || cannon(g).hp <= 0 },
    { id: 'manual', title: 'TAKE MANUAL CONTROL', text: 'Auto-fire is quick. Manual control is slower but more accurate and does more damage. Press MANUAL.', hl: '#fire-manual',
      done: (g, ui) => ui.mode === 'manual' || cannon(g).hp <= 0 },
    { id: 'destroy', title: 'DESTROY THE CANNON', text: 'Follow the procedure on the console: load, lock, aim, cool, charge, release the safety, then FIRE.', hl: null,
      done: (g) => cannon(g).hp <= 0 },
    { id: 'deploy', title: 'DEPLOY GROUND FORCES', text: 'With the gun gone, a landing costs far fewer lives. Check the forecast and press DEPLOY TROOPS.', hl: '#act-deploy',
      done: (g) => g.invasions.some((iv) => iv.pid === 'varn') || varn(g).owner === 'player' },
    { id: 'capture', title: 'END THE CYCLE', text: 'Troops fight while the cycle turns. Enemy guns fire, income arrives. Press END CYCLE.', hl: '#btn-end',
      done: (g) => varn(g).owner === 'player' },
    { id: 'income', title: 'MINING INCOME', text: 'Varn II is yours, with its mine intact. Captured mines pay out every cycle. Destroyed mines never do. Preserve what you want to own.', hl: '#res-bar',
      done: (g, ui) => !!ui.ack },
    { id: 'upgrade', title: 'UPGRADE THE FORTRESS', text: 'Spend the spoils. Open FORTRESS ENGINEERING and install your first upgrade.', hl: '#btn-fortress',
      done: (g) => Object.keys(g.upgrades).length > 0 },

// ===== bot.js =====
// Headless autoplayer used by tests and the balance report. Not loaded for players' decisions.
(function () {
  const SF = globalThis.SF;
  const PRIORITY = ['shield', 'cannon', 'station', 'interceptor', 'power', 'silo', 'barracks', 'hq', 'bunker'];
  const UPG = {
    precision: ['rail_caps', 'troop_bay', 'laser_unlock', 'fort_reactor', 'mis_smart', 'def_pd', 'rail_heavy', 'troop_pods', 'laser_cool', 'fort_modules', 'rail_twin', 'def_armour', 'mis_nuke', 'laser_lance', 'fort_pk'],
    nuke: ['rail_caps', 'mis_smart', 'fort_reactor', 'mis_nuke', 'troop_bay', 'def_pd', 'laser_unlock', 'fort_modules', 'rail_heavy', 'def_armour', 'rail_twin', 'fort_pk'],
    pk: ['rail_caps', 'troop_bay', 'fort_reactor', 'laser_unlock', 'mis_smart', 'def_pd', 'fort_modules', 'rail_heavy', 'fort_pk', 'troop_pods', 'laser_cool', 'rail_twin', 'def_armour'],
  };
  function bestShot(g, p, strat) {
    let best = null;
    const targets = p.insts.filter((i) => i.hp > 0 && (SF.INST[i.type].mil || strat === 'brute'));
    for (const w of SF.WEAPON_ORDER) for (const a of Object.keys(SF.WEAPONS[w].ammo)) {
      if (a === 'nuke' && strat !== 'nuke') continue;
      for (const i of targets) {
        if (!SF.canFire(g, w, a, p.id, i.id).ok) continue;
        const pv = SF.attackPreview(g, w, a, p.id, i.id, strat === 'manual' ? 0.85 : null);
        const pri = PRIORITY.indexOf(i.type);
        let s = pv.land * Math.min(pv.frac, 1.2) * 100 - (pri < 0 ? 30 : pri * 3) - pv.collat * 40;
        if (a === 'nuke') s += 80;
        if (!best || s > best.s) best = { s, w, a, iid: i.id };
      }
    }
    return best;
  }
  SF.botTurn = function (g, strat) {
    strat = strat || 'precision';
    const sys = SF.curSys(g);
    const q = strat === 'manual' ? 0.85 : null;
    if (strat === 'pk') {
      // Fire before spending any power: the chamber needs full reactor output.
      const tgt = SF.enemyWorlds(g).filter((p) => !SF.troopsOnSurface(g, p.id)).sort((a, b) => SF.enemyGround(b) * SF.defenceMult(b) - SF.enemyGround(a) * SF.defenceMult(a))[0];
      if (tgt && SF.canPlanetKill(g, tgt.id).ok) SF.firePlanetKiller(g, tgt.id);
      SF.checkVictory(g);
      if (g.over) return 'win';
    }
    for (const p of sys.planets) { if (!p.scanned && p.owner === 'enemy') SF.scan(g, p.id); if (p.owner === 'neutral') SF.claim(g, p.id); }
    if (g.fort.hull < SF.hullMax(g) * 0.5) SF.repairFortress(g);
    for (const u of UPG[strat] || UPG.precision) if (SF.upgradeState(g, u) === 'available' && (u === 'fort_pk' || g.res.metals - SF.UPGRADES[u].cost.metals > 15)) SF.buyUpgrade(g, u);
    // Fleets first (railgun loves warships).
    for (const fl of sys.fleets.slice()) for (const w of ['railgun', 'missile', 'laser']) {
      const a = Object.keys(SF.WEAPONS[w].ammo)[0];
      if (SF.canFire(g, w, a, 'fleet:' + fl.id).ok) SF.fire(g, w, a, 'fleet:' + fl.id, null, { manual: q });
    }
    const enemies = SF.enemyWorlds(g).filter((p) => !SF.troopsOnSurface(g, p.id));
    for (let guard = 0; guard < 12; guard++) {
      let fired = false;
      for (const p of enemies) {
        if (SF.invasionForecast(g, p.id, g.troops).chance > 0.93) continue;
        const b = bestShot(g, p, strat);
        if (b && b.s > 5) { SF.fire(g, b.w, b.a, p.id, b.iid, { manual: q }); fired = true; break; }
      }
      if (!fired) break;
    }
    for (const p of enemies) {
      const t = SF.suggestTroops(g, p.id, 0.85);
      const f = SF.invasionForecast(g, p.id, t);
      if (f.chance >= 0.8 && t <= g.troops && (f.expLoss < g.troops * 0.5 || g.troops > 60000)) SF.deploy(g, p.id, t);
    }
    for (const s of g.systems) if (s) for (const p of s.planets) if (p.owner === 'player') for (const i of p.insts) if (i.type === 'mine' && i.hp > 0 && g.res.metals > 140) SF.upgradeMine(g, p.id, i.id);
    if (SF.canJump(g)) { SF.jump(g); return 'jump'; }
    SF.endCycle(g);
    return 'end';
  };
  SF.botPlay = function (g, strat, maxCycles) {
    maxCycles = maxCycles || 200;
    while (!g.over && g.cycle < maxCycles) SF.botTurn(g, strat);
    return g;
  };
})();

  // ------------------------------------------------------------ planet sphere
  const cache = new Map();
  ART.planetSig = function (p) {

  // Returns a canvas with a lit sphere (light from direction lx,ly in screen space).
  ART.planetImage = function (p, diam, lx, ly) {
    diam = Math.max(16, Math.min(420, Math.round(diam / 8) * 8));

  function renderPlanet(p, D, lx, ly) {
    const cv = document.createElement('canvas');
    cv.width = cv.height = D;
    const ctx = cv.getContext('2d');
    const img = ctx.createImageData(D, D);
    const d = img.data;
    const s = seedOf(p.id);
    const R = D / 2;
    const type = p.type;
    const pal = PAL[type] || PAL.rocky;
    // light vector (screen x right, y down, z toward viewer)
    let L = [lx * 0.85, ly * 0.85, 0.5]; const ln = Math.hypot(...L); L = L.map((v) => v / ln);
    const craters = p.insts.filter((i) => i.hp <= 0 && !SF.INST[i.type].orbital).map((i) => i.pos);
    const sites = p.insts.filter((i) => !SF.INST[i.type].orbital).map((i) => i.pos);
    const populated = p.pop > 0.05 || type === 'capital';
    for (let y = 0; y < D; y++) for (let x = 0; x < D; x++) {
      const nx = (x + 0.5 - R) / R, ny = (y + 0.5 - R) / R;
      const r2 = nx * nx + ny * ny;
      const o = (y * D + x) * 4;
      if (r2 > 1) { d[o + 3] = 0; continue; }
      const nz = Math.sqrt(1 - r2);
      const f = type === 'gas' ? 2.2 : type === 'moon' || type === 'rocky' ? 3.2 : 2.6;
      let h;
      if (type === 'gas') {
        const tw = fbm(nx * 3, ny * 3, nz * 3, s, 4);
        h = 0.5 + 0.5 * Math.sin(ny * 14 + tw * 5);
      } else h = fbm(nx * f + 11, ny * f + 3, nz * f, s, 5);
      let col = ramp(pal, h).slice();
      // craters on airless worlds
      if (type === 'moon' || type === 'rocky' || type === 'asteroid') {
        const cr = vnoise(nx * 9, ny * 9, nz * 9, s + 99);
        if (cr > 0.78) col = lerpC(col, [40, 40, 44], (cr - 0.78) * 3);
      }
      if (type === 'terran' || type === 'capital') {
        const cl = fbm(nx * 4 + 40, ny * 6, nz * 4, s + 5, 4);
        if (Math.abs(ny) > 0.86) col = lerpC(col, [240, 245, 250], 0.85);
        if (cl > 0.55) col = lerpC(col, [245, 248, 252], Math.min(1, (cl - 0.55) * 3) * 0.8);
      }
      if (type === 'fortress') {
        const gx = Math.abs(Math.sin(nx * 30)), gy = Math.abs(Math.sin(ny * 30));
        if (gx < 0.08 || gy < 0.08) col = lerpC(col, [20, 22, 26], 0.6);
      }
      // installation scars: darkened craters with glowing embers
      let ember = 0;
      for (const c of craters) {
        const dd = Math.hypot(nx - c[0], ny - c[1]);
        if (dd < 0.2) { const k = 1 - dd / 0.2; col = lerpC(col, [18, 12, 10], k * 0.9); if (dd < 0.07) ember = Math.max(ember, 1 - dd / 0.07); }
      }
      if (p.scorch > 0) {
        const sc = fbm(nx * 5 + 3, ny * 5, nz * 5, s + 31, 3);

      }
      if (p.contamination > 0) {

  }

  // ------------------------------------------------------------ fortress

    const pts = {};

    c.save(); c.translate(-90, 0);
    c.lineWidth = 16;

      D._viewPlanet = { id: p.id, cx, cy, r };

      I().stencil(c, p.owner === 'enemy' ? (p.scanned ? 'HOSTILE' : 'UNSCANNED') : p.owner.toUpperCase(), cx, cy + r * 0.72 + 40, 12, '#8aa', 'center');

    c.lineWidth = 2; c.strokeStyle = 'rgba(150,180,210,0.12)';

    const q1 = win.x0 + (win.x1 - win.x0) * 0.33, q2 = win.x0 + (win.x1 - win.x0) * 0.66;

  }

(function () {
  const SF = globalThis.SF;
  const ST = (SF.stations = {
    current: 'deck',
    trans: null,       // { from, to, t, dur, kind }
    STATIONS: [
      { id: 'deck', name: 'COMMAND DECK', short: 'DECK', key: 'C' },
      { id: 'tactical', name: 'TACTICAL TABLE', short: 'TACTICAL', key: 'T' },
      { id: 'railgun', name: 'RAILGUN CONTROL', short: 'RAILGUN', key: 'R' },
      { id: 'engineering', name: 'ENGINEERING', short: 'ENGINEER', key: 'U' },
      { id: 'pk', name: 'ANNIHILATION CHAMBER', short: 'PLANET KILLER', key: 'K' },
    ],
  });

  ST.is = (id) => ST.current === id && !ST.trans;

  // Enter a station. For railgun/pk/engineering we trigger their existing views but keep
  // 'current' pointed at the station the player physically occupies.
  ST.go = function (id, opts) {
    opts = opts || {};
    const UI = SF.ui, G = SF.game;
    if (!G) return;
    if (id === ST.current && !opts.force) return;
    SF.audio.init();

    if (id === 'railgun') {
      // The railgun console is a full weapon operation; needs a target.
      const t = UI.targetRef ? UI.targetRef() : null;
      if (!t || (t.pid && t.pid.startsWith('fleet')) || !t.iid) {
        // No valid surface target: go to tactical so the player can pick one.
        SF.ui.toast('Select an enemy installation at the tactical table first.', 'loss');
        return ST.go('tactical');
      }
      const chk = SF.canFire(G, 'railgun', UI.ammo.railgun, t.pid, t.iid);
      if (!chk.ok) { SF.audio.deny(); SF.ui.toast(chk.reason, 'loss'); return; }
      UI.weapon = 'railgun'; UI.mode = 'manual';
      SF.tutorialAdvance(G, UI);
      transitionThen('railgun', () => SF.manual.open(t.pid, t.iid, UI.ammo.railgun));
      return;
    }
    if (id === 'pk') {
      const pid = opts.pid || UI.selected;
      const c = SF.canPlanetKill(G, pid);
      if (!c.ok) {
        if (SF.pkState(G).locked) { SF.ui.toast('PLANET KILLER — authorization denied. Infrastructure incomplete.', 'loss'); SF.audio.deny(); return; }
        SF.ui.toast(c.reason, 'loss'); SF.audio.deny(); return;
      }
      transitionThen('pk', () => SF.pkMode.open(pid));
      return;
    }
    if (id === 'engineering') {
      transitionThen('tactical', () => { ST.current = ST.prevFor(); SF.ui.openFortress(); });
      return;
    }
    // deck <-> tactical: canvas stations
    transition(ST.current, id);
  };
  ST.prevFor = function () { return ST.beforeStation || 'deck'; };

  function transition(from, to) {
    ST.beforeStation = from;
    ST.trans = { from, to, t: 0, dur: 0.55, kind: to === 'tactical' ? 'descend' : from === 'tactical' ? 'ascend' : 'slide' };
    SF.audio.servoSlide && SF.audio.servoSlide();
    SF.fx.shake(2, 0.3);
  }
  // Transition to a canvas station, then run a callback (used to open a console mid-wipe).
  function transitionThen(canvasStation, cb) {
    ST.beforeStation = ST.current;
    ST.trans = { from: ST.current, to: canvasStation, t: 0, dur: 0.4, kind: 'door', cb, fired: false };
    SF.audio.servoSlide && SF.audio.servoSlide();
  }

  // Advance transition; returns wipe alpha 0..1 for the renderer to draw over the frame.
  ST.update = function (dt) {
    const tr = ST.trans;
    if (!tr) return;
    tr.t += dt;
    const half = tr.dur / 2;
    if (tr.t >= half && tr.from !== tr.to) { ST.current = tr.to; tr.from = tr.to; ST.applyDOM(); }
    if (tr.cb && !tr.fired && tr.t >= half) { tr.fired = true; tr.cb(); }
    if (tr.t >= tr.dur) ST.trans = null;
  };
  // 0 at ends, 1 at midpoint — how "covered" the screen is.
  ST.wipe = function () {
    const tr = ST.trans; if (!tr) return 0;
    const k = tr.t / tr.dur;
    return 1 - Math.abs(k - 0.5) * 2;
  };
  ST.transKind = () => (ST.trans ? ST.trans.kind : null);

  // Which canvas station is being shown right now (deck or tactical).
  ST.activeCanvas = function () {
    const c = ST.trans ? ST.trans.to : ST.current;
    return c === 'deck' || c === 'tactical' ? c : (ST.beforeStation === 'deck' ? 'deck' : 'tactical');
  };

  // Build the physical station selector (chunky metal tabs) once.
  ST.buildBar = function () {
    const bar = document.getElementById('stationbar');
    if (!bar || bar.childElementCount) return;
    for (const s of ST.STATIONS) {
      const b = document.createElement('button');
      b.className = 'stn'; b.dataset.stn = s.id;
      b.innerHTML = `<span class="stn-lamp"></span><span class="stn-name">${s.short}</span><span class="stn-key">${s.key}</span>`;
      b.onclick = () => ST.go(s.id);
      bar.appendChild(b);
    }
  };

  // Reflect current station in the DOM: highlight tab, show/hide the tactical HUD groups.
  ST.applyDOM = function () {
    ST.buildBar();
    const onDeck = ST.activeCanvas() === 'deck';
    const G = SF.game;
    document.querySelectorAll('#stationbar .stn').forEach((b) => {
      const id = b.dataset.stn;
      b.classList.toggle('active', id === ST.current || (id === 'tactical' && !onDeck) || (id === 'deck' && onDeck));
      let avail = true, armed = false;
      if (id === 'railgun') { const t = SF.ui.targetRef && SF.ui.targetRef(); avail = !!(t && t.iid); armed = avail && G && SF.weaponState(G, 'railgun').ok; }
      if (id === 'pk') { avail = G && !SF.pkState(G).locked; armed = G && SF.pkState(G).ok; }
      b.classList.toggle('avail', avail);
      b.classList.toggle('armed', armed);
    });
    // HUD groups that belong to the tactical table only
    for (const gid of ['objective', 'log', 'panel', 'dock']) {
      const el = document.getElementById(gid);
      if (el) el.classList.toggle('deck-hidden', onDeck);
    }
    const deckHud = document.getElementById('deckhud');
    if (deckHud) deckHud.classList.toggle('hidden', !onDeck);
    const tb = document.getElementById('topbar');
    if (tb) tb.classList.toggle('deckmode', onDeck);
    SF.render && SF.render.layout && SF.render.layout();
  };
})();

      h += `<div class="sec"><div class="sec-title" style="color:#e9a6ff"><span>PLANET KILLER</span></div><div class="hint">Destroys ${esc(p.name)} completely. Future value lost: <b style="color:#ff8a7a">${Math.round(value)}/cycle</b>${p.pop > 0.01 ? ', population: <b style="color:#ff8a7a">' + (p.pop >= 1 ? p.pop.toFixed(1) + ' million' : Math.round(p.pop * 1000) + ' thousand') + '</b>' : ''}.</div><div class="actions"><button class="btn btn-alert" id="act-pk" ${ok.ok ? '' : 'disabled'}>${ok.ok ? 'OPEN ANNIHILATION CHAMBER' : esc(ok.reason)}</button></div></div>`;
    }
    return h;
  }

  function assaultBox(G, p) {
    const onSurface = G.invasions.find((iv) => iv.pid === p.id);
    if (onSurface) {
      const f = SF.invasionForecast(G, p.id, onSurface.troops);
      return `<div class="sec"><div class="sec-title"><span>GROUND ASSAULT · IN PROGRESS</span></div><div class="inv-box">
        <div class="inv-big"><div><div class="k">TROOPS DOWN</div><div class="v">${SF.fmtK(onSurface.troops)}</div></div><div><div class="k">VICTORY</div><div class="v" style="color:${f.chance > 0.7 ? '#7dffb0' : f.chance > 0.45 ? '#ffd27a' : '#ff6a4d'}">${SF.pct(f.chance)}</div></div><div><div class="k">RESOLVES</div><div class="v">${onSurface.cycles}c</div></div></div>
        <div class="chance-bar"><i style="width:${f.chance * 100}%"></i></div>
        <div class="hint">Keep hitting defences with precision weapons to support the landing. Heavy bombardment and nukes are locked while our troops are down there.</div></div></div>`;
    }
    const maxT = Math.floor(G.troops / 1000) * 1000;
    if (UI.troops[p.id] == null) UI.troops[p.id] = Math.min(maxT, SF.suggestTroops(G, p.id, 0.85));
    UI.troops[p.id] = Math.min(UI.troops[p.id], maxT);
    const T = UI.troops[p.id];
    const f = SF.invasionForecast(G, p.id, T);
    const delta = UI.chanceDelta[p.id];
    const eff = SF.powerEff(p);
    const fac = [];
    if (SF.shieldUp(p)) fac.push(`Shield <b>+${Math.round(45 * eff)}%</b>`);
    const can = p.insts.filter((i) => i.type === 'cannon' && SF.activeInst(i));
    if (can.length) fac.push(`${can.length} Cannon${can.length > 1 ? 's' : ''} <b>+${Math.round(can.reduce((s, i) => s + 15 * (i.hp / i.maxHp) * eff, 0))}%</b>`);
    const hq = p.insts.filter((i) => i.type === 'hq' && SF.activeInst(i));
    if (hq.length) fac.push(`Command <b>+${Math.round(hq.reduce((s, i) => s + 30 * (i.hp / i.maxHp), 0))}%</b>`);
    const stn = p.insts.filter((i) => i.type === 'station' && SF.activeInst(i));
    if (stn.length) fac.push(`Orbital <b>+${stn.length * 10}%</b>`);
    if (p.garrisonMod > 1.01) fac.push(`Reinforced <b>+${Math.round((p.garrisonMod - 1) * 100)}%</b>`);
    if (p.garrisonMod < 0.99) fac.push(`Garrison shaken <b style="color:#7dffb0">-${Math.round((1 - p.garrisonMod) * 100)}%</b>`);
    const dl = (k) => (delta && Math.abs(delta[k]) > 0.005 ? `<div class="delta" style="color:${(k === 'chance' ? delta[k] > 0 : delta[k] < 0) ? '#7dffb0' : '#ff8a7a'}">${delta[k] > 0 ? '▲' : '▼'} ${k === 'chance' ? Math.round(Math.abs(delta[k]) * 100) + '%' : SF.fmtK(Math.abs(delta[k]))}</div>` : '<div class="delta">&nbsp;</div>');
    return `<div class="sec"><div class="sec-title"><span>GROUND ASSAULT FORECAST</span><span class="label">ENEMY ${SF.fmtK(f.enemy)} EFFECTIVE</span></div><div class="inv-box">
      <div class="label">COMMIT TROOPS: <b class="num" style="color:#e8dca0" id="troop-val">${SF.fmtInt(T)}</b> of ${SF.fmtInt(G.troops)}</div>
      <input type="range" id="troop-slider" min="1000" max="${Math.max(1000, maxT)}" step="1000" value="${T}" ${maxT < 1000 ? 'disabled' : ''}>
      <div class="inv-big"><div><div class="k">VICTORY</div><div class="v" style="color:${f.chance > 0.7 ? '#7dffb0' : f.chance > 0.45 ? '#ffd27a' : '#ff6a4d'}">${SF.pct(f.chance)}</div>${dl('chance')}</div>
        <div><div class="k">EXP. LOSSES</div><div class="v" style="color:#ffb38a">${SF.fmtK(f.expLoss)}</div>${dl('loss')}</div>
        <div><div class="k">CAPTURE</div><div class="v">${f.cycles}c</div><div class="delta">&nbsp;</div></div></div>
      <div class="chance-bar"><i style="width:${f.chance * 100}%"></i></div>
      ${fac.length ? `<div class="factors">Defence bonuses: ${fac.join(' · ')}</div>` : '<div class="factors" style="color:#7dffb0">No defence bonuses left. The garrison stands alone.</div>'}
      <div class="actions"><button class="btn btn-ok btn-big" id="act-deploy" ${T > G.troops || T < 1000 ? 'disabled' : ''}>⚑ DEPLOY TROOPS</button></div>
      <div class="hint">${advice(G, p, f)}</div></div></div>`;
  }

  function advice(G, p, f) {
    if (SF.shieldUp(p)) return 'The shield blunts every surface strike and stiffens the defence. The <b>Shield Generator</b> itself is exposed: hit it with the railgun (or an EMP missile).';
    if (p.insts.some((i) => i.type === 'cannon' && SF.activeInst(i))) return 'Anti-orbital cannons shred dropships and shell the fortress. Silence them first.';
    if (f.chance < 0.6) return 'The garrison is strong. Bombard its barracks to save soldiers, at the cost of collateral damage.';
    if (f.expLoss < 3000) return 'A cheap landing. Capture it intact.';
    return 'Weigh it up: more strikes save soldiers but cost value and time.';
  }

  function bindPanel(G) {
    const el = $('panel');
    el.querySelectorAll('[data-inst]').forEach((r) => (r.onclick = () => {
      const p = SF.planet(G, UI.selected);
      const i = SF.inst(p, r.dataset.inst);
      if (!i || p.owner !== 'enemy' || UI.vhp(i) <= 0) return;
      UI.selectedInst = i.id; SF.audio.ui(); UI.afterAction();
    }));
    el.querySelectorAll('[data-mine]').forEach((b) => (b.onclick = () => { const r = SF.upgradeMine(G, UI.selected, b.dataset.mine); r.ok ? SF.audio.confirm() : (SF.audio.deny(), UI.toast(r.reason, 'loss')); UI.afterAction(); }));
    el.querySelectorAll('[data-repair]').forEach((b) => (b.onclick = () => { const r = SF.repairInst(G, UI.selected, b.dataset.repair); r.ok ? SF.audio.confirm() : (SF.audio.deny(), UI.toast(r.reason, 'loss')); UI.afterAction(); }));
    const scan = $('act-scan');
    if (scan) scan.onclick = () => {
      const r = SF.scan(G, UI.selected);
      if (!r.ok) { SF.audio.deny(); UI.toast(r.reason, 'loss'); return; }
      SF.audio.beep(660); setTimeout(() => SF.audio.beep(990), 120); setTimeout(() => SF.audio.confirm(), 300);
      UI.scanFx = { pid: UI.selected, t: 0 };
      const p = SF.planet(G, UI.selected);
      UI.lastChance[p.id] = null;
      if (SF.shieldUp(p)) UI.advise('shield', 'A planetary shield. While its generator stands, everything else on the surface takes far less damage.');
      UI.afterAction();
    };
    const claim = $('act-claim');
    if (claim) claim.onclick = () => { const r = SF.claim(G, UI.selected); if (r.ok) { SF.audio.capture(); UI.toast(SF.planet(G, UI.selected).name + ' CLAIMED', 'gain'); } else { SF.audio.deny(); UI.toast(r.reason, 'loss'); } UI.afterAction(); };
    const sl = $('troop-slider');
    if (sl) sl.oninput = () => { UI.troops[UI.selected] = +sl.value; UI.chanceDelta[UI.selected] = null; renderPanel(); SF.audio.ratchet(); };
    const dep = $('act-deploy');
    if (dep) dep.onclick = () => {
      const r = SF.deploy(G, UI.selected, UI.troops[UI.selected]);
      if (!r.ok) { SF.audio.deny(); UI.toast(r.reason, 'loss'); return; }
      SF.audio.clunk(true); setTimeout(() => SF.audio.missile(4), 200);
      UI.toast('⚑ ' + SF.fmtInt(UI.troops[UI.selected]) + ' troops dropping on ' + SF.planet(G, UI.selected).name, 'gain');
      UI.afterAction();
    };
    const pk = $('act-pk');
    if (pk) pk.onclick = () => SF.stations.go("pk", { pid: UI.selected });
  }

  // ------------------------------------------------------------------ dock
  function targetRef() {
    if (UI.selectedFleet) return { pid: 'fleet:' + UI.selectedFleet, iid: null };
    if (UI.selected && UI.selectedInst) return { pid: UI.selected, iid: UI.selectedInst };
    return null;
  }
  UI.targetRef = targetRef;

  function renderDock() {
    const G = g();
    const t = targetRef();
    let h = '';
    for (const w of SF.WEAPON_ORDER) {
      const W = SF.WEAPONS[w];
      const st = SF.weaponState(G, w);
      const sel = UI.weapon === w;
      const ws = G.weapons[w];
      const locked = st.locked;
      let status;
      if (locked) status = `<span class="notready">NOT INSTALLED · ${esc(SF.UPGRADES[W.req].name)}</span>`;
      else status = (st.ok ? '<span class="ready">● READY</span>' : `<span class="notready">● ${esc(st.reason)}</span>`) + ` · ${SF.weaponPower(G, w)}⚡` + (w !== 'laser' ? ` · ${SF.perCycle(G, w) - ws.shots}/${SF.perCycle(G, w)}` : '');
      let ammo = '';
      if (!locked) {
        ammo = '<div class="ammo">';
        for (const a of Object.keys(W.ammo)) {
          const A = W.ammo[a]; const un = SF.ammoUnlocked(G, a === undefined ? '' : w, a);
          ammo += `<span class="chip ${UI.ammo[w] === a ? 'on' : ''} ${un ? '' : 'lock'}" data-w="${w}" data-a="${a}" data-tip="ammo:${w}:${a}">${esc(A.name)}${un ? ' · ' + SF.costText(A.cost) : ' 🔒'}</span>`;
        }
        ammo += '</div>';
      }
      let heat = '';
      if (w === 'laser' && !locked) heat = `<div class="heat" data-tip="heat"><i style="width:${Math.min(100, ws.heat)}%"></i></div>`;
      let preview = '';
      if (!locked && t) {
        const chk = SF.canFire(G, w, UI.ammo[w], t.pid, t.iid);
        const pv = SF.attackPreview(G, w, UI.ammo[w], t.pid, t.iid, null);
        if (pv && chk.reason !== 'CANNOT REACH ORBIT' && chk.reason !== 'CANNOT ENGAGE SHIPS' && chk.reason !== 'NOT HOSTILE') {
          const notes = [];
          if (pv.shielded) notes.push('<span style="color:#9fb8ff">shielded</span>');
          if (pv.intercept > 0.01) notes.push(`<span style="color:#ff9c74">${SF.pct(pv.intercept)} intercept</span>`);
          if (pv.nuke) notes.push('<span style="color:#b8ff6a">devastates world</span>');
          else if (pv.collat >= 0.3) notes.push('<span style="color:#ff9c74">heavy collateral</span>');
          else if (pv.collat <= 0.12) notes.push('<span style="color:#7dffb0">precise</span>');
          if (pv.emp) notes.push('<span style="color:#9fe8ff">disables 2c</span>');
          preview = `<div class="preview"><span class="rating r-${pv.rating}">${pv.rating}</span> · ${Math.round(Math.min(pv.frac, 9.99) * 100)}% hull · ${SF.pct(pv.killChance)} kill<br>${notes.join(' · ')}</div>`;
        } else preview = `<div class="preview"><span class="r-POOR">${esc(chk.reason || 'NO EFFECT')}</span></div>`;
      } else if (!locked) preview = `<div class="preview" style="color:#7f98a8">${esc(W.blurb)}</div>`;
      let fire = '';
      if (sel && !locked) {
        const ok = t && SF.canFire(G, w, UI.ammo[w], t.pid, t.iid).ok && !UI.busy;
        fire = `<div class="fire-row"><button class="btn btn-warn" id="fire-auto" ${ok ? '' : 'disabled'}>AUTO FIRE</button>${w === 'railgun' ? `<button class="btn btn-alert" id="fire-manual" ${ok ? '' : 'disabled'}>MANUAL</button>` : ''}</div>`;
      }
      h += `<div class="wcard ${sel ? 'sel' : ''} ${locked ? 'locked' : ''}" id="w-${w}" data-wsel="${w}"><div class="wn" style="color:${W.color}">${W.name}</div><div class="wstat">${status}</div>${heat}${ammo}${sel ? '' : preview}${sel ? preview + fire : ''}</div>`;
    }
    // planet killer card
    const pk = SF.pkState(G);
    if (pk.locked) {
      const chain = ['fort_reactor', 'fort_modules', 'fort_pk'];
      h += `<div class="wcard pk" id="w-pk" data-tip="pk"><div class="wn">✦ PLANET KILLER</div><div class="ws">ANNIHILATION CHAMBER · LOCKED</div><div class="req">${chain.map((u) => `<div class="${G.upgrades[u] ? 'ok' : 'no'}">${G.upgrades[u] ? '✔' : '○'} ${esc(SF.UPGRADES[u].name)}</div>`).join('')}<div>Each firing: <span style="color:#c77dff">40 EXO</span> + 30 FIS</div></div></div>`;
    } else {
      const canT = UI.selected && SF.canPlanetKill(G, UI.selected).ok;
      h += `<div class="wcard pk ${pk.ok ? 'armed' : ''}" id="w-pk"><div class="wn">✦ PLANET KILLER</div><div class="wstat">${pk.ok ? '<span class="ready">● CHAMBER READY</span>' : '<span class="notready">● ' + esc(pk.reason) + '</span>'}</div><div class="req">Cost: <span style="color:#c77dff">40 EXO</span> · 30 FIS · ALL POWER<br>Erases a world and all its value.</div><div class="fire-row" style="margin-top:auto"><button class="btn btn-alert" id="fire-pk" ${canT ? '' : 'disabled'}>${canT ? 'OPEN CHAMBER' : UI.selected ? 'INVALID TARGET' : 'SELECT A WORLD'}</button></div></div>`;
    }
    $('dock').innerHTML = h;
    $('dock').querySelectorAll('[data-wsel]').forEach((card) => (card.onclick = (e) => {
      if (e.target.closest('button') || e.target.closest('.chip')) return;
      UI.selectWeapon(card.dataset.wsel);
    }));
    $('dock').querySelectorAll('.chip').forEach((ch) => (ch.onclick = () => {
      if (ch.classList.contains('lock')) { SF.audio.deny(); UI.toast('Locked: requires ' + SF.UPGRADES[SF.WEAPONS[ch.dataset.w].ammo[ch.dataset.a].req].name, 'loss'); return; }
      UI.ammo[ch.dataset.w] = ch.dataset.a; UI.weapon = ch.dataset.w; SF.audio.switch(); UI.afterAction();
    }));
    const fa = $('fire-auto'); if (fa) fa.onclick = () => UI.fireAuto();
    const fm = $('fire-manual'); if (fm) fm.onclick = () => UI.openManual();
    const fp = $("fire-pk"); if (fp) fp.onclick = () => SF.stations.go("pk", { pid: UI.selected });
  }
  UI.selectWeapon = function (w) {
    if (SF.WEAPONS[w].req && !SF.has(g(), SF.WEAPONS[w].req)) { SF.audio.deny(); UI.toast(SF.WEAPONS[w].name + ' not installed: ' + SF.UPGRADES[SF.WEAPONS[w].req].name, 'loss'); return; }
    UI.weapon = w; SF.audio.switch(); UI.afterAction();
  };

  // ------------------------------------------------------------------ firing (auto)
  UI.openManual = function () {
    // Travel to the railgun control station (handles target validation + transition).
    SF.stations.go('railgun');
  };

  function snapshotHold(pid) {
    const p = SF.planet(g(), pid);
    if (!p) return;
    for (const i of p.insts) UI.hold[i.id] = i.hp;
  }
  function releaseHold(pid) {
    const p = SF.planet(g(), pid);
    if (p) for (const i of p.insts) delete UI.hold[i.id];
  }
  // Shared by auto-fire and the manual console's impact.
  UI.resolveShot = function (wid, aid, t, opts) {
    const G = g();
    const before = t.iid ? SF.invasionForecast(G, t.pid, UI.troops[t.pid] || SF.suggestTroops(G, t.pid)) : null;
    const isFleet = t.pid.startsWith('fleet:');
    if (!isFleet) snapshotHold(t.pid);
    const res = SF.fire(G, wid, aid, t.pid, t.iid, opts);
    if (!res.ok) { if (!isFleet) releaseHold(t.pid); return res; }
    if (before && !isFleet && SF.planet(G, t.pid).owner === 'enemy') {
      const after = SF.invasionForecast(G, t.pid, UI.troops[t.pid] || SF.suggestTroops(G, t.pid));
      UI.chanceDelta[t.pid] = { chance: after.chance - before.chance, loss: after.expLoss - before.expLoss };
    }
    return res;
  };
  UI.impact = function (res, t) {
    const G = g();
    const isFleet = t.pid.startsWith('fleet:');
    if (!isFleet) releaseHold(t.pid);
    const anchor = isFleet ? [SF.render.fleetScreen[t.pid.slice(6)] ? SF.render.fleetScreen[t.pid.slice(6)].x : SF.render.W / 2, SF.render.fleetScreen[t.pid.slice(6)] ? SF.render.fleetScreen[t.pid.slice(6)].y : SF.render.H / 2] : SF.render.instPos(G, t.pid, t.iid);
    if (res.intercepted) { UI.toast('SALVO INTERCEPTED', 'loss'); }
    else if (res.missed) { FX_explode(anchor, 0.4); UI.toast('MISS: impact off-target', 'loss'); SF.audio.distant(); }
    else if (res.hit) {
      if (res.nuke) { SF.fx.nuke(anchor); SF.audio.explosion(3); }
      else { FX_explode(anchor, res.killed.length ? 1.2 : 0.7, res.emp ? 'emp' : null); SF.audio.explosion(res.killed.length ? 1.4 : 0.8); }
      for (const cl of res.collateral) if (!isFleet && !res.nuke) setTimeout(() => FX_explode(SF.render.instPos(G, t.pid, cl.iid), 0.45), 120 + Math.random() * 300);
      const names = res.killed.map((id) => { if (id.startsWith('fleet:')) return 'FLEET'; const p = SF.planet(G, id.split(':')[0]); return SF.inst(p, id).name.toUpperCase(); });
      let msg = (res.crit ? '<b style="color:#fff">CRITICAL</b> · ' : '') + Math.round(res.dmg) + ' DMG';
      if (names.length) msg += ' · <b>' + esc(names.join(', ')) + ' DESTROYED</b>';
      if (res.disabled) msg += ' · DISABLED';
      if (res.popLoss > 0.005) msg += ` · <span style="color:#ff8a7a">${res.popLoss >= 1 ? res.popLoss.toFixed(1) + 'M' : Math.round(res.popLoss * 1000) + 'k'} civilian dead</span>`;
      UI.toast(msg, names.length ? 'kill' : '', 4200);
      const cd = UI.chanceDelta[t.pid];
      if (cd && cd.chance > 0.01) setTimeout(() => UI.toast(`⚑ Invasion forecast: victory ${cd.chance > 0 ? '+' : ''}${Math.round(cd.chance * 100)}%, losses ${cd.loss < 0 ? '-' : '+'}${SF.fmtK(Math.abs(cd.loss))}`, 'gain'), 700);
      if (res.killed.some((id) => id.endsWith(':') ? false : (SF.planet(G, id.split(':')[0]) && SF.inst(SF.planet(G, id.split(':')[0]), id) || {}).type === 'mine')) UI.advise('minelost', 'A mine was destroyed. Its income is gone for good, even if you capture the world.');
    }
    UI.busy = false;
    if (UI.selectedInst && SF.inst(SF.planet(G, UI.selected), UI.selectedInst) && SF.inst(SF.planet(G, UI.selected), UI.selectedInst).hp <= 0) UI.selectedInst = null;
    UI.afterAction();
  };
  function FX_explode(at, s, c) { SF.fx.explosion(at, s, c); }

  UI.fireAuto = function () {
    const G = g();
    const t = targetRef();
    if (!t || UI.busy) return;
    const w = UI.weapon, a = UI.ammo[w];
    const chk = SF.canFire(G, w, a, t.pid, t.iid);
    if (!chk.ok) { SF.audio.deny(); UI.toast(chk.reason, 'loss'); return; }
    const res = UI.resolveShot(w, a, t, {});
    UI.busy = true;
    const R = SF.render;
    const to = t.iid ? () => R.instPos(G, t.pid, t.iid) : () => { const f = R.fleetScreen[t.pid.slice(6)]; return f ? [f.x, f.y] : [R.W / 2, R.H / 2]; };
    const from = (k) => () => R.fortPts[k] || [R.W * 0.2, R.H * 0.8];
    // Resolve exactly once. A watchdog guarantees UI.busy always clears even if the FX
    // never gets a chance to draw its onHit (e.g. the player walked off to the Command Deck).
    let fired = false;
    const done = () => { if (fired) return; fired = true; clearTimeout(wd); UI.impact(res, t); };
    const wd = setTimeout(done, 2600);
    if (w === 'railgun') {
      SF.audio.loop('rg', 'whine'); let lv = 0;
      const iv = setInterval(() => { lv += 0.1; SF.audio.loopSet('rg', lv, 0.12); R.fortState.railCharge = lv; if (lv >= 1) { clearInterval(iv); SF.audio.loopStop('rg', 0.02); R.fortState.railCharge = 0; R.fortState.recoil = 1; SF.audio.railgun(1); SF.fx.shake(10, 0.4); SF.fx.rail(from('railgun'), to, done); } }, 45);
    } else if (w === 'laser') {
      SF.audio.laser(1.3); SF.fx.beam(from('laser'), to, 1.3, done);
    } else if (w === 'missile') {
      SF.audio.missile(a === 'nuke' ? 1 : 4); R.fortState.missileFired = R.t;
      SF.fx.missiles(from('missile'), to, a === 'nuke' ? 1 : 4, res.intercepted, done);
    } else {
      SF.audio.bombard(); SF.fx.barrage(from('bombard'), to, 40, done);
    }
    UI.afterAction(true);
  };

  // ------------------------------------------------------------------ refresh
  UI.afterAction = function (noTut) {
    const G = g();
    if (!G) return;
    if (!noTut && SF.tutorialAdvance(G, UI)) SF.audio.confirm();
    SF.checkVictory(G);
    UI.refresh();
    SF.main && SF.main.autosave();
    if (G.over) SF.main.gameOver();
  };
  UI.refresh = function () {
    if (!g()) return;
    renderTop(); renderObjective(); renderLog(); renderPanel(); renderDock(); renderDeckHud();
    if (SF.stations) SF.stations.applyDOM();
    SF.tutorialUI && SF.tutorialUI.update();
  };
  // Minimal diegetic overlay shown while on the Command Deck: the standing order + a cue.
  function renderDeckHud() {
    const G = g();
    const el = $('deckhud');
    if (!el) return;
    const def = SF.sysDef(G);
    const enemies = SF.enemyWorlds(G).length;
    const secured = SF.systemSecured(G);
    el.innerHTML = `<div class="deck-obj panel">` +
      `<div class="label">COMMAND DECK · ${esc(def.name)} · SYS ${G.sysIndex + 1}/${SF.CAMPAIGN.length}</div>` +
      `<div class="obj-title">${secured ? '<span style="color:#6dff9c">SYSTEM SECURED</span>' : def.final ? 'TAKE OR ERASE AETERNUM' : 'CONQUER ' + esc(def.name)}</div>` +
      `<div class="obj-text">${esc(def.brief)}</div>` +
