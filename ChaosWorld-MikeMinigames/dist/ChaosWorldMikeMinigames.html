<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#120608">
<title>Chaos World — Battle Experiments</title>
<style>
/* Chaos World Battle Experiments — comic/action mobile-RPG UI */
:root {
  --ink: #120608; --yel: #ffd21f; --org: #ff6a13; --red: #e8222e; --mag: #ff2e88;
  --pur: #7a2cff; --teal: #19e3c5; --blu: #2d8bff; --grn: #4fe03a; --bone: #f5ecd6;
  --font: "Impact", "Haettenschweiler", "Arial Narrow Bold", "Arial Black", sans-serif;
  --ol: 2px 0 0 #000, -2px 0 0 #000, 0 2px 0 #000, 0 -2px 0 #000, 2px 2px 0 #000, -2px 2px 0 #000, 2px -2px 0 #000, -2px -2px 0 #000, 0 4px 0 #000;
  --ol-big: 3px 0 0 #000, -3px 0 0 #000, 0 3px 0 #000, 0 -3px 0 #000, 3px 3px 0 #000, -3px 3px 0 #000, 3px -3px 0 #000, -3px -3px 0 #000, 0 6px 0 #000;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0406; touch-action: manipulation; }
body {
  font-family: var(--font); color: #fff; user-select: none; -webkit-user-select: none;
  background: #0b0406 repeating-linear-gradient(-55deg, #140709 0 26px, #0d0507 26px 52px);
}
#app { position: fixed; inset: 0; }
#frame { position: absolute; left: 50%; top: 50%; width: 450px; height: 800px; transform-origin: 50% 50%; overflow: hidden; background: #120608; box-shadow: 0 0 0 4px #000, 0 0 60px rgba(255, 60, 20, 0.25); }
#cv { position: absolute; inset: 0; width: 450px; height: 800px; display: block; }
#ui { position: absolute; inset: 0; pointer-events: none; }
#ui > * { pointer-events: auto; }
#ui > .screen { position: absolute; inset: 0; pointer-events: none; }
.screen > * { pointer-events: auto; }
.hidden { display: none !important; }
button { font-family: var(--font); cursor: pointer; border: 0; padding: 0; color: #fff; touch-action: manipulation; }
.ink { text-shadow: var(--ol); letter-spacing: 0.5px; }

/* ---------- Generic chunky button (slashed slab) ---------- */
.btn {
  position: relative; background: #000; font-size: 22px; letter-spacing: 1px; text-shadow: var(--ol);
  clip-path: polygon(6% 0, 100% 0, 94% 100%, 0 100%); padding: 10px 26px 14px; transition: transform 0.06s; isolation: isolate;
}
.btn::before { content: ''; position: absolute; inset: 3px 4px 8px 4px; background: var(--bc, var(--yel)); clip-path: polygon(6% 0, 100% 0, 94% 100%, 0 100%); z-index: -1; box-shadow: inset 0 6px 0 rgba(255, 255, 255, 0.35); }
.btn::after { content: ''; position: absolute; left: 4px; right: 4px; bottom: 3px; height: 7px; background: var(--bd, #a8700a); clip-path: polygon(0 0, 100% 0, 99% 100%, 0 100%); z-index: -1; }
.btn > *, .btn { z-index: 1; }
.btn span, .btn b, .btn i, .btn small { position: relative; z-index: 2; }
.btn.hit, .btn:active { transform: translateY(3px) scale(0.97); }
.btn-play { --bc: var(--yel); --bd: #b07a00; font-size: 30px; padding: 8px 38px 14px; }
.btn-small { font-size: 17px; padding: 8px 16px 13px; }
.btn-dark { --bc: #3a2a30; --bd: #1a0f12; }
.btn-red { --bc: var(--red); --bd: #7a0a12; }
.btn-teal { --bc: var(--teal); --bd: #0a7a68; }

/* ---------- MENU ---------- */
#menu { display: flex; flex-direction: column; align-items: center; padding: 18px 14px 12px; gap: 10px; background: radial-gradient(ellipse at 50% 0%, rgba(255, 80, 20, 0.25), transparent 60%); }
.menu-title { text-align: center; transform: rotate(-3deg); margin: 2px 0 4px; pointer-events: none; }
.menu-title .t1 { font-size: 50px; line-height: 0.95; color: var(--yel); text-shadow: var(--ol-big), 0 10px 0 #7a0a12; letter-spacing: 2px; }
.menu-title .t2 { display: inline-block; margin-top: 6px; font-size: 26px; background: var(--mag); color: #fff; padding: 2px 16px 4px; clip-path: polygon(4% 0, 100% 0, 96% 100%, 0 100%); text-shadow: var(--ol); box-shadow: inset 0 -5px 0 rgba(0, 0, 0, 0.3); border: 0; }
.menu-title .t3 { font-size: 11px; color: #c99; letter-spacing: 3px; margin-top: 6px; font-family: Arial, sans-serif; font-weight: 900; }
.mode-card { position: relative; width: 422px; height: 268px; background: #000; clip-path: polygon(0 4%, 72% 0, 100% 3%, 98% 100%, 30% 97%, 2% 100%); cursor: pointer; }
.mode-card::before { content: ''; position: absolute; inset: 4px; clip-path: polygon(0 4%, 72% 0, 100% 3%, 98% 100%, 30% 97%, 2% 100%); }
.mc1::before { background: #5a0f12; }
.mc2::before { background: #2a0f3a; }
.mc-art { position: absolute; left: 6px; top: 8px; width: 410px; height: 186px; clip-path: polygon(0 4%, 74% 0, 100% 3%, 100% 92%, 0 100%); }
.mc-tag { position: absolute; left: 14px; top: 16px; font-size: 13px; background: #000; color: var(--yel); padding: 3px 10px; transform: skew(-10deg); letter-spacing: 1.5px; }
.mc-name { position: absolute; left: 16px; top: 120px; font-size: 40px; line-height: 0.88; color: #fff; text-shadow: var(--ol-big); transform: rotate(-4deg); transform-origin: left bottom; }
.mc1 .mc-name { color: var(--yel); }
.mc2 .mc-name { color: #ff5a3a; }
.mc-quote { position: absolute; left: 16px; right: 150px; bottom: 16px; font-family: Georgia, serif; font-style: italic; font-weight: 700; font-size: 14px; line-height: 1.15; color: #f3dccf; text-shadow: 0 2px 0 #000; }
.mc-best { position: absolute; right: 18px; top: 16px; font-size: 13px; color: var(--teal); text-shadow: var(--ol); text-align: right; }
.mode-card .btn-play { position: absolute; right: 12px; bottom: 14px; }
.menu-row { display: flex; gap: 10px; margin-top: 2px; }

/* ---------- LAB button / panel ---------- */
.lab-btn { position: absolute; right: 6px; top: 6px; z-index: 40; width: 44px; height: 30px; font-size: 13px; background: #000; color: #9fe; border: 2px solid #3a4a4a; letter-spacing: 1px; transform: skew(-8deg); opacity: 0.8; }
.lab-btn:active { transform: skew(-8deg) translateY(2px); }
.overlay { position: absolute; inset: 0; z-index: 50; background: rgba(8, 2, 4, 0.82); display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 16px 14px; overflow-y: auto; }
.panel { position: relative; width: 100%; background: #000; clip-path: polygon(0 1.5%, 100% 0, 99% 100%, 1% 98.5%); padding: 6px; }
.panel-in { background: #241418; clip-path: polygon(0 1.5%, 100% 0, 99% 100%, 1% 98.5%); padding: 14px 16px 18px; }
.panel h2 { margin: 0 0 10px; font-size: 30px; font-weight: normal; color: var(--yel); text-shadow: var(--ol); transform: rotate(-2deg); }
.panel h3 { margin: 14px 0 6px; font-size: 18px; font-weight: normal; color: var(--teal); text-shadow: var(--ol); letter-spacing: 1px; }
.lab-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0; font-size: 14px; text-shadow: var(--ol); }
.lab-row label { flex: 0 0 132px; color: #f3dccf; letter-spacing: 0.5px; }
.seg { display: flex; flex: 1; gap: 3px; }
.seg button { flex: 1; min-height: 34px; font-size: 13px; background: #3a2a30; color: #ddd; transform: skew(-8deg); border-bottom: 3px solid #1a0f12; }
.seg button.on { background: var(--yel); color: #000; border-bottom-color: #a8700a; }
.lab-note { font-family: Arial, sans-serif; font-size: 11px; color: #b99; margin-top: 4px; }
.lab-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; justify-content: center; }
.howto p, .howto li { font-family: Arial, sans-serif; font-weight: 700; font-size: 13.5px; line-height: 1.35; color: #f3dccf; text-shadow: none; }
.howto ul { padding-left: 18px; margin: 4px 0; }
.howto b { color: var(--yel); font-family: var(--font); font-weight: normal; letter-spacing: 0.5px; font-size: 15px; }

/* ---------- Callouts ---------- */
#callouts { position: absolute; inset: 0; pointer-events: none; z-index: 30; }
.callout { position: absolute; left: 0; right: 0; top: 34%; text-align: center; font-size: 46px; line-height: 0.92; color: var(--yel); text-shadow: var(--ol-big); animation: callPop 1.2s ease-out forwards; transform-origin: center; }
.callout small { display: block; font-size: 22px; color: #fff; margin-top: 6px; }
.callout.red { color: #ff4a3a; }
.callout.teal { color: var(--teal); }
.callout.mag { color: var(--mag); }
.callout.white { color: #fff; }
.callout.huge { font-size: 64px; }
.callout.low { top: 52%; font-size: 30px; }
.callout.high { top: 20%; }
.callout.slab::before { content: ''; position: absolute; left: -10px; right: -10px; top: 50%; height: 64%; transform: translateY(-50%) skewY(-4deg); background: #000; z-index: -1; opacity: 0.85; }
@keyframes callPop {
  0% { transform: scale(2.2) rotate(-6deg); opacity: 0; }
  12% { transform: scale(0.92) rotate(-3deg); opacity: 1; }
  20% { transform: scale(1.04) rotate(-3deg); }
  80% { transform: scale(1) rotate(-3deg); opacity: 1; }
  100% { transform: scale(1.1) rotate(-3deg) translateY(-20px); opacity: 0; }
}

/* ---------- Shared HUD bits ---------- */
.bar { position: relative; height: 14px; background: #1a0a0e; border: 2px solid #000; overflow: hidden; transform: skew(-12deg); }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--grn); transition: width 0.12s; }
.bar > i.lag { background: #fff; opacity: 0.6; transition: width 0.6s 0.25s; }
.bar > i.main { box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.35); }
.cd { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
.key { position: absolute; font-size: 11px; background: #000; color: #ddd; padding: 1px 5px; z-index: 4; font-family: Arial, sans-serif; font-weight: 900; }

/* ---------- MODE 1 ---------- */
.m1-boss { position: absolute; left: 6px; right: 104px; top: 6px; height: 44px; }
.m1-boss .nm { position: absolute; left: 50px; top: -2px; font-size: 17px; color: #ff9a3a; text-shadow: var(--ol); letter-spacing: 1px; }
.m1-boss .st { position: absolute; right: 2px; top: -1px; font-size: 14px; text-shadow: var(--ol); color: #fff; }
.m1-boss .bar { position: absolute; left: 48px; right: 0; top: 20px; height: 18px; }
.m1-boss .bar > i.main { background: linear-gradient(#ff5a2a, #c8141e); }
.m1-boss .hpn { position: absolute; left: 0; right: 0; top: 0; text-align: center; font-size: 13px; line-height: 15px; text-shadow: var(--ol); z-index: 2; transform: skew(12deg); }
.m1-boss img { position: absolute; left: 0; top: 0; width: 44px; height: 44px; background: #000; clip-path: polygon(0 0, 100% 8%, 92% 100%, 4% 94%); }
.team { position: absolute; left: 4px; right: 4px; top: 54px; height: 62px; display: flex; gap: 4px; }
.hcard { position: relative; flex: 1; background: #000; clip-path: polygon(0 0, 100% 6%, 96% 100%, 3% 96%); padding: 3px; }
.hcard-in { position: absolute; inset: 3px; background: #2a161a; clip-path: polygon(0 0, 100% 6%, 96% 100%, 3% 96%); }
.hcard.r .hcard-in { background: #3a2410; }
.hcard.a .hcard-in { background: #12203a; }
.hcard img { position: absolute; left: 3px; top: 3px; width: 38px; height: 38px; z-index: 2; }
.hcard .rl { position: absolute; left: 42px; top: 4px; font-size: 10px; color: var(--yel); z-index: 2; text-shadow: var(--ol); letter-spacing: 0.5px; }
.hcard.a .rl { color: #7ac8ff; }
.hcard .hn { position: absolute; left: 42px; top: 15px; font-size: 14px; z-index: 2; text-shadow: var(--ol); }
.hcard .bar { position: absolute; left: 6px; right: 8px; bottom: 15px; height: 8px; z-index: 2; border-width: 1.5px; }
.hcard .stt { position: absolute; left: 6px; right: 4px; bottom: 1px; font-size: 11px; z-index: 2; color: #fff; text-shadow: var(--ol); white-space: nowrap; overflow: hidden; }
.hcard.ko { filter: grayscale(1) brightness(0.6); }
.hcard.hurt { animation: cardHurt 0.3s; }
.hcard.tgt .hcard-in { background: #7a0a12; animation: tgtPulse 0.4s infinite alternate; }
@keyframes cardHurt { 0%, 100% { transform: none; } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
@keyframes tgtPulse { to { background: #c8141e; } }
.m1-ctrl { position: absolute; left: 0; right: 0; bottom: 0; height: 214px; }
.m1-ctrl::before { content: ''; position: absolute; inset: 22px 0 0 0; background: #000; clip-path: polygon(0 10%, 30% 0, 70% 6%, 100% 0, 100% 100%, 0 100%); opacity: 0.86; pointer-events: none; }
.roper { position: absolute; bottom: 30px; width: 142px; height: 172px; }
.roper.L { left: 6px; }
.roper.R { right: 6px; }
.roper .lbl { position: absolute; left: 0; right: 0; top: 0; font-size: 13px; text-align: center; text-shadow: var(--ol); color: var(--yel); }
.roper .lbl em { font-style: normal; color: #fff; }
.tbar { position: absolute; left: 4px; right: 4px; top: 20px; height: 26px; background: #2a1a1e; border: 3px solid #000; transform: skew(-10deg); overflow: hidden; }
.tbar .zone { position: absolute; top: 0; bottom: 0; background: var(--grn); box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.4); }
.tbar .perf { position: absolute; top: 0; bottom: 0; background: var(--yel); }
.tbar .mark { position: absolute; top: -3px; bottom: -3px; width: 7px; margin-left: -3px; background: #fff; border: 2px solid #000; }
.tbar.off { opacity: 0.3; }
.tbar.locked { border-color: var(--yel); }
.rbtn { position: absolute; left: 0; right: 0; top: 52px; height: 118px; background: #000; clip-path: polygon(8% 0, 100% 0, 92% 100%, 0 100%); overflow: hidden; }
.rbtn .face { position: absolute; inset: 4px 5px 10px 5px; background: var(--org); clip-path: polygon(8% 0, 100% 0, 92% 100%, 0 100%); box-shadow: inset 0 8px 0 rgba(255, 255, 255, 0.3), inset 0 -8px 0 rgba(0, 0, 0, 0.3); }
.rbtn .fill { position: absolute; left: 5px; right: 5px; bottom: 10px; height: 0; background: var(--yel); clip-path: polygon(8% 0, 100% 0, 92% 100%, 0 100%); }
.rbtn .fill.ready { background: #fff; animation: readyFlash 0.12s infinite alternate; }
@keyframes readyFlash { to { background: var(--grn); } }
.rbtn .txt { position: absolute; left: 0; right: 0; top: 32px; text-align: center; font-size: 30px; text-shadow: var(--ol-big); z-index: 2; }
.rbtn .sub { position: absolute; left: 0; right: 0; top: 74px; text-align: center; font-size: 13px; text-shadow: var(--ol); z-index: 2; color: #fff; }
.rbtn .thr { position: absolute; left: 0; right: 0; top: 4px; height: 3px; background: #fff; z-index: 2; opacity: 0.7; }
.rbtn.pull .face { background: var(--mag); animation: pullPulse 0.35s infinite alternate; }
@keyframes pullPulse { to { background: #ff5aa8; } }
.rbtn.locked .face { background: #4a5a2a; }
.rbtn.wait .face { background: #3a3036; }
.rbtn.ai { pointer-events: none; }
.rbtn.ai .face { background: #3a3a6a; }
.rbtn.ai.pull .face { background: #6a3a9a; }
.rbtn.shk { animation: btnShk 0.08s; }
@keyframes btnShk { 0% { transform: translate(0, 3px) scale(0.97); } 100% { transform: none; } }
.rbtn.hit { transform: translateY(3px) scale(0.97); }
.abil { position: absolute; left: 154px; right: 154px; bottom: 30px; height: 172px; }
.abil .alb { position: absolute; left: 0; right: 0; top: 0; text-align: center; font-size: 12px; color: #7ac8ff; text-shadow: var(--ol); }
.ab { position: absolute; width: 66px; height: 72px; background: #000; clip-path: polygon(10% 0, 100% 4%, 90% 100%, 0 96%); }
.ab .face { position: absolute; inset: 3px 3px 8px 3px; clip-path: polygon(10% 0, 100% 4%, 90% 100%, 0 96%); background: var(--ac, #2d6bd8); box-shadow: inset 0 6px 0 rgba(255, 255, 255, 0.3); }
.ab .nm { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; font-size: 13px; z-index: 2; text-shadow: var(--ol); }
.ab .ic { position: absolute; left: 50%; top: 8px; width: 36px; height: 36px; margin-left: -18px; z-index: 2; }
.ab .cdn { position: absolute; left: 0; right: 0; top: 18px; text-align: center; font-size: 22px; z-index: 5; text-shadow: var(--ol); }
.ab.cool .face { filter: grayscale(0.85) brightness(0.55); }
.ab.boost .face { animation: boostGlow 0.3s infinite alternate; }
@keyframes boostGlow { to { filter: brightness(1.4); } }
.ab.wide { width: 140px; height: 58px; }
.ab.wide .nm { bottom: 14px; font-size: 18px; }
.ab .meter { position: absolute; left: 6px; right: 6px; bottom: 9px; height: 6px; background: #000; z-index: 2; }
.ab .meter i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--yel); }
.ab.ready .face { --ac: var(--mag); animation: boostGlow 0.25s infinite alternate; }
.ab.hit { transform: translateY(3px) scale(0.96); }
.m1-hints { position: absolute; left: 0; right: 0; bottom: 6px; text-align: center; font-family: Arial, sans-serif; font-weight: 900; font-size: 10.5px; color: #988; letter-spacing: 0.5px; pointer-events: none; }
.m1-burn { position: absolute; left: 150px; right: 10px; top: 132px; text-align: center; pointer-events: none; }
.m1-burn .lb { font-size: 16px; color: #fff; text-shadow: var(--ol); }
.m1-burn .tm { font-size: 46px; color: var(--org); text-shadow: var(--ol-big); line-height: 0.95; }
.m1-burn.hot .tm { color: #ff2e1f; animation: burnShake 0.1s infinite; }
@keyframes burnShake { 0% { transform: translateX(-2px) } 100% { transform: translateX(2px) } }
.m1-pull { position: absolute; left: 10px; width: 230px; top: 128px; pointer-events: none; }
.prow { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; font-size: 13px; text-shadow: var(--ol); }
.prow span { width: 64px; }
.prow .bar { flex: 1; height: 16px; }
.prow .bar i { background: var(--yel); transition: none; }
.prow .bar i.rdy { background: var(--grn); }
.prow .bar b { position: absolute; right: 0; top: 0; bottom: 0; width: 3px; background: #fff; }
.m1-stun { position: absolute; left: 0; right: 0; top: 126px; text-align: center; pointer-events: none; }
.m1-stun .lb { font-size: 44px; line-height: 0.95; color: var(--yel); text-shadow: var(--ol-big); transform: rotate(-3deg); }
.m1-stun .tm { font-size: 22px; color: #fff; text-shadow: var(--ol); }
.m1-combo { position: absolute; right: 14px; top: 196px; text-align: right; pointer-events: none; transform: rotate(4deg); }
.m1-combo .n { font-size: 44px; color: var(--mag); text-shadow: var(--ol-big); line-height: 0.9; }
.m1-combo .l { font-size: 16px; color: #fff; text-shadow: var(--ol); }
.m1-combo.bump { animation: comboBump 0.15s; }
@keyframes comboBump { from { transform: rotate(4deg) scale(1.35); } }
.m1-stats { position: absolute; left: 6px; top: 120px; font-size: 11px; color: #cba; text-shadow: var(--ol); line-height: 1.3; pointer-events: none; }
.intro { position: absolute; inset: 0; z-index: 35; background: rgba(8, 2, 4, 0.78); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; gap: 12px; }
.intro .ttl { font-size: 46px; color: var(--yel); text-shadow: var(--ol-big); transform: rotate(-3deg); text-align: center; line-height: 0.95; }
.intro .steps { width: 100%; }
.intro .step { display: flex; gap: 10px; align-items: center; margin: 7px 0; font-size: 18px; text-shadow: var(--ol); }
.intro .step b { flex: 0 0 34px; height: 34px; background: var(--mag); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: normal; transform: skew(-10deg); font-size: 20px; }
.intro .step span { line-height: 1.05; }
.intro .step em { font-style: normal; color: var(--yel); }

/* ---------- MODE 2 ---------- */
.m2-top { position: absolute; left: 0; right: 0; top: 0; height: 56px; }
.m2-top::before { content: ''; position: absolute; inset: 0; background: #000; clip-path: polygon(0 0, 100% 0, 100% 70%, 62% 100%, 0 82%); opacity: 0.85; pointer-events: none; }
.m2-hp { position: absolute; left: 8px; top: 6px; width: 200px; }
.m2-hp .lb { font-size: 13px; text-shadow: var(--ol); color: var(--grn); }
.m2-hp .bar { height: 16px; margin-top: 2px; }
.m2-hp .bar i.main { background: linear-gradient(#7cff5a, #2aa818); }
.m2-hp .hpn { position: absolute; left: 0; right: 0; top: 0; text-align: center; font-size: 12px; line-height: 13px; text-shadow: var(--ol); z-index: 2; transform: skew(12deg); }
.m2-wave { position: absolute; left: 214px; top: 4px; font-size: 24px; color: var(--yel); text-shadow: var(--ol); transform: rotate(-3deg); }
.m2-wave small { display: block; font-size: 12px; color: #fff; margin-top: -2px; }
.m2-gold { position: absolute; right: 56px; top: 8px; font-size: 16px; color: var(--yel); text-shadow: var(--ol); }
.m2-gold i { display: inline-block; width: 14px; height: 14px; background: var(--yel); border: 2px solid #000; border-radius: 50%; vertical-align: -1px; margin-right: 3px; }
.m2-time { position: absolute; right: 56px; top: 28px; font-size: 14px; color: #fff; text-shadow: var(--ol); }
.beacon { position: absolute; left: 30px; right: 6px; bottom: 104px; height: 92px; transition: height 0.25s, opacity 0.25s; }
.beacon .bg { position: absolute; inset: 0; background: #000; clip-path: polygon(0 12%, 70% 0, 100% 8%, 99% 100%, 2% 92%); }
.beacon .bg::before { content: ''; position: absolute; inset: 4px; background: #2a0a10; clip-path: polygon(0 12%, 70% 0, 100% 8%, 99% 100%, 2% 92%); }
.beacon.b-safe .bg::before { background: #0f2a1a; }
.beacon.b-hunted .bg::before { background: #3a2a08; }

<script>
/* ---- 01_core.js ---- */
'use strict';
/* ==========================================================================
   CORE — constants, utils, save/settings, input, audio, FX, game loop
   ========================================================================== */
const W = 450, H = 800;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const dist2 = (ax, ay, bx, by) => (ax - bx) * (ax - bx) + (ay - by) * (ay - by);
const Ease = {
  outCubic: (t) => 1 - Math.pow(1 - t, 3),
  inCubic: (t) => t * t * t,
  outBack: (t) => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  inOut: (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2),
  outBounce: (t) => { const n = 7.5625, d = 2.75; if (t < 1 / d) return n * t * t; if (t < 2 / d) return n * (t -= 1.5 / d) * t + 0.75; if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + 0.9375; return n * (t -= 2.625 / d) * t + 0.984375; },
};
const fmt = (n) => Math.round(n).toLocaleString('en-US');
const fmtTime = (s) => { s = Math.max(0, s); const m = Math.floor(s / 60); const r = Math.floor(s % 60); return m + ':' + (r < 10 ? '0' : '') + r; };

/* ---------- Save / Settings ---------- */
const SAVE_KEY = 'cw_mike_minigames_v1';
const DEFAULT_SETTINGS = () => ({
  mute: false,
  speed: 1,
  m1: { bossHp: 1, burn: 3.8, pullDiff: 1, atkFreq: 1, partner: 'ai_ok' },
  m2: { hunterSpeed: 1, startDist: 120, dropRate: 1, hunterHp: 1, itemMode: 'auto' },
});
const Save = {
  data: { settings: DEFAULT_SETTINGS(), best: {} },
  load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) {
        const d = JSON.parse(raw);
        const def = DEFAULT_SETTINGS();
        this.data = {
          settings: Object.assign(def, d.settings || {}, {
            m1: Object.assign(def.m1, (d.settings || {}).m1 || {}),
            m2: Object.assign(def.m2, (d.settings || {}).m2 || {}),
          }),
          best: d.best || {},
        };
      }
    } catch (e) { /* storage blocked — run with defaults */ }
  },
  save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.data)); } catch (e) { /* ignore */ } },
  reset() { this.data = { settings: DEFAULT_SETTINGS(), best: {} }; try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ } },
};
const S = () => Save.data.settings;

/* ---------- Audio (pure WebAudio, generated) ---------- */
const Audio = {
  ctx: null, master: null, last: {},
  unlock() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.5;
      this.master.connect(this.ctx.destination);
      const len = this.ctx.sampleRate;
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { this.ctx = null; }
  },
  ok(name, gap) {
    if (!this.ctx || S().mute) return false;
    const now = this.ctx.currentTime;
    if (gap && this.last[name] && now - this.last[name] < gap) return false;
    this.last[name] = now;
    return true;
  },
  tone(f, dur, type = 'square', vol = 0.2, f2 = null, delay = 0) {
    const c = this.ctx, t = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, freq = 1000, vol = 0.3, type = 'lowpass', f2 = null, delay = 0) {
    const c = this.ctx, t = c.currentTime + delay;
    const s = c.createBufferSource(); s.buffer = this.noiseBuf; s.loop = true;
    const fl = c.createBiquadFilter(); fl.type = type; fl.frequency.setValueAtTime(freq, t);
    if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + dur);
    const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(fl); fl.connect(g); g.connect(this.master); s.start(t); s.stop(t + dur + 0.02);
  },
  play(name) {
    if (!this.ok(name, SFX_GAP[name] || 0.03)) return;
    const f = SFX[name]; if (f) try { f(this); } catch (e) { /* ignore */ }
  },
};
const SFX_GAP = { hit: 0.04, pullL: 0.03, pullR: 0.03, strain: 0.25, coin: 0.05, heartbeat: 0.2, tick: 0.08, step: 0.2 };
const SFX = {
  click: (a) => a.tone(660, 0.06, 'square', 0.12, 880),
  ropeThrow: (a) => { a.noise(0.35, 2500, 0.18, 'bandpass', 600); a.tone(300, 0.3, 'triangle', 0.08, 700); },
  ropeLock: (a) => { a.tone(180, 0.08, 'square', 0.25, 90); a.noise(0.12, 3000, 0.25, 'highpass'); a.tone(880, 0.12, 'triangle', 0.12, 1320, 0.05); },
  ropeMiss: (a) => { a.tone(400, 0.25, 'sawtooth', 0.12, 120); },
  ropeSnap: (a) => { a.noise(0.18, 4000, 0.4, 'highpass'); a.tone(220, 0.25, 'square', 0.18, 60); },
  burn: (a) => { a.noise(1.0, 500, 0.5, 'lowpass', 3000); a.tone(90, 0.8, 'sawtooth', 0.2, 40); },
  pullL: (a) => { a.tone(150 + Math.random() * 30, 0.07, 'square', 0.1, 110); },
  pullR: (a) => { a.tone(190 + Math.random() * 30, 0.07, 'square', 0.1, 140); },
  strain: (a) => { a.tone(70, 0.3, 'sawtooth', 0.12, 55); },
  roar: (a) => { a.noise(0.9, 300, 0.45, 'lowpass', 1200); a.tone(110, 0.9, 'sawtooth', 0.22, 55); a.tone(73, 0.9, 'square', 0.12, 40); },
  charge: (a) => { a.tone(120, 1.2, 'sawtooth', 0.1, 480); a.noise(1.2, 400, 0.15, 'bandpass', 2500); },
  crash: (a) => { a.noise(1.0, 600, 0.9, 'lowpass', 80); a.tone(60, 0.8, 'sine', 0.6, 25); a.tone(120, 0.3, 'square', 0.25, 40); },
  dizzy: (a) => { for (let i = 0; i < 5; i++) a.tone(900 + i * 150, 0.09, 'triangle', 0.08, 1200 + i * 150, i * 0.07); },
  hit: (a) => { a.noise(0.08, 2500, 0.25, 'bandpass'); a.tone(220 + Math.random() * 80, 0.06, 'square', 0.1, 120); },
  bigHit: (a) => { a.noise(0.25, 1800, 0.5, 'lowpass', 200); a.tone(110, 0.25, 'square', 0.3, 50); },
  slash: (a) => { a.noise(0.14, 6000, 0.25, 'highpass', 1500); },
  meteor: (a) => { a.noise(0.5, 3000, 0.35, 'lowpass', 150); a.tone(300, 0.5, 'sawtooth', 0.15, 50); },
  burst: (a) => { a.tone(220, 0.6, 'sawtooth', 0.25, 880); a.noise(0.7, 800, 0.5, 'lowpass', 100, 0.2); a.tone(55, 0.7, 'sine', 0.5, 30, 0.2); },
  hurt: (a) => { a.tone(300, 0.15, 'square', 0.14, 140); },
  stomp: (a) => { a.noise(0.4, 400, 0.6, 'lowpass', 60); a.tone(70, 0.35, 'sine', 0.5, 30); },
  fire: (a) => { a.noise(0.8, 800, 0.4, 'bandpass', 2400); },
  warn: (a) => { a.tone(520, 0.12, 'square', 0.12); a.tone(520, 0.12, 'square', 0.12, null, 0.18); },
  success: (a) => { [523, 659, 784, 1046].forEach((f, i) => a.tone(f, 0.18, 'square', 0.12, null, i * 0.08)); },
  fail: (a) => { [392, 330, 262, 196].forEach((f, i) => a.tone(f, 0.22, 'sawtooth', 0.1, null, i * 0.12)); },
  win: (a) => { [523, 659, 784, 1046, 784, 1046, 1318].forEach((f, i) => a.tone(f, 0.2, 'square', 0.12, null, i * 0.1)); },
  revive: (a) => { a.tone(440, 0.3, 'triangle', 0.12, 880); },
  tick: (a) => a.tone(1200, 0.04, 'square', 0.06),
  reveal: (a) => { a.tone(700, 0.08, 'square', 0.1, 1400); },
  rare: (a) => { [784, 988, 1175].forEach((f, i) => a.tone(f, 0.16, 'triangle', 0.14, null, i * 0.07)); },
  epic: (a) => { [523, 784, 1046, 1568, 2093].forEach((f, i) => a.tone(f, 0.22, 'square', 0.12, null, i * 0.07)); a.noise(0.6, 6000, 0.12, 'highpass', null, 0.2); },
  whoosh: (a) => { a.noise(0.35, 400, 0.3, 'bandpass', 3000); },
  trap: (a) => { a.tone(160, 0.1, 'square', 0.3, 60); a.noise(0.12, 5000, 0.3, 'highpass'); },

  slow: (a) => { a.tone(600, 0.5, 'sine', 0.15, 150); },
  heartbeat: (a) => { a.tone(55, 0.12, 'sine', 0.5, 40); a.tone(50, 0.12, 'sine', 0.4, 35, 0.16); },
  step: (a) => { a.noise(0.15, 200, 0.5, 'lowpass', 50); a.tone(45, 0.15, 'sine', 0.4, 30); },
  hereHe: (a) => { a.noise(1.2, 200, 0.6, 'lowpass', 900); a.tone(65, 1.2, 'sawtooth', 0.3, 45); a.tone(98, 1.2, 'square', 0.12, 49); },
  coin: (a) => a.tone(1320, 0.07, 'square', 0.06, 1760),
  arrow: (a) => a.noise(0.1, 4000, 0.15, 'highpass', 8000),
  bomb: (a) => { a.noise(0.6, 900, 0.7, 'lowpass', 60); a.tone(90, 0.5, 'sine', 0.5, 35); },
  splat: (a) => { a.noise(0.15, 900, 0.3, 'lowpass', 200); },
  full: (a) => a.tone(200, 0.15, 'square', 0.12, 150),
  ult: (a) => { a.tone(110, 1.0, 'sawtooth', 0.3, 880); a.noise(1.0, 300, 0.5, 'lowpass', 3000); },
};

/* ---------- FX: particles, floaters, shake, flashes ---------- */
const FX = {
  parts: [], floats: [], rings: [], shakeAmp: 0, shakeT: 0, flash: 0, flashColor: '#fff',
  hitStop: 0, slowT: 0, slowScale: 1,
  reset() { this.parts.length = 0; this.floats.length = 0; this.rings.length = 0; this.shakeAmp = 0; this.flash = 0; this.hitStop = 0; this.slowT = 0; this.slowScale = 1; },
  shake(a) { this.shakeAmp = Math.max(this.shakeAmp, a); },
  doFlash(a, c = '#fff') { this.flash = Math.max(this.flash, a); this.flashColor = c; },
  stop(t) { this.hitStop = Math.max(this.hitStop, t); },
  slowmo(t, s) { this.slowT = t; this.slowScale = s; },
  burst(x, y, n, o = {}) {
    for (let i = 0; i < n; i++) {
      const a = o.angle != null ? o.angle + rand(-(o.spread || 3.2), o.spread || 3.2) / 2 : rand(0, Math.PI * 2);
      const sp = rand(o.spMin || 60, o.spMax || 260);
      this.parts.push({
        x: x + rand(-(o.jx || 0), o.jx || 0), y: y + rand(-(o.jy || 0), o.jy || 0),
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (o.up || 0),
        life: rand(o.lifeMin || 0.3, o.lifeMax || 0.7), max: 0, size: rand(o.sMin || 3, o.sMax || 7),
        color: Array.isArray(o.color) ? pick(o.color) : o.color || '#ffd21f', grav: o.grav != null ? o.grav : 400,
        type: o.type || 'spark', drag: o.drag || 0.9, rot: rand(0, 6), vr: rand(-8, 8),
      });
      const p = this.parts[this.parts.length - 1]; p.max = p.life;
    }

/* ==========================================================================

   FSM: intro → active ⇄ (pull → fall → stun → wake | pull → burn) → win/lose
   ========================================================================== */
const M1_TUNE = {
  bossHp: 18000,
  heroHp: 120,
  stunDur: 4.5,
  slipTime: 7.0,          // a single rope gets shaken off after this long
  zoneW: 0.24, perfW: 0.07, sweepSpeed: 1.55, // rope timing bar
  missCool: 0.9,
  pullGain: 9, pullDecay: 18, readyWin: 0.6,   // independent pull meters (0..100)
  atkMin: 3.0, atkMax: 4.4, aoeEvery: 3,       // boss attack cadence (seconds) / every Nth attack is AOE
  singleTele: 1.15, aoeTele: 1.8, singleDmg: 20, aoeDmg: 14,
  chipMult: 0.3, stunMult: 4, comboStep: 0.03,
  koTime: 10,
};
const M1_AI = {
  ai_ace: { label: 'AI · ACE', hit: 0.88, react: [0.3, 0.7], tps: 9.5, fumble: 0.0 },
  ai_ok: { label: 'AI · OKAY', hit: 0.68, react: [0.5, 1.4], tps: 7.5, fumble: 0.3 },
  ai_bad: { label: 'AI · SLOPPY', hit: 0.45, react: [0.8, 2.0], tps: 6.6, fumble: 0.3 },
};
const BX = 300, BY = 425, BS = 0.78;
const bw = (lx, ly) => [BX + lx * BS, BY + ly * BS];

const M1 = {
  name: 'm1',
  enter() {
    $('#menu').classList.add('hidden'); $('#m1ui').classList.remove('hidden');
    this.buildUI();
    this.reset(false);
  },
  exit() { $('#m1ui').classList.add('hidden'); $('#m1ui').innerHTML = ''; $('#results').classList.add('hidden'); },
  reset(skipIntro) {
    const set = S().m1;
    this.t = 0; this.time = 0; this.stateT = 0;
    this.bossMax = Math.round(M1_TUNE.bossHp * set.bossHp); this.bossHp = this.bossMax; this.bossLag = this.bossMax;
    this.enraged = false; this.atkCount = 0; this.atk = null; this.atkTimer = 2.4;
    this.ult = 0; this.combo = 0; this.comboBest = 0;
    this.takedowns = 0; this.ropesBurned = 0; this.shakeOffs = 0; this.totalDmg = 0;
    this.slip = 0; this.burnT = 0; this.burnMax = 1; this.lagShout = 0;
    this.projs = []; this.debris = []; this.cds = [0, 0];
    this.pose = this.basePose(); this.poseT = this.basePose();
    const H = M1_TUNE.heroHp;
    const mk = (id, name, role, kind, x, y, extra) => Object.assign({ id, name, role, kind, hx: x, hy: y, x, y, hp: H, max: H, ko: false, koT: 0, flash: 0, anim: null, animT: 0, stagger: 0, stats: { ropeHits: 0, ropeMiss: 0, pullTaps: 0, dmg: 0, taken: 0, perfect: 0 } }, extra || {});
    const rp = (side) => ({ side, rope: 'none', flyT: 0, flyHit: false, cool: 0, tpos: Math.random(), tdir: 1, zoneC: rand(0.3, 0.7), pull: 0, ready: 0, ai: null, fumble: 0, aiTap: 0, aiDelay: 0, perfectT: 0, missPt: null });
    this.heroes = [
      mk('scrub', 'SCRUB', 'ROPER 1', 'roper', 48, 468, rp('L')),
      mk('archer', 'ARCHER', 'ROPER 2', 'roper', 122, 520, rp('R')),
      mk('knight', 'KNIGHT', 'ATTACKER 1', 'atk', 198, 556, { atkT: 0.5, rate: 0.7, base: 10 }),
      mk('hexa', 'HEXA', 'ATTACKER 2', 'atk', 272, 584, { atkT: 0.9, rate: 1.0, base: 14 }),
    ];
    this.ropers = [this.heroes[0], this.heroes[1]];
    this.atkers = [this.heroes[2], this.heroes[3]];
    FX.reset(); Callout.clear();
    $('#results').classList.add('hidden');
    this.ui.uiCache = {};
    this.refreshPartnerUI();
    if (skipIntro) { this.setState('active'); Callout.show('FIGHT!', 'huge', 0.9); Audio.play('roar'); }
    else this.setState('intro');
  },
  isHuman(i) { return i === 0 || S().m1.partner === 'human'; },
  setState(s) {
    this.prev = this.state; this.state = s; this.stateT = 0;
    const ui = this.ui;
    ui.intro.classList.toggle('hidden', s !== 'intro');
    if (s === 'active') { /* nothing */ }
    if (s === 'pull') {
      this.burnMax = S().m1.burn * rand(0.88, 1.12) * (this.enraged ? 0.85 : 1); this.burnT = this.burnMax;
      this.atk = null; this.clearTargets();
      for (const r of this.ropers) { r.pull = 0; r.ready = 0; r.aiDelay = rand(0.25, 0.8) * (r.ai ? 1 : 0); }
      Callout.show('BOTH ROPES SET!<small>PULL! PULL! PULL!</small>', 'mag slab', 1.3);
      Audio.play('ropeLock'); Audio.play('charge'); FX.shake(6);
    }
    if (s === 'fall') {
      this.takedowns++;
      FX.slowmo(0.55, 0.3); Audio.play('success');
      Callout.show('TAKEDOWN!', 'huge teal', 1.1);
      this.addUlt(30);
      for (const r of this.ropers) r.pull = 0;
    }
    if (s === 'stun') {
      this.combo = 0;
      for (const h of this.heroes) if (h.ko) { h.ko = false; h.hp = Math.round(h.max * 0.4); FX.text(h.x, h.y - 90, 'BACK UP!', { color: '#4fe03a', size: 20 }); Audio.play('revive'); }
      for (const h of this.heroes) if (!h.ko) h.hp = Math.min(h.max, h.hp + 15);
      Callout.show('STUNNED!<small>SMASH IT! ×4 DAMAGE</small>', 'slab', 1.2);
      Audio.play('dizzy');
    }
    if (s === 'wake') { Callout.show('WAKE UP!', 'red huge', 1.0); Audio.play('roar'); FX.shake(8); this.comboBest = Math.max(this.comboBest, this.combo); }
    if (s === 'burn') {
      this.ropesBurned++;
      Callout.show('WHOOSH!<small>ROPES BURNED!</small>', 'red slab', 1.3);
      Audio.play('burn'); Audio.play('fail'); FX.shake(10); FX.doFlash(0.35, '#ff6a13');
      this.burnRopes(10, 1.2);
    }
    if (s === 'win') { Audio.play('win'); Callout.show('MONSTER<br>DOWN!', 'huge', 2.2); FX.slowmo(1.2, 0.35); FX.shake(18); }
    if (s === 'lose') { Audio.play('fail'); Callout.show('TEAM<br>ROASTED', 'red huge', 2.2); }
  },
  basePose() { return { lift: 0, rot: 0, jaw: 0.15, legLx: 0, legLy: 0, legRx: 0, legRy: 0, squash: 1, eyes: 'angry', tongue: 0, heat: 0, headX: 0, headY: 0, headRot: 0, flash: 0, shadowS: 1 }; },

  /* ---------------- INPUT ---------------- */
  onKey(k, e) {
    if (this.state === 'intro') { if (k === ' ' || k === 'Enter') this.startFight(); return; }
    if (k === 'a') { if (!e.repeat) this.roperAction(0); this.pressFx(0); }
    if (k === 'l') { if (!e.repeat && this.isHuman(1)) { this.roperAction(1); this.pressFx(1); } }
    if (k === '1') this.ability(0);
    if (k === '2') this.ability(1);
    if (k === '3' || k === ' ') this.ability(2);
    if (k === 'r') this.reset(true);
    if (k === 'Escape') Main.toMenu();
  },
  pressFx(i) { const b = this.ui.rb[i]; if (b) { b.classList.remove('shk'); void b.offsetWidth; b.classList.add('shk'); } },
  startFight() { if (this.state !== 'intro') return; this.setState('active'); Callout.show('FIGHT!', 'huge', 0.9); Audio.play('roar'); FX.shake(8); },
  canThrow(r) { return this.state === 'active' && r.rope === 'none' && r.cool <= 0 && !r.ko && r.stagger <= 0; },
  roperAction(i) {
    const r = this.ropers[i];
    if (this.state === 'pull' && r.rope === 'locked' && !r.ko) return this.pullTap(r);
    if (this.canThrow(r)) return this.throwRope(r);
  },
  throwRope(r) {
    const half = M1_TUNE.zoneW / 2, d = Math.abs(r.tpos - r.zoneC);
    const hit = d <= half, perfect = d <= M1_TUNE.perfW / 2;
    r.rope = 'flying'; r.flyT = 0; r.flyHit = hit; r.perfect = perfect;
    r.anim = 'throw'; r.animT = 0.35;
    const [ax, ay] = this.ankleWorld(r.side);
    r.missPt = hit ? null : [lerp(r.x + 14, ax, rand(0.55, 0.8)) + rand(-30, 30), ay + rand(20, 60)];
    Audio.play('ropeThrow');
  },
  ropeLanded(r) {
    if (r.flyHit && this.state === 'active') {
      r.rope = 'locked'; r.stats.ropeHits++;
      const [ax, ay] = this.ankleWorld(r.side);
      FX.burst(ax, ay, 14, { color: ['#ffd21f', '#fff', '#d9a35a'], spMax: 220 });
      FX.ring(ax, ay, { r1: 60, color: '#ffd21f' });
      FX.text(ax, ay - 40, r.perfect ? 'PERFECT LOCK!' : 'ROPE LOCKED!', { color: r.perfect ? '#ffd21f' : '#fff', size: r.perfect ? 26 : 22 });
      if (r.perfect) r.stats.perfect++;
      this.addUlt(r.perfect ? 15 : 10);
      Audio.play('ropeLock'); FX.shake(3); FX.stop(0.04);
      const other = this.ropers[r === this.ropers[0] ? 1 : 0];
      if (other.rope === 'locked') { this.slip = 0; this.setState('pull'); }
      else { this.slip = M1_TUNE.slipTime; FX.text(other.x + 10, other.y - 100, 'YOUR TURN!', { color: '#ff2e88', size: 20 }); }
    } else {
      r.rope = 'none'; r.stats.ropeMiss++; r.cool = M1_TUNE.missCool;
      r.zoneC = rand(0.25, 0.75);
      const p = r.missPt || [r.x + 80, r.y - 40];
      this.debris.push({ x1: r.x + 14, y1: r.y - 48, x2: p[0], y2: p[1], t: 0, life: 0.6, burn: false });
      FX.text(p[0], p[1] - 20, pick(['WHIFF!', 'MISSED!', 'NOPE!', 'AIR BALL!']), { color: '#aaa', size: 22 });
      Audio.play('ropeMiss');
    }
  },
  pullTap(r) {
    if (r.ready > 0 && r.pull >= 100) { r.pull = 100; }
    r.pull = Math.min(100, r.pull + M1_TUNE.pullGain / S().m1.pullDiff);
    r.stats.pullTaps++;
    Audio.play(r.side === 'L' ? 'pullL' : 'pullR');
    if (Math.random() < 0.3) Audio.play('strain');
    const [ax, ay] = this.ankleWorld(r.side);
    FX.burst(lerp(r.x, ax, 0.5), lerp(r.y - 48, ay, 0.5), 2, { color: '#d9a35a', spMax: 90, sMax: 4, lifeMax: 0.3 });
  },
  ability(i) {
    if (this.state === 'intro' || this.state === 'win' || this.state === 'lose') return;
    const btn = this.ui.ab[i];
    if (i < 2) {
      const a = this.atkers[i];
      if (this.cds[i] > 0 || a.ko) return;
      this.cds[i] = i === 0 ? 4.0 : 7.0;
      a.anim = 'attack'; a.animT = 0.4;
      if (i === 0) {
        Audio.play('slash');
        const [tx, ty] = this.hitPoint();
        this.projs.push({ kind: 'wave', x: a.x + 20, y: a.y - 50, tx, ty, t: 0, dur: 0.22, onHit: () => this.dealDamage(a, 70, tx, ty, true) });
      } else {
        Audio.play('meteor');
        const [tx, ty] = this.hitPoint();
        this.projs.push({ kind: 'meteor', x: tx + 160, y: -40, tx, ty, t: 0, dur: 0.5, onHit: () => { this.dealDamage(a, 120, tx, ty, true); FX.fire(tx, ty, 30, { spMax: 260, grav: -100 }); FX.shake(8); Audio.play('bomb'); } });
      }
    } else {
      if (this.ult < 100) { FX.text(225, 560, 'BURST NOT CHARGED', { color: '#aaa', size: 16 }); return; }
      this.ult = 0;
      Audio.play('burst'); FX.doFlash(0.5, '#ff2e88'); FX.shake(12);
      Callout.show('CHAOS<br>BURST!', 'mag huge', 1.0);
      for (const h of this.heroes) if (!h.ko) { h.anim = h.kind === 'atk' ? 'attack' : 'cheer'; h.animT = 0.6; }
      const [tx, ty] = this.hitPoint();
      this.projs.push({ kind: 'burst', x: 160, y: 520, tx, ty, t: 0, dur: 0.35, onHit: () => {
        this.dealDamage(this.atkers[0], 130, tx, ty, true); this.dealDamage(this.atkers[1], 130, tx + 20, ty - 20, true);
        FX.burst(tx, ty, 50, { color: ['#ff2e88', '#ffd21f', '#fff', '#7a2cff'], spMax: 420, sMax: 9 }); FX.ring(tx, ty, { r1: 200, color: '#ff2e88', w: 14, life: 0.5 }); FX.stop(0.1);
      } });
    }
    if (btn) { btn.classList.remove('hit'); void btn.offsetWidth; btn.classList.add('hit'); }
  },
  addUlt(n) { this.ult = Math.min(100, this.ult + n); },
  hitPoint() {
    if (this.state === 'stun' || this.state === 'fall') { const [hx, hy] = this.headWorld(); return [hx + rand(-20, 20), hy + rand(-10, 20)]; }
    return bw(-10 + rand(-30, 30), -130 + rand(-20, 20));
  },
  dealDamage(src, base, x, y, big) {
    if (this.state === 'win' || this.state === 'lose') return;
    const stunned = this.state === 'stun' || this.state === 'fall';
    let mult = stunned ? M1_TUNE.stunMult * (1 + this.combo * M1_TUNE.comboStep) : M1_TUNE.chipMult;
    const dmg = Math.max(1, Math.round(base * mult * rand(0.9, 1.1)));
    this.bossHp = Math.max(0, this.bossHp - dmg); this.totalDmg += dmg; src.stats.dmg += dmg;
    this.addUlt(dmg / 60);
    this.pose.flash = 0.6;
    if (stunned) {
      this.combo++;
      if (this.ui.combo) { this.ui.combo.classList.remove('bump'); void this.ui.combo.offsetWidth; this.ui.combo.classList.add('bump'); }
      FX.text(x, y - 10, fmt(dmg), { color: big ? '#ffd21f' : '#fff', size: big ? 40 : 28, life: 1.0, vx: rand(-60, 60), vy: -140 });
      FX.burst(x, y, big ? 22 : 9, { color: ['#fff', '#ffd21f', '#ff6a13'], spMax: big ? 360 : 240 });
      if (big) { FX.stop(0.06); FX.shake(6); Audio.play('bigHit'); } else Audio.play('hit');
    } else {
      FX.text(x, y - 10, String(dmg), { color: '#9a9aa8', size: big ? 22 : 16, life: 0.6 });
      if (big) FX.text(x, y - 36, 'ARMORED!', { color: '#c8ccd6', size: 16, life: 0.7 });
      FX.burst(x, y, 4, { color: ['#c8ccd6', '#fff'], spMax: 140, sMax: 4 });
      Audio.play('hit');
    }
    if (!this.enraged && this.bossHp < this.bossMax * 0.35 && this.bossHp > 0) {
      this.enraged = true; Callout.show('ENRAGED!<small>FASTER ATTACKS · SHORTER BURN</small>', 'red', 1.4); Audio.play('roar');
    }
    if (this.bossHp <= 0) this.setState('win');
  },

  /* ---------------- UPDATE ---------------- */
  update(dt) {
    this.t += dt; this.stateT += dt;
    if (this.state !== 'intro' && this.state !== 'win' && this.state !== 'lose') this.time += dt;
    this.updateHeroes(dt);
    this.updateProjs(dt);
    const st = this.state;
    if (st === 'active') this.updateActive(dt);
    else if (st === 'pull') this.updatePull(dt);
    else if (st === 'burn') { if (this.stateT > 1.3) { this.setState('active'); this.atkTimer = 1.6; } }
    else if (st === 'fall') this.updateFall(dt);
    else if (st === 'stun') { if (this.stateT >= M1_TUNE.stunDur) this.setState('wake'); }
    else if (st === 'wake') this.updateWake(dt);
    else if (st === 'win' || st === 'lose') { if (this.stateT > 2.4 && !this.resultsShown) { this.resultsShown = true; this.showResults(); } }
    if (st !== 'win' && st !== 'lose') this.resultsShown = false;
    this.updatePose(dt);
    for (let i = 0; i < 2; i++) this.cds[i] = Math.max(0, this.cds[i] - dt);
    this.bossLag = this.bossLag > this.bossHp ? Math.max(this.bossHp, this.bossLag - this.bossMax * 0.25 * dt) : this.bossHp;
    for (let i = this.debris.length - 1; i >= 0; i--) { const d = this.debris[i]; d.t += dt; if (d.t > d.life) this.debris.splice(i, 1); }
    if (st !== 'win' && st !== 'lose' && st !== 'intro' && this.heroes.every((h) => h.ko)) this.setState('lose');
  },
  updateHeroes(dt) {
    for (const h of this.heroes) {
      h.flash = Math.max(0, h.flash - dt * 3);
      if (h.animT > 0) { h.animT -= dt; if (h.animT <= 0) h.anim = null; }
      h.stagger = Math.max(0, h.stagger - dt);
      if (h.ko) {
        h.koT -= dt;
        if (h.koT <= 0 && this.state !== 'win' && this.state !== 'lose') { h.ko = false; h.hp = Math.round(h.max * 0.4); FX.text(h.x, h.y - 90, 'BACK UP!', { color: '#4fe03a', size: 20 }); Audio.play('revive'); }
      }
      // movement toward target spot (attackers charge in during stun)
      let tx = h.hx, ty = h.hy;
      if (h.kind === 'atk' && (this.state === 'stun' || (this.state === 'fall' && this.stateT > 0.5)) && !h.ko) {
        const [hx, hy] = this.headWorld();
        tx = h === this.atkers[0] ? hx - 46 : hx + 30; ty = h === this.atkers[0] ? hy + 70 : hy + 96;
      }
      const sp = 900 * dt, dx = tx - h.x, dy = ty - h.y, d = Math.hypot(dx, dy);
      h.moving = d > 4;
      if (d > 1) { const k = Math.min(1, sp / d); h.x += dx * k; h.y += dy * k; }
    }
    // ropers
    for (let i = 0; i < 2; i++) {
      const r = this.ropers[i];
      r.cool = Math.max(0, r.cool - dt);
      if (this.state === 'active' && r.rope === 'none') {
        r.tpos += r.tdir * M1_TUNE.sweepSpeed * dt;
        if (r.tpos > 1) { r.tpos = 2 - r.tpos; r.tdir = -1; } else if (r.tpos < 0) { r.tpos = -r.tpos; r.tdir = 1; }
      }
      if (r.rope === 'flying') { r.flyT += dt; if (r.flyT >= 0.32) this.ropeLanded(r); }
      if (!this.isHuman(i)) this.updateAI(r, dt);
    }
    // attackers auto-attack
    for (const a of this.atkers) {
      if (a.ko || this.state === 'intro' || this.state === 'win' || this.state === 'lose' || this.state === 'burn') continue;
      if (a.moving) continue;
      const stun = this.state === 'stun';
      a.atkT -= dt * (stun ? 1.25 : 1);
      if (a.atkT <= 0) {
        a.atkT = a.rate * rand(0.9, 1.1);
        a.anim = 'attack'; a.animT = 0.3;
        const [tx, ty] = this.hitPoint();
        if (a.id === 'knight') {
          if (stun) { this.dealDamage(a, a.base, tx, ty, false); Audio.play('slash'); FX.burst(tx, ty, 6, { color: '#fff', type: 'spark', spMax: 300 }); }
          else this.projs.push({ kind: 'slash', x: a.x + 20, y: a.y - 50, tx, ty, t: 0, dur: 0.25, onHit: () => this.dealDamage(a, a.base, tx, ty, false) });
        } else {
          this.projs.push({ kind: 'bolt', x: a.x + 20, y: a.y - 80, tx, ty, t: 0, dur: stun ? 0.15 : 0.3, onHit: () => this.dealDamage(a, a.base, tx, ty, false) });
        }
      }
    }
  },
  updateAI(r, dt) {
    const q = M1_AI[S().m1.partner] || M1_AI.ai_ok;
    if (r.ko) return;
    if (this.canThrow(r)) {
      if (!r.ai) r.ai = { wait: rand(q.react[0], q.react[1]), succeed: Math.random() < q.hit };
      r.ai.wait -= dt;
      if (r.ai.wait <= 0) {
        const inZone = Math.abs(r.tpos - r.zoneC) <= M1_TUNE.zoneW / 2 - 0.02;
        if (r.ai.succeed ? inZone : !inZone) { r.ai = null; this.throwRope(r); }
        else if (r.ai.wait < -2.5) { r.ai = null; this.throwRope(r); }
      }
    } else if (this.state !== 'active' || r.rope !== 'none') r.ai = null;
    if (this.state === 'pull' && r.rope === 'locked') {
      if (r.aiDelay > 0) { r.aiDelay -= dt; return; }
      if (r.fumble > 0) { r.fumble -= dt; return; }
      if (Math.random() < q.fumble * dt) { r.fumble = rand(0.3, 0.6); FX.text(r.x, r.y - 100, pick(['OOPS!', 'MY HANDS!', 'SLIPPY!', 'UHH...']), { color: '#7ac8ff', size: 18 }); return; }
      r.aiTap -= dt;
      if (r.aiTap <= 0) { r.aiTap = 1 / (q.tps * rand(0.8, 1.2)); this.pullTap(r); }
    }
  },
  updateActive(dt) {
    // single-rope slip pressure
    const locked = this.ropers.filter((r) => r.rope === 'locked');
    if (locked.length === 1) {
      this.slip -= dt;
      if (this.slip <= 0) {
        const r = locked[0]; r.rope = 'none'; r.cool = 0.6; this.shakeOffs++;
        const [ax, ay] = this.ankleWorld(r.side);
        this.debris.push({ x1: r.x + 14, y1: r.y - 48, x2: ax, y2: ay, t: 0, life: 0.7, burn: false });
        FX.text(ax, ay - 40, 'SHOOK IT OFF!', { color: '#ff6a13', size: 24 }); Audio.play('ropeSnap'); FX.shake(5);
      }
    }
    // boss attack scheduler
    const freq = S().m1.atkFreq * (this.enraged ? 1.3 : 1);
    if (!this.atk) {
      this.atkTimer -= dt * freq;
      if (this.atkTimer <= 0) this.startAttack();
    } else {
      const a = this.atk; a.t += dt;
      if (a.t >= a.dur) this.resolveAttack();
    }
  },
  startAttack() {
    this.atkCount++;
    const alive = this.heroes.filter((h) => !h.ko);
    if (!alive.length) return;
    if (this.atkCount % M1_TUNE.aoeEvery === 0) {
      this.atk = { type: 'aoe', t: 0, dur: M1_TUNE.aoeTele };
      FX.text(160, 420, 'INCOMING!', { color: '#ff4a3a', size: 26, life: 1.2, vy: -20 });
      Audio.play('warn'); Audio.play('roar');
    } else {
      // prefer ropers that are throwing, so the boss creates roping tension
      const tgt = Math.random() < 0.55 ? pick(alive) : pick(alive.filter((h) => h.kind === 'roper').concat(alive));
      this.atk = { type: 'single', t: 0, dur: M1_TUNE.singleTele, target: tgt };
      Audio.play('warn');
    }
  },
  resolveAttack() {
    const a = this.atk; this.atk = null;
    this.atkTimer = rand(M1_TUNE.atkMin, M1_TUNE.atkMax);
    if (a.type === 'single') {
      const h = a.target; if (h.ko) return;
      const [mx, my] = this.mouthWorld();
      this.projs.push({ kind: 'fireball', x: mx, y: my, tx: h.x + 4, ty: h.y - 40, t: 0, dur: 0.22, onHit: () => {
        this.hurtHero(h, M1_TUNE.singleDmg); FX.fire(h.x, h.y - 40, 26, { spMax: 220, grav: -60 }); FX.ring(h.x, h.y - 30, { r1: 70, color: '#ff6a13' }); FX.shake(6); Audio.play('fire');
      } });
      Audio.play('fire');
    } else {
      this.poseT.lift = 12; FX.shake(14); FX.stop(0.08); Audio.play('stomp');
      for (const h of this.heroes) if (!h.ko) this.hurtHero(h, M1_TUNE.aoeDmg);
      FX.ring(170, 535, { r1: 260, color: '#ff6a13', w: 16, life: 0.5 });
      FX.dust(170, 540, 26, 220);
      const [lx, ly] = this.ankleWorld('L'); FX.dust(lx, ly, 10); const [rx, ry] = this.ankleWorld('R'); FX.dust(rx, ry, 10);
    }
  },
  hurtHero(h, dmg) {
    if (h.ko) return;
    h.hp = Math.max(0, h.hp - dmg); h.stats.taken += dmg; h.flash = 1; h.hurtFx = 0.3;
    FX.text(h.x, h.y - 96, '-' + dmg, { color: '#ff4a3a', size: 24 });
    Audio.play('hurt');
    if (h.hp <= 0) {
      h.ko = true; h.koT = M1_TUNE.koTime;
      FX.text(h.x, h.y - 110, 'KO!', { color: '#ff4a3a', size: 30 });
      if (h.kind === 'roper' && h.rope !== 'none') {
        if (this.state === 'pull') { this.setState('burn'); return; }
        const [ax, ay] = this.ankleWorld(h.side); this.debris.push({ x1: h.x + 14, y1: h.y - 48, x2: ax, y2: ay, t: 0, life: 0.7, burn: false }); h.rope = 'none';
      }
    }
  },
  updatePull(dt) {
    const [a, b] = this.ropers, d = S().m1.pullDiff;
    for (const r of this.ropers) {
      if (r.ko) { r.pull = Math.max(0, r.pull - 60 * dt); r.ready = 0; continue; }
      r.pull = Math.max(0, r.pull - M1_TUNE.pullDecay * d * dt);
      if (r.pull >= 99.5) r.ready = M1_TUNE.readyWin; else r.ready = Math.max(0, r.ready - dt);
    }
    // burn timer — accelerates if one side is ready and the other lags
    const lag = (a.ready > 0) !== (b.ready > 0) && Math.min(a.pull, b.pull) < 70;
    this.burnT -= dt * (lag ? 1.2 : 1);
    if (lag) {
      this.lagShout -= dt;
      if (this.lagShout <= 0) {
        this.lagShout = 1.1;
        const slow = a.ready > 0 ? b : a;
        FX.text(slow.x + 20, slow.y - 110, pick(['PULL YOUR SIDE!', 'COME ON!!', 'PUUULL!', 'HELLO?!']), { color: '#ff2e88', size: 22, life: 1.0 });
        FX.shake(3); Audio.play('strain');
      }
    }
    // fire charge VFX
    const heat = 1 - this.burnT / this.burnMax;
    if (Math.random() < heat * 0.8) { const [mx, my] = this.mouthWorld(); FX.fire(mx, my, 1 + Math.round(heat * 3), { spMax: 80 + heat * 100 }); }
    if (heat > 0.6 && Math.random() < 0.4) for (const r of this.ropers) { const [ax, ay] = this.ankleWorld(r.side); FX.fire(ax + rand(-10, 10), ay, 1, { spMax: 40, sMax: 8 }); }
    if (Math.floor(this.burnT * 4) !== Math.floor((this.burnT + dt) * 4) && this.burnT < 1.6) Audio.play('tick');
    if (a.ready > 0 && b.ready > 0) { this.setState('fall'); return; }
    if (this.burnT <= 0) this.setState('burn');
  },
  burnRopes(dmg, stag) {
    for (const r of this.ropers) {
      if (r.rope === 'none') continue;
      const [ax, ay] = this.ankleWorld(r.side);
      this.debris.push({ x1: r.x + 14, y1: r.y - 48, x2: ax, y2: ay, t: 0, life: 0.9, burn: true });
      for (let k = 0; k <= 8; k++) FX.fire(lerp(ax, r.x + 14, k / 8), lerp(ay, r.y - 48, k / 8), 3, { spMax: 90 });
      r.rope = 'none'; r.pull = 0; r.ready = 0;
      if (dmg) this.hurtHero(r, dmg);
      r.stagger = stag; r.anim = 'stagger'; r.animT = stag;
      r.zoneC = rand(0.25, 0.75);
    }
    const [mx, my] = this.mouthWorld();
    for (let k = 0; k < 4; k++) FX.fire(mx, my, 10, { angle: Math.PI * 0.8, spread: 0.8, spMin: 200, spMax: 420, grav: -40, sMax: 16, lifeMax: 0.6 });
    Audio.play('ropeSnap');
  },
  updateFall(dt) {
    if (this.stateT >= 0.45 && !this.crashed) {
      this.crashed = true;
      FX.shake(22); FX.stop(0.14); FX.doFlash(0.4); Audio.play('crash');
      const [hx, hy] = this.headWorld();
      FX.dust(hx, hy + 30, 40, 260); FX.dust(BX + 20, BY, 30, 300);
      FX.burst(hx, hy + 20, 26, { color: ['#7b5a48', '#3a1a14', '#ff6a13'], type: 'chunk', spMax: 380, up: 200, grav: 900, sMax: 10 });
      Callout.show('CRASH!', 'white huge', 0.8);
    }
    if (this.stateT >= 1.15) { this.crashed = false; this.setState('stun'); }
  },
  updateWake(dt) {
    if (this.stateT >= 0.45 && this.ropers.some((r) => r.rope !== 'none')) {
      FX.text(BX - 40, BY - 160, 'FIRE BREATH!', { color: '#ff6a13', size: 24 });
      Audio.play('fire'); FX.shake(8);
      this.burnRopes(6, 0.6);
    }
    if (this.stateT >= 1.3) { this.setState('active'); this.atkTimer = 2.0; }
  },

  /* ---------------- POSE / GEOMETRY ---------------- */
  updatePose(dt) {
    const P = this.pose, T = this.basePose(), t = this.t, st = this.state;
    T.lift = Math.sin(t * 2) * 3;
    if (st === 'active' || st === 'intro') {
      const rl = this.ropers[0].rope === 'locked', rr = this.ropers[1].rope === 'locked';
      if (!rl) T.legLx = Math.sin(t * 1.3) * 7; if (!rr) T.legRx = Math.sin(t * 1.3 + 2) * 7;
      if (rl || rr) { T.legLx += rl ? Math.sin(t * 30) * 1.5 : 0; T.legRx += rr ? Math.sin(t * 30) * 1.5 : 0; }
      if (this.atk) {
        const k = clamp(this.atk.t / this.atk.dur, 0, 1);
        if (this.atk.type === 'single') { T.jaw = 0.3 + k * 0.7; T.heat = k; T.headRot = -0.12 * k; T.headX = -10 * k; }
        else { T.lift = -46 * Ease.inOut(k); T.rot = 0.05 * k; T.jaw = 0.8; T.heat = 0.3; }
      }
    }
    if (st === 'pull') {
      const [a, b] = this.ropers, heat = 1 - this.burnT / this.burnMax;
      T.legLx = -a.pull * 0.38; T.legLy = a.pull * 0.12; T.legRx = -b.pull * 0.3; T.legRy = b.pull * 0.2;
      T.jaw = 0.4 + heat * 0.6; T.heat = heat; T.rot = Math.sin(t * 25) * 0.015 * (1 + heat); T.lift = -6 + Math.sin(t * 22) * 2;
      T.eyes = heat > 0.6 ? 'glow' : 'angry';
    }
    if (st === 'burn') { T.jaw = 1; T.heat = Math.max(0, 1 - this.stateT); T.lift = -10; }
    if (st === 'fall') {
      const k = Ease.outBounce(clamp(this.stateT / 0.55, 0, 1));
      T.lift = 70 * k; T.rot = -0.13 * k; T.headY = 62 * k; T.headRot = 0.25 * k; T.squash = 1 - 0.18 * k;
      T.legLx = -60 * k; T.legRx = 55 * k; T.legLy = 6 * k; T.jaw = 0.6; T.eyes = k > 0.6 ? 'dizzy' : 'angry'; T.tongue = k;
      Object.assign(P, T); P.flash = Math.max(0, (P.flash || 0) - dt * 3); return;
    }
    if (st === 'stun') {
      T.lift = 70 + Math.sin(t * 3) * 2; T.rot = -0.13; T.headY = 62; T.headRot = 0.25 + Math.sin(t * 4) * 0.05; T.squash = 0.82;
      T.legLx = -60; T.legRx = 55; T.legLy = 6; T.jaw = 0.55; T.eyes = 'dizzy'; T.tongue = 1 + Math.sin(t * 6) * 0.2; T.shadowS = 1.1;

  },
  heroState(h) {
    if (h.ko) return 'KO · ' + Math.ceil(h.koT) + 's';
    const st = this.state;
    if (h.kind === 'roper') {
      if (h.stagger > 0) return 'STAGGERED';
      if (st === 'pull' && h.rope === 'locked') return h.ready > 0 ? 'MAX PULL!' : 'PULLING ' + Math.round(h.pull) + '%';
      if (h.rope === 'locked') return 'ROPE LOCKED';

    const line = (h) => h.kind === 'roper'
      ? `ROPES <em>${h.stats.ropeHits}</em> hit / ${h.stats.ropeMiss} miss (${h.stats.perfect} perfect) · PULL <em>${h.stats.pullTaps}</em> taps · TOOK ${h.stats.taken}`
      : `DAMAGE <em>${fmt(h.stats.dmg)}</em> · TOOK ${h.stats.taken}`;
    if (win) { const b = Save.data.best.m1; if (!b || this.time < b) { Save.data.best.m1 = this.time; Save.save(); } }
    const r = $('#results');
    r.innerHTML = `<div class="res-title ${win ? '' : 'lose'}">${win ? 'MONSTER<br>DOWN!' : 'TEAM<br>ROASTED'}</div>
      <div class="panel"><div class="panel-in">
        <div class="res-grid">

          <div><span>TIME SURVIVED</span><b>${fmtTime(this.time)}</b></div>
          <div><span>TAKEDOWNS</span><b>${this.takedowns}</b></div>
          <div><span>ROPES BURNED</span><b>${this.ropesBurned}</b></div>
          <div><span>TOTAL DAMAGE</span><b>${fmt(this.totalDmg)}</b></div>
          <div><span>BEST COMBO</span><b>${Math.max(this.comboBest, this.combo)}</b></div>
          <div><span>BOSS HP LEFT</span><b>${Math.round(this.bossHp / this.bossMax * 100)}%</b></div>
          <div><span>SHAKE-OFFS</span><b>${this.shakeOffs}</b></div>
        </div>
        <div class="res-heroes">${H.map((h) => `<div class="res-hero"><img src="${heroPortrait(h.id)}" alt=""><div class="rh">${h.name} <small style="display:inline;color:#7ac8ff">${h.role}</small>${award(h)}<small>${line(h)}</small></div></div>`).join('')}</div>
      </div></div>
      <div class="lab-actions"><button class="btn btn-play" id="resRetry">RETRY</button><button class="btn btn-small btn-dark" id="resMenu">MENU</button></div>`;
    r.classList.remove('hidden');
    press($('#resRetry'), () => this.reset(true));
    press($('#resMenu'), () => Main.toMenu());
  },
};

function ropeLine(ctx, x1, y1, x2, y2, sag, vib, burn, t) {
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2 + sag;
  const ang = Math.atan2(y2 - y1, x2 - x1), nx = -Math.sin(ang), ny = Math.cos(ang);
  const v = vib ? Math.sin(t * 55) * vib : 0;
  const cx = mx + nx * v, cy = my + ny * v;
  ctx.lineCap = 'round';
  if (burn > 0.05) { ctx.strokeStyle = 'rgba(255,106,19,' + (burn * 0.6) + ')'; ctx.lineWidth = 10 + burn * 12; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.quadraticCurveTo(cx, cy, x2, y2); ctx.stroke(); }
  ctx.strokeStyle = OL; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.quadraticCurveTo(cx, cy, x2, y2); ctx.stroke();
  ctx.strokeStyle = burn > 0.75 ? '#ff8a3a' : '#d9a35a'; ctx.lineWidth = 4.5; ctx.stroke();
  ctx.strokeStyle = '#8a5a2a'; ctx.lineWidth = 4.5; ctx.setLineDash([3, 6]); ctx.lineDashOffset = -t * 20; ctx.stroke(); ctx.setLineDash([]);
}

   MODE 2 — HELL CHASE
   FSM: intro → play → (caught | dead | slain) → results

const M2_TUNE = {

const M2 = {

  startRun() { this.setState('play'); Callout.show('RUN!', 'huge', 0.9); Audio.play('roar'); this.nextWave(); },
  get itemMode() { return S().m2.itemMode; },

  /* ---------------- INPUT ---------------- */
  onKey(k, e) {

    if (k === '1') this.skill(0);

  },
  onTap(x, y) {
    if (this.state !== 'play' || y > 600) return;

    for (const e of this.enemies) { if (e.hp <= 0 || e.y < 0) continue; const d = dist2(x, y, e.x, e.y - 26 * e.scale); if (d < bd) { bd = d; best = e; } }

  },
  strike(e) {
    if (this.strikeT > 0 || this.state !== 'play') return;
    this.strikeT = 0.09; this.focus = e;
    const k = this.party[0]; k.anim = 0.25;
    this.hitEnemy(e, 16, 'strike');
    FX.burst(e.x, e.y - 26, 7, { color: ['#fff', '#ffd21f'], spMax: 260 });

  },
  skill(i) {
    if (this.state !== 'play') return;
    const btn = this.ui.ab[i];
    if (i < 3 && this.cds[i] > 0) return;
    if (i === 3 && this.ult < 100) return;
    const alive = this.enemies.filter((e) => e.hp > 0 && e.y > -10);
    if (i === 0) {
      this.cds[0] = 5; this.party[0].anim = 0.4; Audio.play('slash'); Audio.play('bigHit');
      FX.ring(this.party[0].x, this.party[0].y - 30, { r1: 140, color: '#7ac8ff', w: 14 });
      for (const e of alive) if (dist2(e.x, e.y, this.party[0].x, this.party[0].y) < 150 * 150) { this.hitEnemy(e, 60, 'skill'); e.y -= 36; }
      FX.shake(5);
      if (this.hunter.visible && this.hunter.dist < 14) this.hurtHunter(25, this.hunter.x, this.hunterY() - 120);
    } else if (i === 1) {
      this.cds[1] = 8; this.party[1].anim = 0.4; Audio.play('arrow');
      for (const e of alive) { const tx = e.x, ty = e.y - 24; this.projs.push({ kind: 'rain', x: tx + rand(-30, 30), y: -20, tx, ty, t: -rand(0, 0.25), dur: 0.3, onHit: () => { if (e.hp > 0) this.hitEnemy(e, 40, 'skill'); } }); }
      if (!alive.length) FX.text(225, 300, 'NO TARGETS', { color: '#aaa', size: 16 });
    } else if (i === 2) {
      this.cds[2] = 10; this.party[2].anim = 0.4;
      let best = null, bc = -1;
      for (const e of alive) { let c = 0; for (const o of alive) if (dist2(e.x, e.y, o.x, o.y) < 95 * 95) c++; if (c > bc) { bc = c; best = e; } }
      const tx = best ? best.x : 225, ty = best ? best.y - 20 : 250;
      this.projs.push({ kind: 'bomb', x: this.party[2].x, y: this.party[2].y - 50, tx, ty, t: 0, dur: 0.45, onHit: () => {
        Audio.play('bomb'); FX.shake(9); FX.fire(tx, ty, 30, { spMax: 300, grav: -60 }); FX.ring(tx, ty, { r1: 100, color: '#ff6a13', w: 14 });
        for (const e of this.enemies) if (e.hp > 0 && dist2(e.x, e.y - 20, tx, ty) < 100 * 100) this.hitEnemy(e, 100, 'skill');
      } });
    } else {
      this.ult = 0; Audio.play('ult'); FX.doFlash(0.6, '#ffd21f'); FX.shake(14);
      Callout.show('CHAOS<br>RAMPAGE!', 'huge mag', 1.0);
      for (const p of this.party) p.anim = 0.6;
      for (const e of alive) { FX.fire(e.x, e.y - 20, 12, { spMax: 200 }); this.hitEnemy(e, 150, 'skill'); }
      this.rollDrop(PARTY_X, PARTY_Y - 120, 'rare');
    }
    if (btn) { btn.classList.remove('hit'); void btn.offsetWidth; btn.classList.add('hit'); }
  },

  /* ---------------- WAVES / ENEMIES ---------------- */
  nextWave() {
    if (this.wave > 0 && this.enemies.length === 0) {
      this.stats.wavesCleared++;
      this.hp = Math.min(this.hpMax, this.hp + 20);
      if (this.waveClock < M2_TUNE.quickClear) { this.stats.quick++; this.pushHunter(M2_TUNE.quickBonus, 'QUICK CLEAR'); FX.text(225, 250, 'QUICK CLEAR! +' + M2_TUNE.quickBonus + 'm', { color: '#4fe03a', size: 24 }); }
    }
    this.wave++; this.waveClock = 0; this.waveT = M2_TUNE.waveTimer;
    const n = this.wave, count = Math.min(3 + n, 11);
    const pool = n === 1 ? ['slime'] : n === 2 ? ['slime', 'goblin'] : n === 3 ? ['slime', 'goblin', 'skeleton'] : ['slime', 'goblin', 'skeleton', 'skeleton', 'imp', 'goblin'];
    for (let i = 0; i < count; i++) this.spawnQ.push({ type: pick(pool), delay: i * rand(0.18, 0.35) });
    if (n % 3 === 0) { this.spawnQ.push({ type: 'brute', delay: 0.6 }); }
    if (n > 1) Callout.show('WAVE ' + n + (n % 3 === 0 ? '<small>ELITE INCOMING</small>' : ''), 'low', 1.0);
  },
  spawn(type) {
    const def = ENEMY_DEF[type], hpM = 1 + this.time / 120;
    const e = { type, def, x: rand(100, 350), y: rand(-60, -20), hp: Math.round(def.hp * hpM), max: Math.round(def.hp * hpM), atkT: rand(0.5, 1.2), flash: 0, lunge: 0, seed: rand(0, 10), scale: def.elite ? 1 : 0.9, dmgM: 1 + this.time / 180 };
    e.ex = clamp(e.x + rand(-40, 40), 110, 340);
    e.ey = def.ranged ? rand(170, 240) : rand(352, 376);
    if (def.elite) { e.ex = clamp(e.ex, 150, 300); e.ey = 340; }
    this.enemies.push(e);
  },
  nearestEnemy() { let b = null, bd = 1e9; for (const e of this.enemies) { if (e.hp <= 0 || e.y < 0) continue; const d = dist2(e.x, e.y, PARTY_X, PARTY_Y); if (d < bd) { bd = d; b = e; } } return b; },
  hitEnemy(e, dmg, src) {
    if (e.hp <= 0) return;
    e.hp -= dmg; e.flash = 0.25;
    this.ult = Math.min(100, this.ult + dmg / 16);
    FX.text(e.x + rand(-10, 10), e.y - 50 * e.scale, String(Math.round(dmg)), { color: src === 'skill' ? '#ffd21f' : '#fff', size: src === 'skill' ? 22 : 17, life: 0.55 });
    if (src !== 'arrow') Audio.play('hit');
    if (e.hp <= 0) this.killEnemy(e);
  },
  killEnemy(e) {
    this.kills++; this.gold += e.def.elite ? 120 : randi(8, 18);
    FX.burst(e.x, e.y - 20, e.def.elite ? 40 : 16, { color: e.type === 'slime' ? ['#58d33a', '#9aff6a'] : e.type === 'skeleton' ? ['#efe8d6', '#fff'] : ['#ff6a13', '#ffd21f', '#e8322a'], spMax: 300, type: e.type === 'skeleton' ? 'chunk' : 'spark', sMax: e.def.elite ? 10 : 7 });
    Audio.play(e.type === 'slime' ? 'splat' : 'hit'); Audio.play('coin');
    if (e.def.elite) { FX.shake(8); FX.stop(0.08); this.rollDrop(e.x, e.y - 60, 'rare'); }
    else if (Math.random() < M2_TUNE.dropChance * S().m2.dropRate) this.rollDrop(e.x, e.y - 50, null);
    if (this.focus === e) this.focus = null;
  },
  updateEnemies(dt) {
    for (let i = this.spawnQ.length - 1; i >= 0; i--) { const s = this.spawnQ[i]; s.delay -= dt; if (s.delay <= 0) { this.spawn(s.type); this.spawnQ.splice(i, 1); } }
    for (let i = this.enemies.length - 1; i >= 0; i--) {
      const e = this.enemies[i];
      if (e.hp <= 0) { this.enemies.splice(i, 1); continue; }
      e.flash = Math.max(0, e.flash - dt); e.lunge = Math.max(0, e.lunge - dt * 4);
      const dx = e.ex - e.x, dy = e.ey - e.y, d = Math.hypot(dx, dy);
      if (d > 3) { const sp = (e.def.spd + 40) * dt; e.x += dx / d * Math.min(sp, d); e.y += dy / d * Math.min(sp, d); e.flip = dx < -2; }
      else {
        e.atkT -= dt;
        if (e.atkT <= 0) {
          e.atkT = e.def.rate * rand(0.85, 1.15);
          const dmg = Math.round(e.def.dmg * e.dmgM);
          if (e.def.ranged) { this.projs.push({ kind: 'efire', x: e.x, y: e.y - 40, tx: PARTY_X + rand(-30, 30), ty: PARTY_Y - 40, t: 0, dur: 0.55, onHit: () => this.hurtParty(dmg) }); }
          else { e.lunge = 1; this.hurtParty(dmg); FX.burst(e.x, e.y + 10, 5, { color: '#ff4a3a', spMax: 160 }); }
        }
      }
    }
    // next wave
    this.waveClock += dt; this.waveT -= dt;
    if ((this.enemies.length === 0 && this.spawnQ.length === 0) || this.waveT <= 0) {
      if (!this.waveGap) this.waveGap = this.enemies.length === 0 ? 0.7 : 0.01;
      this.waveGap -= dt;
      if (this.waveGap <= 0) { this.waveGap = 0; this.nextWave(); }
    }
  },
  hurtParty(dmg) {
    if (this.state !== 'play') return;
    this.hp = Math.max(0, this.hp - dmg); this.stats.dmgTaken += dmg;
    const p = pick(this.party); p.flash = 1;
    FX.text(p.x, p.y - 96, '-' + dmg, { color: '#ff4a3a', size: 20, life: 0.6 });
    Audio.play('hurt');
    if (this.hp <= 0) this.setState('dead');
  },
  updateParty(dt) {
    this.strikeT = Math.max(0, this.strikeT - dt);
    for (const p of this.party) { p.anim = Math.max(0, p.anim - dt); p.flash = Math.max(0, p.flash - dt * 3); }
    const alive = this.enemies.filter((e) => e.hp > 0 && e.y > 20);
    if (!alive.length) return;
    const focus = this.focus && this.focus.hp > 0 ? this.focus : null;
    // knight melee sweep
    const k = this.party[0]; k.atkT -= dt;
    if (k.atkT <= 0) {
      const near = alive.filter((e) => dist2(e.x, e.y, k.x, k.y) < 105 * 105);
      if (near.length) { k.atkT = 0.8; k.anim = 0.25; Audio.play('slash'); for (const e of near) this.hitEnemy(e, 14, 'auto'); FX.burst(k.x + 10, k.y - 50, 5, { color: '#fff', spMax: 200 }); }
      else k.atkT = 0.1;
    }
    // archer arrows
    const a = this.party[1]; a.atkT -= dt;
    if (a.atkT <= 0) {
      a.atkT = 0.75; a.anim = 0.2;
      const tgt = focus || alive.reduce((b, e) => (e.y > b.y ? e : b), alive[0]);
      this.projs.push({ kind: 'arrow', x: a.x, y: a.y - 60, tx: tgt.x, ty: tgt.y - 26, t: 0, dur: 0.18, target: tgt, onHit: () => { if (tgt.hp > 0) this.hitEnemy(tgt, 12, 'arrow'); } });
      Audio.play('arrow');
    }
    // scrub rocks
    const s = this.party[2]; s.atkT -= dt;
    if (s.atkT <= 0) {
      s.atkT = 1.2; s.anim = 0.2;
      const tgt = focus || pick(alive);
      this.projs.push({ kind: 'rock', x: s.x, y: s.y - 60, tx: tgt.x, ty: tgt.y - 24, t: 0, dur: 0.35, onHit: () => { if (tgt.hp > 0) this.hitEnemy(tgt, 10, 'auto'); } });
    }
  },

  /* ---------------- CHASE ITEMS ---------------- */
  rollDrop(x, y, minR) {
    const tb = this.time;
    let r = 'common';
